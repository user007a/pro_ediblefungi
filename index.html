<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0;url=html/portal.html">
    <title>食用菌工厂化农业数据管理平台</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle at 50% 0%, #1d5b40 0%, #0e3626 45%, #08211a 100%);
            color: #fff;
        }
        .loading {
            text-align: center;
        }
        .loading h1 {
            font-size: 26px;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        .loading p {
            font-size: 14px;
            opacity: 0.8;
            letter-spacing: .5px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.25);
            border-top-color: #b8f5d6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #b8f5d6;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <h1>食用菌工厂化农业数据管理平台</h1>
        <p>正在进入平台统一门户...</p>
        <p>如未自动跳转，请 <a href="html/portal.html">点击这里</a></p>
    </div>
</body>
</html>
