<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>食用菌环境监测系统 - 设备报修</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <script src="js/mobile-store.js"></script>
  <style>
    /* ===== 菌菇工厂主题 v2.1：中性画布 + 品牌棕点缀（头部/主按钮/选中态）；
       状态色用设计系统惯例绿/琥珀/红/蓝，全棕暖调仅消费者追溯 H5 使用 ===== */
    :root {
      --bg: #FAF9F7;
      --text: #26221E;
      --text-secondary: #55504A;
      --text-tertiary: #7A7268;
      --border: #E6E1D8;
      --border-light: #F0EDE7;
      --shadow-card: 0 2px 12px rgba(69, 48, 35, 0.08);
    }

    body { background: var(--bg); }

    .wrap { max-width: 750px; margin: 0 auto; padding-bottom: 32px; }

    /* ===== 统计 ===== */
    .stat-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 14px 14px 0;
    }
    .stat-card {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 12px 8px;
      text-align: center;
    }
    .stat-num {
      font-size: 26px;
      line-height: 1.15;
      font-weight: 700;
      font-family: var(--font-family-number);
    }
    .stat-label {
      margin-top: 3px;
      font-size: var(--font-xs);
      color: var(--text-secondary);
    }
    .stat-card.wait .stat-num { color: var(--warning-dark); }
    .stat-card.doing .stat-num { color: var(--info); }
    .stat-card.done .stat-num { color: var(--success-dark); }

    /* ===== 卡片 ===== */
    .content { padding: 12px 14px 0; }
    .card {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .card-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: var(--font-md);
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
    }
    .card-title::before {
      content: '';
      width: 3px;
      height: 14px;
      border-radius: 2px;
      background: var(--primary);
    }

    /* ===== 表单 ===== */
    .form-item { margin-bottom: 13px; }
    .form-label {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 6px;
      font-size: var(--font-xs);
      font-weight: 500;
      color: var(--text-secondary);
    }
    .form-label .req { color: var(--error); }
    .form-select,
    .form-input,
    .form-textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-white);
      color: var(--text);
      font-size: var(--font-base);
      font-family: var(--font-family);
      outline: none;
      transition: border-color var(--transition-fast);
    }
    .form-select:focus,
    .form-input:focus,
    .form-textarea:focus { border-color: var(--primary); }
    .form-textarea {
      resize: vertical;
      min-height: 78px;
      line-height: 1.5;
    }
    .form-hint {
      margin-top: 5px;
      font-size: var(--font-2xs);
      color: var(--text-tertiary);
    }

    .urgency-row { display: flex; gap: 8px; }
    .urgency-opt {
      flex: 1;
      text-align: center;
      padding: 9px 0;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg-white);
      color: var(--text-secondary);
      font-size: var(--font-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .urgency-opt.active {
      font-weight: 600;
      background: var(--primary-50);
      border-color: var(--primary);
      color: var(--primary-700);
    }
    .urgency-opt[data-urg="urgent"].active {
      background: var(--warning-light);
      border-color: var(--warning);
      color: var(--warning-dark);
    }
    .urgency-opt[data-urg="stop"].active {
      background: var(--error-light);
      background: color-mix(in srgb, var(--error) 10%, #fff);
      border-color: var(--error);
      color: var(--error);
    }
    .stop-warn {
      display: none;
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      background: var(--error-light);
      background: color-mix(in srgb, var(--error) 8%, #fff);
      color: var(--error);
      font-size: var(--font-2xs);
      line-height: 1.5;
    }
    .stop-warn.show { display: block; }

    .photo-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }
    .photo-item {
      position: relative;
      width: 92px;
      height: 66px;
      flex-shrink: 0;
      border-radius: var(--radius-md);
      border: 2px solid transparent;
      overflow: hidden;
      background: var(--primary-50);
      cursor: pointer;
    }
    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .photo-item.active { border-color: var(--primary); }
    .photo-check {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 18px;
      line-height: 18px;
      text-align: center;
      font-size: 10px;
      color: var(--text-on-primary);
      background: var(--primary-700);
    }
    .photo-item.active .photo-check { display: block; }

    .reporter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      margin-bottom: 12px;
      border-radius: var(--radius-md);
      background: var(--primary-50);
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }
    .reporter-row b { color: var(--text); font-weight: 600; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 46px;
      border: none;
      border-radius: var(--radius-lg);
      font-size: var(--font-md);
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity var(--transition-fast);
    }
    .btn:active { opacity: 0.88; }
    .btn-primary {
      background: var(--gradient-primary);
      color: var(--text-on-primary);
      box-shadow: 0 2px 10px rgba(107, 75, 53, 0.22);
    }
    .btn-ghost {
      background: var(--primary-50);
      border: 1px solid var(--primary-200);
      color: var(--primary-700);
    }

    /* ===== 工单列表 ===== */
    .list-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .list-head .card-title { margin-bottom: 0; }
    .chip-scroll {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }
    .list-filter { margin-bottom: 10px; }
    .chip {
      flex-shrink: 0;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-light);
      background: var(--primary-50);
      color: var(--text-secondary);
      font-size: var(--font-2xs);
      line-height: 1.7;
      white-space: nowrap;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .chip.active {
      background: var(--gradient-primary);
      border-color: transparent;
      color: var(--text-on-primary);
      font-weight: 600;
    }

    .order-card {
      position: relative;
      overflow: hidden;
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 12px 13px 11px 17px;
      margin-bottom: 9px;
      cursor: pointer;
      transition: transform var(--transition-fast);
    }
    .order-card:active { transform: scale(0.99); }
    .order-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--warning);
    }
    .order-card.st-repairing::before { background: var(--info); }
    .order-card.st-done::before { background: var(--success-dark); }

    .order-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }
    .order-no {
      font-size: var(--font-2xs);
      font-family: var(--font-family-mono);
      color: var(--text-tertiary);
    }
    .urg-badge {
      font-size: var(--font-2xs);
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      white-space: nowrap;
    }
    .u-normal { background: var(--primary-50); color: var(--primary-700); }
    .u-urgent { background: var(--warning-light); color: var(--warning-dark); }
    .u-stop {
      background: var(--error-light);
      background: color-mix(in srgb, var(--error) 10%, #fff);
      color: var(--error);
    }
    .order-device {
      font-size: var(--font-base);
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }
    .order-circuit {
      margin-left: 6px;
      font-size: var(--font-2xs);
      font-weight: 400;
      color: var(--text-tertiary);
    }
    .order-desc {
      margin-top: 4px;
      font-size: var(--font-xs);
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .order-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-light);
    }
    .order-meta {
      font-size: var(--font-2xs);
      color: var(--text-tertiary);
    }
    .st-badge {
      font-size: var(--font-2xs);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-weight: 600;
      white-space: nowrap;
    }
    .st-badge.pending { background: var(--warning-light); color: var(--warning-dark); }
    .st-badge.repairing {
      background: var(--info-light);
      background: color-mix(in srgb, var(--info) 12%, #fff);
      color: var(--info);
    }
    .st-badge.done { background: var(--success-light); color: var(--success-dark); }
    .st-badge.sync {
      background: var(--gray-100);
      color: var(--text-secondary);
      margin-left: 5px;
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: var(--font-sm);
      background: var(--bg-white);
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
    }
    .empty svg {
      width: 40px;
      height: 40px;
      color: var(--primary-300);
      margin-bottom: 8px;
    }

    /* ===== 底部抽屉 ===== */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      z-index: 400;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(44, 32, 22, 0.5);
      opacity: 0;
      visibility: hidden;
      transition: opacity var(--transition-normal), visibility var(--transition-normal);
    }
    .sheet-overlay.show { opacity: 1; visibility: visible; }
    .sheet {
      width: 100%;
      max-width: 750px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--bg-white);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      padding: 16px 16px calc(22px + env(safe-area-inset-bottom, 0px));
      transform: translateY(26px);
      transition: transform var(--transition-normal);
    }
    .sheet-overlay.show .sheet { transform: translateY(0); }
    .sheet-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .sheet-title {
      font-size: var(--font-md);
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
    }
    .sheet-sub {
      margin-top: 3px;
      font-size: var(--font-xs);
      color: var(--text-tertiary);
    }
    .sheet-close {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      background: var(--primary-50);
      color: var(--text-secondary);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detail-box {
      margin: 10px 0 14px;
      padding: 10px 12px;
      background: var(--primary-50);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
    }
    .detail-box + .detail-box { margin-top: 0; }
    .detail-box-title {
      font-size: var(--font-xs);
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .detail-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 3px 0;
      font-size: var(--font-sm);
    }
    .detail-row .k { color: var(--text-secondary); flex-shrink: 0; }
    .detail-row .v {
      color: var(--text);
      font-weight: 500;
      text-align: right;
      word-break: break-all;
      white-space: pre-wrap;
    }
    .detail-row .v.warn { color: var(--error); }

    .photo-preview {
      margin-bottom: 12px;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .photo-preview img {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
    }
    .sheet-actions { margin-top: 16px; }
    .sheet-actions .btn + .btn { margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mb-back-bar">
      <button class="mb-back-arrow" type="button" onclick="goHome()" aria-label="返回首页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="mb-back-title">设备报修</div>
    </div>

    <div class="stat-row">
      <div class="stat-card wait">
        <div class="stat-num" id="statPending">0</div>
        <div class="stat-label">待受理</div>
      </div>
      <div class="stat-card doing">
        <div class="stat-num" id="statRepairing">0</div>
        <div class="stat-label">维修中</div>
      </div>
      <div class="stat-card done">
        <div class="stat-num" id="statDone">0</div>
        <div class="stat-label">今日完成</div>
      </div>
    </div>

    <div class="content">
      <div class="card">
        <div class="card-title">提交报修</div>
        <div class="form-item">
          <div class="form-label">报修设备 <span class="req">*</span></div>
          <select class="form-select" id="fDevice">
            <option value="">请选择报修设备</option>
            <option value="DO-01">风冷热泵 1#（DO-01）</option>
            <option value="DO-02">风冷热泵 2#（DO-02）</option>
            <option value="DO-03">超声波加湿器 5#（DO-03）</option>
            <option value="DO-04">新风风机（DO-04）</option>
            <option value="DO-05">循环风机 2#（DO-05）</option>
            <option value="DO-06">LED 补光灯 3#（DO-06）</option>
          </select>
        </div>
        <div class="form-item">
          <div class="form-label">故障现象 <span class="req">*</span></div>
          <textarea class="form-textarea" id="fDesc" maxlength="200" placeholder="请描述故障现象，如异响、停机、温控异常等"></textarea>
          <div class="form-hint">不少于 5 个字</div>
        </div>
        <div class="form-item">
          <div class="form-label">紧急程度 <span class="req">*</span></div>
          <div class="urgency-row" id="urgencyRow">
            <div class="urgency-opt" data-urg="normal" onclick="setUrgency('normal')">一般</div>
            <div class="urgency-opt" data-urg="urgent" onclick="setUrgency('urgent')">紧急</div>
            <div class="urgency-opt" data-urg="stop" onclick="setUrgency('stop')">停机</div>
          </div>
          <div class="stop-warn" id="stopWarn">停机报修将影响本房环境调控，请确认现场安全后提交。</div>
        </div>
        <div class="form-item">
          <div class="form-label">联系电话 <span class="req">*</span></div>
          <input class="form-input" id="fPhone" type="tel" maxlength="11" value="13800000002" placeholder="请输入 11 位手机号">
        </div>
        <div class="form-item">
          <div class="form-label">现场照片（选填）</div>
          <div class="photo-row" id="photoRow">
            <div class="photo-item" data-photo="../applefarm_h5/images/trace_sterilize.jpg" onclick="togglePhoto(this)">
              <img src="../applefarm_h5/images/trace_sterilize.jpg" alt="灭菌间现场">
              <span class="photo-check">已选</span>
            </div>
            <div class="photo-item" data-photo="../applefarm_h5/images/trace_monitor.jpg" onclick="togglePhoto(this)">
              <img src="../applefarm_h5/images/trace_monitor.jpg" alt="环境监测设备现场">
              <span class="photo-check">已选</span>
            </div>
            <div class="photo-item" data-photo="../applefarm_h5/images/trace_incubate.jpg" onclick="togglePhoto(this)">
              <img src="../applefarm_h5/images/trace_incubate.jpg" alt="培养房现场">
              <span class="photo-check">已选</span>
            </div>
          </div>
        </div>
        <div class="reporter-row">
          <span>报修人</span>
          <b id="reporterName">李国强</b>
        </div>
        <button class="btn btn-primary" type="button" onclick="submitOrder()">提交报修</button>
      </div>

      <div class="card">
        <div class="list-head">
          <div class="card-title">维修工单</div>
        </div>
        <div class="chip-scroll list-filter" id="orderChips">
          <div class="chip active" data-status="all" onclick="setOrderFilter('all')">全部</div>
          <div class="chip" data-status="pending" onclick="setOrderFilter('pending')">待受理</div>
          <div class="chip" data-status="repairing" onclick="setOrderFilter('repairing')">维修中</div>
          <div class="chip" data-status="done" onclick="setOrderFilter('done')">已完成</div>
        </div>
        <div id="orderList"></div>
      </div>
    </div>
  </div>

  <div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this)closeSheet()">
    <div class="sheet" id="sheet"></div>
  </div>

  <script>
    /* ============================================================
     * 设备报修（移动端）
     * 数据源：localStorage['mushroom_repair_orders']
     * 与 mb_alert.html 的转工单共用同一存储键
     * ============================================================ */
    var ORDER_KEY = 'mushroom_repair_orders';

    var DEVICES = [
      { code: 'DO-01', name: '风冷热泵 1#' },
      { code: 'DO-02', name: '风冷热泵 2#' },
      { code: 'DO-03', name: '超声波加湿器 5#' },
      { code: 'DO-04', name: '新风风机' },
      { code: 'DO-05', name: '循环风机 2#' },
      { code: 'DO-06', name: 'LED 补光灯 3#' }
    ];
    var STATUS_TEXT = { pending: '待受理', repairing: '维修中', done: '已完成' };
    var URGENCY_TEXT = { normal: '一般', urgent: '紧急', stop: '停机' };

    var orders = [];
    var filterStatus = 'all';
    var urgency = '';
    var selectedPhoto = '';
    var currentOrderId = null;
    var repairMode = false;

    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function dateStr(d) {
      d = d || new Date();
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }
    function nowStr() {
      var d = new Date();
      return dateStr(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function getUser() {
      try { return sessionStorage.getItem('loginUser') || '李国强'; } catch (e) { return '李国强'; }
    }
    function toast(msg, type) {
      if (window.MobileStore && typeof MobileStore.toast === 'function') {
        MobileStore.toast(msg, type || 'info');
        return;
      }
      var box = document.createElement('div');
      box.className = 'mb-toast mb-toast-' + (type || 'info');
      box.textContent = msg;
      box.setAttribute('role', 'status');
      document.body.appendChild(box);
      setTimeout(function () { box.classList.add('show'); }, 10);
      setTimeout(function () {
        box.classList.remove('show');
        setTimeout(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 260);
      }, 2200);
    }

    function readOrders() {
      try {
        var raw = localStorage.getItem(ORDER_KEY);
        var v = raw ? JSON.parse(raw) : [];
        return Array.isArray(v) ? v : [];
      } catch (e) { return []; }
    }
    function saveOrders(list) {
      try { localStorage.setItem(ORDER_KEY, JSON.stringify(list)); } catch (e) { /* 存储失败忽略 */ }
    }
    function nextOrderNo(list) {
      var prefix = 'WX-' + dateStr().replace(/-/g, '') + '-';
      var max = 0;
      list.forEach(function (o) {
        if (!o || typeof o.id !== 'string' || o.id.indexOf(prefix) !== 0) return;
        var n = parseInt(o.id.slice(prefix.length), 10);
        if (!isNaN(n) && n > max) max = n;
      });
      var n = max + 1;
      return prefix + (n < 10 ? '0' + n : '' + n);
    }
    function findOrder(id) {
      for (var i = 0; i < orders.length; i++) {
        if (orders[i].id === id) return orders[i];
      }
      return null;
    }
    function fmtShort(t) {
      var s = String(t || '');
      return s.length > 10 ? s.slice(5) : s;
    }

    function goHome() { window.location.href = 'mb_home.html'; }

    function setUrgency(u) {
      urgency = u;
      document.querySelectorAll('#urgencyRow .urgency-opt').forEach(function (el) {
        el.classList.toggle('active', el.getAttribute('data-urg') === u);
      });
      document.getElementById('stopWarn').classList.toggle('show', u === 'stop');
    }

    function togglePhoto(el) {
      var path = el.getAttribute('data-photo');
      selectedPhoto = selectedPhoto === path ? '' : path;
      document.querySelectorAll('#photoRow .photo-item').forEach(function (item) {
        item.classList.toggle('active', item.getAttribute('data-photo') === selectedPhoto);
      });
    }

    function setOrderFilter(s) {
      filterStatus = s;
      document.querySelectorAll('#orderChips .chip').forEach(function (c) {
        c.classList.toggle('active', c.getAttribute('data-status') === s);
      });
      renderOrders();
    }

    function renderStats() {
      var pending = 0, repairing = 0, doneToday = 0, today = dateStr();
      orders.forEach(function (o) {
        if (o.status === 'pending') pending++;
        else if (o.status === 'repairing') repairing++;
        else if (o.status === 'done' && String(o.repairTime || o.time || '').indexOf(today) === 0) doneToday++;
      });
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statRepairing').textContent = repairing;
      document.getElementById('statDone').textContent = doneToday;
    }

    function renderOrders() {
      var box = document.getElementById('orderList');
      var list = orders.filter(function (o) {
        return filterStatus === 'all' || o.status === filterStatus;
      });
      if (!list.length) {
        box.innerHTML = '<div class="empty">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 14l2 2 4-4"/></svg>' +
          '<div>暂无对应状态的报修工单</div></div>';
        return;
      }
      box.innerHTML = list.map(function (o) {
        var urg = URGENCY_TEXT[o.urgency] ? o.urgency : 'normal';
        return '<div class="order-card st-' + (o.status || 'pending') + '" onclick="openOrder(\'' + esc(o.id) + '\')">' +
          '<div class="order-top">' +
            '<span class="order-no">' + esc(o.id) + '</span>' +
            '<span class="urg-badge u-' + urg + '">' + URGENCY_TEXT[urg] + '</span>' +
          '</div>' +
          '<div class="order-device">' + esc(o.device || '未知设备') +
            (o.circuit ? '<span class="order-circuit">回路 ' + esc(o.circuit) + '</span>' : '') +
          '</div>' +
          '<div class="order-desc">' + esc(o.desc || '') + '</div>' +
          '<div class="order-foot">' +
            '<span class="order-meta">' + esc(o.reporter || '') + ' · ' + esc(fmtShort(o.time)) + '</span>' +
            '<span><span class="st-badge ' + (o.status || 'pending') + '">' + (STATUS_TEXT[o.status] || '待受理') + '</span>' +
              (o.syncPending ? '<span class="st-badge sync">待同步</span>' : '') +
            '</span>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function refresh() {
      renderStats();
      renderOrders();
    }

    function submitOrder() {
      var deviceEl = document.getElementById('fDevice');
      var descEl = document.getElementById('fDesc');
      var phoneEl = document.getElementById('fPhone');
      var code = deviceEl.value;
      var desc = String(descEl.value || '').trim();
      var phone = String(phoneEl.value || '').trim();

      if (!code) { toast('请选择报修设备', 'warning'); deviceEl.focus(); return; }
      if (desc.length < 5) { toast('故障现象不少于 5 个字', 'warning'); descEl.focus(); return; }
      if (!urgency) { toast('请选择紧急程度', 'warning'); return; }
      if (!/^1\d{10}$/.test(phone)) { toast('请输入正确的 11 位手机号', 'warning'); phoneEl.focus(); return; }

      var device = DEVICES.filter(function (d) { return d.code === code; })[0] || { name: code };
      var reporter = getUser();
      var order = {
        id: nextOrderNo(orders),
        device: device.name,
        circuit: code,
        urgency: urgency,
        desc: desc,
        phone: phone,
        reporter: reporter,
        time: nowStr(),
        photo: selectedPhoto,
        status: 'pending'
      };

      var offline = typeof navigator !== 'undefined' && navigator.onLine === false;
      if (offline) {
        order.syncPending = true;
        if (window.MobileStore && typeof MobileStore.enqueue === 'function') {
          MobileStore.enqueue({ type: 'repair_order', payload: order });
        }
      }

      orders.unshift(order);
      saveOrders(orders);
      resetForm();
      refresh();
      toast('工单已提交，已通知设备运维', 'success');
      if (offline) {
        setTimeout(function () { toast('当前离线，工单已标记待同步', 'warning'); }, 900);
      }
    }

    function resetForm() {
      document.getElementById('fDevice').value = '';
      document.getElementById('fDesc').value = '';
      document.getElementById('fPhone').value = '13800000002';
      setUrgency('');
      selectedPhoto = '';
      document.querySelectorAll('#photoRow .photo-item').forEach(function (item) {
        item.classList.remove('active');
      });
    }

    function openOrder(id) {
      currentOrderId = id;
      repairMode = false;
      var o = findOrder(id);
      if (!o) return;
      renderSheet();
      document.getElementById('sheetOverlay').classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeSheet() {
      document.getElementById('sheetOverlay').classList.remove('show');
      document.body.style.overflow = '';
      currentOrderId = null;
      repairMode = false;
    }

    function renderSheet() {
      var o = findOrder(currentOrderId);
      if (!o) return;
      var urg = URGENCY_TEXT[o.urgency] ? o.urgency : 'normal';
      var html = '<div class="sheet-head">' +
        '<div>' +
          '<div class="sheet-title">' + esc(o.device || '未知设备') + '</div>' +
          '<div class="sheet-sub">' + esc(o.id) + ' · ' + (STATUS_TEXT[o.status] || '待受理') + '</div>' +
        '</div>' +
        '<button class="sheet-close" type="button" onclick="closeSheet()" aria-label="关闭">×</button>' +
      '</div>';

      html += '<div class="detail-box">' +
        '<div class="detail-row"><span class="k">工单号</span><span class="v">' + esc(o.id) + '</span></div>' +
        '<div class="detail-row"><span class="k">设备</span><span class="v">' + esc(o.device || '—') + '</span></div>' +
        '<div class="detail-row"><span class="k">回路</span><span class="v">' + esc(o.circuit || '—') + '</span></div>' +
        '<div class="detail-row"><span class="k">紧急程度</span><span class="v' + (urg === 'stop' ? ' warn' : '') + '">' + URGENCY_TEXT[urg] + '</span></div>' +
        '<div class="detail-row"><span class="k">故障现象</span><span class="v">' + esc(o.desc || '—') + '</span></div>' +
        '<div class="detail-row"><span class="k">联系电话</span><span class="v">' + esc(o.phone || '—') + '</span></div>' +
        '<div class="detail-row"><span class="k">报修人</span><span class="v">' + esc(o.reporter || '—') + '</span></div>' +
        '<div class="detail-row"><span class="k">提交时间</span><span class="v">' + esc(o.time || '—') + '</span></div>' +
        '<div class="detail-row"><span class="k">状态</span><span class="v">' + (STATUS_TEXT[o.status] || '待受理') + (o.syncPending ? '（待同步）' : '') + '</span></div>' +
      '</div>';

      if (o.status === 'done') {
        html += '<div class="detail-box">' +
          '<div class="detail-box-title">维修记录</div>' +
          '<div class="detail-row"><span class="k">维修结果</span><span class="v">' + esc(o.repairResult || '—') + '</span></div>' +
          '<div class="detail-row"><span class="k">维修人</span><span class="v">' + esc(o.repairBy || '—') + '</span></div>' +
          '<div class="detail-row"><span class="k">完成时间</span><span class="v">' + esc(o.repairTime || '—') + '</span></div>' +
        '</div>';
      }

      if (o.photo) {
        html += '<div class="photo-preview"><img src="' + esc(o.photo) + '" alt="现场照片"></div>';
      }

      if (o.status === 'pending') {
        html += '<div class="sheet-actions">' +
          '<button class="btn btn-primary" type="button" onclick="acceptOrder()">受理工单</button>' +
          '<button class="btn btn-ghost" type="button" onclick="closeSheet()">关闭</button>' +
        '</div>';
      } else if (o.status === 'repairing') {
        if (repairMode) {
          html += '<div class="form-item" style="margin-top:14px;">' +
            '<div class="form-label">维修结果 <span class="req">*</span></div>' +
            '<textarea class="form-textarea" id="fRepairResult" maxlength="200" placeholder="请填写维修结果，如更换配件、复测数据等"></textarea>' +
          '</div>' +
          '<div class="sheet-actions">' +
            '<button class="btn btn-primary" type="button" onclick="completeOrder()">确认完成</button>' +
            '<button class="btn btn-ghost" type="button" onclick="cancelRepair()">取消</button>' +
          '</div>';
        } else {
          html += '<div class="sheet-actions">' +
            '<button class="btn btn-primary" type="button" onclick="startRepair()">完成维修</button>' +
            '<button class="btn btn-ghost" type="button" onclick="closeSheet()">关闭</button>' +
          '</div>';
        }
      } else {
        html += '<div class="sheet-actions">' +
          '<button class="btn btn-ghost" type="button" onclick="closeSheet()">关闭</button>' +
        '</div>';
      }

      document.getElementById('sheet').innerHTML = html;
    }

    function acceptOrder() {
      var o = findOrder(currentOrderId);
      if (!o || o.status !== 'pending') return;
      if (!window.confirm('确认受理该工单？')) return;
      o.status = 'repairing';
      o.acceptTime = nowStr();
      o.repairBy = getUser();
      saveOrders(orders);
      refresh();
      closeSheet();
      toast('工单已受理，进入维修中', 'success');
    }

    function startRepair() {
      repairMode = true;
      renderSheet();
      var el = document.getElementById('fRepairResult');
      if (el) el.focus();
    }

    function cancelRepair() {
      repairMode = false;
      renderSheet();
    }

    function completeOrder() {
      var o = findOrder(currentOrderId);
      if (!o || o.status !== 'repairing') return;
      var el = document.getElementById('fRepairResult');
      var result = el ? String(el.value || '').trim() : '';
      if (!result) { toast('请填写维修结果', 'warning'); if (el) el.focus(); return; }
      if (!window.confirm('确认该工单已维修完成？')) return;
      o.status = 'done';
      o.repairResult = result;
      o.repairTime = nowStr();
      o.repairBy = getUser();
      saveOrders(orders);
      refresh();
      closeSheet();
      toast('工单已完成维修', 'success');
    }

    document.getElementById('reporterName').textContent = getUser();
    orders = readOrders();
    refresh();

    window.addEventListener('storage', function (e) {
      if (!e || !e.key || e.key === ORDER_KEY) {
        orders = readOrders();
        refresh();
      }
    });
  </script>
</body>
</html>
