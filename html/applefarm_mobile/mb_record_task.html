<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>食用菌环境监测系统 - 工序填报</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <script src="js/mobile-store.js"></script>
  <style>
    /* ===== 菌菇工厂主题 v2.1：中性画布 + 品牌棕点缀（头部/主按钮/选中态）；
       状态色用设计系统惯例绿/琥珀/红/蓝，全棕暖调仅消费者追溯 H5 使用 ===== */
    :root {
      --bg: #FAF9F7;
      --text: #26221E;
      --text-secondary: #55504A;
      --text-tertiary: #7A7268;
      --border: #E6E1D8;
      --border-light: #F0EDE7;
      --shadow-card: 0 2px 12px rgba(69, 48, 35, 0.08);
    }

    body { background: var(--bg); }
    [hidden] { display: none !important; }

    /* ===== 工序分段 Tab ===== */
    .stage-tabs {
      position: sticky;
      top: calc(var(--header-height) + var(--safe-top));
      z-index: 20;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--border-light);
      scrollbar-width: none;
    }
    .stage-tabs::-webkit-scrollbar { display: none; }
    .stage-tab {
      flex: 0 0 auto;
      padding: 8px 15px;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--bg-white);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: var(--font-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }
    .stage-tab.active {
      background: var(--gradient-primary);
      border-color: transparent;
      color: var(--text-on-primary);
      font-weight: 600;
      box-shadow: var(--shadow-card);
    }

    .page-body { padding: 12px 14px 96px; }

    .batch-hint {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 10px 12px;
      margin-bottom: 12px;
      background: var(--primary-50);
      border: 1px solid var(--primary-200);
      border-radius: var(--radius-md);
      font-size: var(--font-xs);
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .batch-hint b {
      font-family: var(--font-family-number);
      font-size: var(--font-sm);
      color: var(--primary-700);
    }

    .stats-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .stat-box {
      flex: 1;
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      box-shadow: var(--shadow-card);
    }
    .stat-num {
      font-family: var(--font-family-number);
      font-size: var(--font-2xl);
      font-weight: 800;
      line-height: 1.15;
      color: var(--primary);
    }
    .stat-num.is-warn { color: var(--warning-dark); }
    .stat-label {
      margin-top: 3px;
      font-size: var(--font-xs);
      color: var(--text-secondary);
    }

    .filter-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .filter-chip {
      padding: 6px 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--bg-white);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: var(--font-xs);
      cursor: pointer;
    }
    .filter-chip.active {
      background: var(--primary-50);
      border-color: var(--primary);
      color: var(--primary-700);
      font-weight: 600;
    }

    /* ===== 记录卡 ===== */
    .record-card {
      position: relative;
      display: flex;
      align-items: stretch;
      margin-bottom: 10px;
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition: transform var(--transition-fast);
    }
    .record-card:active { transform: scale(0.99); }
    .record-bar { width: 4px; flex: 0 0 4px; }
    .record-body { flex: 1; min-width: 0; padding: 11px 13px; }
    .record-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .record-stage {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: var(--font-sm);
      font-weight: 600;
      color: var(--text);
    }
    .record-desc {
      margin-top: 4px;
      font-size: var(--font-xs);
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .record-foot {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
      font-size: var(--font-2xs);
      color: var(--text-tertiary);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: var(--font-2xs);
      font-weight: 600;
      white-space: nowrap;
    }
    .badge::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }
    .badge.submitted { background: var(--success-light); color: var(--success-dark); }
    .badge.pending { background: var(--warning-light); color: var(--warning-dark); }

    .empty-state {
      text-align: center;
      padding: 38px 16px;
      color: var(--text-tertiary);
    }
    .empty-state svg {
      display: block;
      width: 46px;
      height: 46px;
      margin: 0 auto 10px;
      color: var(--primary-300);
    }
    .empty-title {
      font-size: var(--font-sm);
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .empty-desc { font-size: var(--font-xs); line-height: 1.6; }

    /* ===== 固定新增按钮 ===== */
    .action-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 750px;
      padding: 10px 16px calc(10px + var(--safe-bottom));
      background: var(--bg-white);
      border-top: 1px solid var(--border-light);
      z-index: 100;
    }
    .add-btn {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: var(--radius-full);
      background: var(--gradient-primary);
      color: var(--text-on-primary);
      font-family: inherit;
      font-size: var(--font-base);
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-card);
    }
    .add-btn:active { transform: scale(0.985); }
    .btn-cancel {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    /* ===== 抽屉表单 ===== */
    .mb-modal.is-sheet.form-sheet {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 750px;
      max-height: 90vh;
      padding: 0;
      overflow: hidden;
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border-light);
    }
    .sheet-title {
      font-size: var(--font-md);
      font-weight: 600;
      color: var(--text);
    }
    .sheet-close {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: var(--gray-100);
      color: var(--text-secondary);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }
    .sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
    }
    .sheet-foot {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      padding: 12px 18px calc(12px + var(--safe-bottom));
      border-top: 1px solid var(--border-light);
      background: var(--bg-white);
    }
    .sheet-foot .mb-btn { flex: 1; }

    .p-field { margin-bottom: 14px; }
    .p-label {
      display: block;
      margin-bottom: 6px;
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }
    .p-label .req { color: var(--error); }
    .p-input, .p-select, .p-textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-white);
      color: var(--text);
      font-family: inherit;
      font-size: var(--font-base);
    }
    .p-input, .p-select { height: 44px; padding: 0 12px; }
    .p-textarea {
      min-height: 68px;
      padding: 10px 12px;
      line-height: 1.5;
      resize: vertical;
    }
    .p-input:focus, .p-select:focus, .p-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-50);
    }
    .p-input[readonly] { background: var(--primary-50); color: var(--text-secondary); }
    .p-input.is-invalid, .p-select.is-invalid {
      border-color: var(--error);
      background: var(--error-light);
    }
    .field-error {
      min-height: 16px;
      margin-top: 4px;
      font-size: var(--font-xs);
      color: var(--error);
      line-height: 1.4;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .photo-opt {
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--bg-white);
      cursor: pointer;
    }
    .photo-opt img {
      display: block;
      width: 100%;
      height: 62px;
      object-fit: cover;
    }
    .photo-opt span {
      display: block;
      padding: 4px 2px;
      text-align: center;
      font-size: var(--font-2xs);
      color: var(--text-secondary);
    }
    .photo-opt.active { border-color: var(--primary); }
    .photo-opt.active span { color: var(--primary-700); font-weight: 600; }

    /* ===== 详情弹窗 ===== */
    .detail-modal {
      display: flex;
      flex-direction: column;
      width: 92%;
      max-width: 420px;
      max-height: 86vh;
      padding: 0;
      overflow: hidden;
      border-radius: var(--radius-xl);
    }
    .detail-body { flex: 1; overflow-y: auto; padding: 16px 18px; }
    .detail-badges {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .stage-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      background: var(--primary-50);
      color: var(--primary-700);
      font-size: var(--font-xs);
      font-weight: 600;
    }
    .stage-pill i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .d-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border-light);
      font-size: var(--font-sm);
    }
    .d-row span { flex-shrink: 0; color: var(--text-secondary); }
    .d-row b {
      min-width: 0;
      text-align: right;
      font-weight: 600;
      color: var(--text);
      word-break: break-all;
    }
    .d-label {
      margin: 14px 0 8px;
      font-size: var(--font-sm);
      color: var(--text-secondary);
    }
    .detail-photo {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }
    .d-empty {
      padding: 14px;
      text-align: center;
      font-size: var(--font-xs);
      color: var(--text-tertiary);
      background: var(--gray-50);
      border-radius: var(--radius-md);
    }
    .pending-note {
      margin-top: 12px;
      padding: 9px 11px;
      border-radius: var(--radius-md);
      background: var(--warning-light);
      color: var(--warning-dark);
      font-size: var(--font-xs);
      line-height: 1.5;
    }

    .mb-btn { font-family: inherit; }
    #syncBar { margin-top: 12px; }
  </style>
</head>
<body>
  <div class="mb-app">
    <div class="mb-back-bar">
      <button class="mb-back-arrow" type="button" onclick="goBack()" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="mb-back-title">工序填报</div>
    </div>

    <div class="stage-tabs" id="stageTabs"></div>

    <div id="syncBar"></div>

    <main class="page-body">
      <div id="batchHint" hidden></div>
      <div class="stats-row" id="statsRow"></div>
      <div class="filter-row" id="filterRow"></div>
      <div id="recordList"></div>
    </main>

    <div class="action-bar">
      <button class="add-btn" type="button" onclick="openForm()">＋ 新增记录 · <span id="addStageName">拌料装袋</span></button>
    </div>
  </div>

  <!-- 新增记录抽屉 -->
  <div class="mb-modal-overlay is-sheet" id="formModal">
    <div class="mb-modal is-sheet form-sheet">
      <div class="sheet-head">
        <div class="sheet-title" id="formTitle">新增记录</div>
        <button class="sheet-close" type="button" onclick="closeForm()" aria-label="关闭">×</button>
      </div>
      <div class="sheet-body" id="formBody"></div>
      <div class="sheet-foot">
        <button class="mb-btn btn-cancel" type="button" onclick="closeForm()">取消</button>
        <button class="mb-btn mb-btn-primary" type="button" onclick="submitForm()">提交记录</button>
      </div>
    </div>
  </div>

  <!-- 记录详情 -->
  <div class="mb-modal-overlay" id="detailModal">
    <div class="mb-modal detail-modal">
      <div class="sheet-head">
        <div class="sheet-title" id="detailTitle">记录详情</div>
        <button class="sheet-close" type="button" onclick="closeDetail()" aria-label="关闭">×</button>
      </div>
      <div class="detail-body" id="detailBody"></div>
      <div class="sheet-foot" id="detailFoot"></div>
    </div>
  </div>

  <script>
    /* ============================================================
     * 工序填报：6 类工序电子台账
     * 记录：localStorage['mushroom_process_records']
     *   {id,stage,batch,house,operator,time,fields:{},photo,status,desc}
     * 离线：status='pending' + MobileStore.enqueue({type:'process_record'})
     * ============================================================ */

    var RECORD_KEY = 'mushroom_process_records';
    var BATCH_RE = /^JB-\d{8}-\d{2}$/;

    var PHOTOS = [
      { src: '../applefarm_h5/images/trace_substrate.jpg', label: '拌料装袋' },
      { src: '../applefarm_h5/images/trace_sterilize.jpg', label: '灭菌' },
      { src: '../applefarm_h5/images/trace_planting.jpg', label: '接种' },
      { src: '../applefarm_h5/images/trace_incubate.jpg', label: '培养' },
      { src: '../applefarm_h5/images/trace_fruiting.jpg', label: '出菇' },
      { src: '../applefarm_h5/images/trace_harvest.jpg', label: '采收' }
    ];

    var STAGES = [
      {
        key: 'mix', name: '拌料装袋', color: 'var(--primary)',
        photo: '../applefarm_h5/images/trace_substrate.jpg',
        houses: ['拌料车间 一车间', '拌料车间 二车间'],
        fields: [
          { key: 'formula', label: '配方号', type: 'text', required: true, placeholder: '如 PF-2026-08' },
          { key: 'feedKg', label: '投料量（kg）', type: 'number', required: true, min: 0.1, max: 100000, msg: '投料量需大于 0' },
          { key: 'bagCount', label: '装袋数（袋）', type: 'number', required: true, min: 1, max: 99999, integer: true, msg: '装袋数需为正整数' },
          { key: 'moisture', label: '含水率（%）', type: 'number', required: true, min: 0, max: 100, msg: '含水率需在 0~100%' }
        ],
        desc: function (v) {
          return '配方 ' + v.formula + ' · 投料 ' + v.feedKg + 'kg · 装袋 ' + v.bagCount +
            ' 袋 · 含水率 ' + v.moisture + '%';
        }
      },
      {
        key: 'sterilize', name: '灭菌', color: 'var(--warning-dark)',
        photo: '../applefarm_h5/images/trace_sterilize.jpg',
        houses: ['灭菌间 A', '灭菌间 B'],
        fields: [
          { key: 'potNo', label: '灭菌锅号', type: 'text', required: true, placeholder: '如 MJ-02' },
          { key: 'temp', label: '灭菌温度（℃）', type: 'number', required: true, min: 0, max: 140, msg: '温度需在 0~140℃' },
          { key: 'holdMin', label: '保温时长（min）', type: 'number', required: true, min: 1, max: 1440, msg: '保温时长需在 1~1440 分钟' }
        ],
        desc: function (v) {
          return '灭菌锅 ' + v.potNo + ' · ' + v.temp + '℃ · 保温 ' + v.holdMin + ' 分钟';
        }
      },
      {
        key: 'inoculate', name: '接种', color: 'var(--info-dark)',
        photo: '../applefarm_h5/images/trace_planting.jpg',
        houses: ['接种室 A', '接种室 B'],
        fields: [
          { key: 'strainBatch', label: '菌种批次', type: 'text', required: true, placeholder: '如 菌种-X2' },
          { key: 'inocCount', label: '接种数量（袋）', type: 'number', required: true, min: 1, max: 99999, integer: true, msg: '接种数量需为正整数' },
          { key: 'roomTemp', label: '接种室温度（℃）', type: 'number', required: true, min: 0, max: 140, msg: '温度需在 0~140℃' },
          { key: 'disinfection', label: '消毒记录', type: 'text', required: true, placeholder: '如 紫外 30min + 酒精擦拭' }
        ],
        desc: function (v) {
          return '菌种 ' + v.strainBatch + ' · 接种 ' + v.inocCount + ' 袋 · 接种室 ' + v.roomTemp + '℃';
        }
      },
      {
        key: 'incubate', name: '培养', color: 'var(--success-dark)',
        photo: '../applefarm_h5/images/trace_incubate.jpg',
        houses: ['培养房 C-01', '培养房 C-02'],
        fields: [
          { key: 'room', label: '培养房', type: 'text', required: true, placeholder: '如 培养房 C-01' },
          { key: 'temp', label: '温度（℃）', type: 'number', required: true, min: 0, max: 140, msg: '温度需在 0~140℃' },
          { key: 'humidity', label: '湿度（%）', type: 'number', required: true, min: 0, max: 100, msg: '湿度需在 0~100%' },
          { key: 'fullBagRate', label: '满袋率（%）', type: 'number', required: true, min: 0, max: 100, msg: '满袋率需在 0~100%' },
          { key: 'contamRate', label: '污染率（%）', type: 'number', required: true, min: 0, max: 100, msg: '污染率需在 0~100%' }
        ],
        desc: function (v) {
          return '培养房 ' + v.room + ' · ' + v.temp + '℃ / ' + v.humidity + '%RH · 满袋率 ' +
            v.fullBagRate + '% · 污染率 ' + v.contamRate + '%';
        }
      },
      {
        key: 'fruiting', name: '出菇', color: 'var(--primary-300)',
        photo: '../applefarm_h5/images/trace_fruiting.jpg',
        houses: ['菇房 1号', '菇房 2号', '菇房 3号'],
        fields: [
          { key: 'room', label: '菇房', type: 'text', required: true, placeholder: '如 菇房 1号' },
          { key: 'temp', label: '温度（℃）', type: 'number', required: true, min: 0, max: 140, msg: '温度需在 0~140℃' },
          { key: 'humidity', label: '湿度（%）', type: 'number', required: true, min: 0, max: 100, msg: '湿度需在 0~100%' },
          { key: 'co2', label: 'CO₂（ppm）', type: 'number', required: true, min: 0, max: 5000, msg: 'CO₂需在 0~5000ppm' },
          { key: 'light', label: '光照（lux）', type: 'number', required: true, min: 0, max: 5000, msg: '光照需在 0~5000lux' }
        ],
        desc: function (v) {
          return '菇房 ' + v.room + ' · ' + v.temp + '℃ / ' + v.humidity + '%RH · CO₂ ' +
            v.co2 + 'ppm · 光照 ' + v.light + 'lux';
        }
      },
      {
        key: 'harvest', name: '采收', color: 'var(--primary-700)',
        photo: '../applefarm_h5/images/trace_harvest.jpg',
        houses: ['菇房 1号', '菇房 2号', '菇房 3号', '采后处理间'],
        fields: [
          { key: 'weight', label: '采收重量（kg）', type: 'number', required: true, min: 0.1, max: 100000, msg: '采收重量需大于 0' },
          { key: 'gradeA', label: 'A级（kg）', type: 'number', required: true, min: 0, max: 100000, msg: 'A级重量不能为负数' },
          { key: 'gradeB', label: 'B级（kg）', type: 'number', required: true, min: 0, max: 100000, msg: 'B级重量不能为负数' }
        ],
        desc: function (v) {
          return '采收 ' + v.weight + 'kg · A级 ' + v.gradeA + 'kg · B级 ' + v.gradeB + 'kg';
        }
      }
    ];

    var stageKey = 'mix';
    var statusFilter = 'all';
    var urlBatch = '';
    var selectedPhoto = '';
    var currentDetailId = '';

    var STAGE_ALIAS = {
      '拌料装袋': 'mix',
      '灭菌': 'sterilize',
      '接种': 'inoculate',
      '培养': 'incubate',
      '出菇': 'fruiting',
      '采收': 'harvest',
      '灭菌接种': 'inoculate',
      '发菌培养': 'incubate',
      '出菇管理': 'fruiting'
    };

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function pad(n) { return n < 10 ? '0' + n : String(n); }

    function goBack() {
      if (window.history.length > 1) window.history.back();
      else window.location.href = 'mb_home.html';
    }

    function currentOperator() {
      try {
        return sessionStorage.getItem('loginUser') || '李国强';
      } catch (e) {
        return '李国强';
      }
    }

    function currentStage() {
      return STAGES.filter(function (s) { return s.key === stageKey; })[0] || STAGES[0];
    }

    function stageByName(name) {
      return STAGES.filter(function (s) { return s.name === name; })[0] || null;
    }

    function readRecords() {
      try {
        var raw = localStorage.getItem(RECORD_KEY);
        var v = raw ? JSON.parse(raw) : [];
        return Array.isArray(v) ? v : [];
      } catch (e) {
        return [];
      }
    }

    function saveRecords(list) {
      try {
        localStorage.setItem(RECORD_KEY, JSON.stringify(list));
        return true;
      } catch (e) {
        return false;
      }
    }

    /* 演示种子：仅键不存在时写入；8 条覆盖 6 工序，默认拌料装袋 Tab 3 条 */
    function seedRecordsIfEmpty() {
      var raw = null;
      try { raw = localStorage.getItem(RECORD_KEY); } catch (e) { return; }
      if (raw !== null) {
        try { var exist = JSON.parse(raw); if (Array.isArray(exist) && exist.length) return; } catch (e) { /* 坏数据视为空 */ }
      }
      function day(offset) {
        var d = new Date(Date.now() - offset * 86400000);
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      }
      function stamp(offset) { return day(offset).replace(/-/g, ''); }
      function mk(n, stageName, batch, house, operator, time, fields, remark) {
        var st = stageByName(stageName);
        var desc = st.desc(fields);
        if (remark) desc += ' · 备注：' + remark;
        return {
          id: 'proc_seed_' + n, stage: stageName, batch: batch, house: house,
          operator: operator, time: time, fields: fields, photo: st.photo,
          status: 'submitted', desc: desc
        };
      }
      saveRecords([
        mk(1, '拌料装袋', 'JB-' + stamp(0) + '-05', '拌料车间 一车间', '李国强', day(0) + ' 07:10',
          { formula: 'PF-2026-08', feedKg: 1200, bagCount: 2400, moisture: 62 }, ''),
        mk(2, '拌料装袋', 'JB-' + stamp(0) + '-06', '拌料车间 二车间', '张建国', day(0) + ' 08:05',
          { formula: 'PF-2026-08', feedKg: 1000, bagCount: 2000, moisture: 61 }, ''),
        mk(3, '拌料装袋', 'JB-' + stamp(1) + '-03', '拌料车间 一车间', '李国强', day(1) + ' 16:30',
          { formula: 'PF-2026-07', feedKg: 1500, bagCount: 3000, moisture: 63 }, '棉籽壳含水率偏高，加水量下调 2%'),
        mk(4, '接种', 'JB-' + stamp(0) + '-01', '接种室 A', '张建国', day(0) + ' 09:05',
          { strainBatch: '菌种-X2', inocCount: 2400, roomTemp: 18, disinfection: '紫外 30min + 酒精擦拭' }, ''),
        mk(5, '接种', 'JB-' + stamp(0) + '-02', '接种室 B', '王芳', day(0) + ' 09:40',
          { strainBatch: '菌种-X2', inocCount: 2000, roomTemp: 17.5, disinfection: '紫外 40min + 酒精擦拭' }, ''),
        mk(6, '培养', 'JB-' + stamp(6) + '-02', '培养房 C-01', '李国强', day(2) + ' 10:20',
          { room: '培养房 C-01', temp: 22, humidity: 65, fullBagRate: 96, contamRate: 0.8 }, ''),
        mk(7, '出菇', 'JB-' + stamp(6) + '-02', '菇房 3号', '李国强', day(0) + ' 08:10',
          { room: '菇房 3号', temp: 18.4, humidity: 92, co2: 685, light: 120 }, ''),
        mk(8, '采收', 'JB-' + stamp(10) + '-01', '采后处理间', '王芳', day(0) + ' 07:00',
          { weight: 420, gradeA: 356, gradeB: 52 }, '第二潮菇采收')
      ]);
    }

    function todayPrefix() {
      var d = new Date();
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function nowLocal() {
      var d = new Date();
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
        'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function fmtTimeText(t) {
      return String(t || '').replace('T', ' ');
    }

    /* 队列已无对应条目但记录仍为 pending → 视为已同步 */
    function reconcilePending() {
      var active = {};
      MobileStore.list(MobileStore.KEYS.queue).forEach(function (e) {
        if (e && e.type === 'process_record' && e.refId) active[e.refId] = true;
      });
      var list = readRecords();
      var changed = false;
      list.forEach(function (r) {
        if (r && r.status === 'pending' && !active[r.id]) {
          r.status = 'submitted';
          changed = true;
        }
      });
      if (changed) saveRecords(list);
    }

    /* ---------------- 渲染 ---------------- */

    function renderTabs() {
      document.getElementById('stageTabs').innerHTML = STAGES.map(function (s) {
        return '<button type="button" class="stage-tab' + (s.key === stageKey ? ' active' : '') +
          '" id="tab_' + s.key + '" onclick="switchStage(\'' + s.key + '\')">' + esc(s.name) + '</button>';
      }).join('');
      var active = document.getElementById('tab_' + stageKey);
      var wrap = document.getElementById('stageTabs');
      if (active && wrap) wrap.scrollLeft = Math.max(0, active.offsetLeft - 70);
    }

    function switchStage(key) {
      stageKey = key;
      refresh();
    }

    function setFilter(f) {
      statusFilter = f;
      renderFilter();
      renderList();
    }

    function renderBatchHint() {
      var box = document.getElementById('batchHint');
      if (!urlBatch) {
        box.innerHTML = '';
        box.hidden = true;
        return;
      }
      box.innerHTML = '<div class="batch-hint"><span>已关联批次</span><b>' + esc(urlBatch) +
        '</b><span>· 新记录将自动归入该批次台账</span></div>';
      box.hidden = false;
    }

    function renderStats() {
      var st = currentStage();
      var list = readRecords().filter(function (r) { return r.stage === st.name; });
      var today = todayPrefix();
      var todayCount = list.filter(function (r) {
        return String(r.time || '').slice(0, 10) === today;
      }).length;
      var pendingCount = list.filter(function (r) { return r.status === 'pending'; }).length;

      document.getElementById('statsRow').innerHTML =
        '<div class="stat-box"><div class="stat-num">' + todayCount +
          '</div><div class="stat-label">今日记录</div></div>' +
        '<div class="stat-box"><div class="stat-num' + (pendingCount ? ' is-warn' : '') + '">' + pendingCount +
          '</div><div class="stat-label">待同步</div></div>';
    }

    function renderFilter() {
      var st = currentStage();
      var list = readRecords().filter(function (r) { return r.stage === st.name; });
      var counts = {
        all: list.length,
        submitted: list.filter(function (r) { return r.status === 'submitted'; }).length,
        pending: list.filter(function (r) { return r.status === 'pending'; }).length
      };
      var defs = [
        { k: 'all', label: '全部' },
        { k: 'submitted', label: '已提交' },
        { k: 'pending', label: '待同步' }
      ];
      document.getElementById('filterRow').innerHTML = defs.map(function (d) {
        return '<button type="button" class="filter-chip' + (statusFilter === d.k ? ' active' : '') +
          '" onclick="setFilter(\'' + d.k + '\')">' + d.label + ' ' + counts[d.k] + '</button>';
      }).join('');
    }

    function emptyHtml() {
      var text = statusFilter === 'pending' ? '暂无待同步记录'
        : statusFilter === 'submitted' ? '暂无已提交记录' : '本工序暂无记录';
      return '<div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>' +
          '<rect x="8" y="2" width="8" height="4" rx="1"/>' +
          '<line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="14" y2="15"/>' +
        '</svg>' +
        '<div class="empty-title">' + text + '</div>' +
        '<div class="empty-desc">点击下方「新增记录」登记本工序台账</div>' +
      '</div>';
    }

    function renderList() {
      var st = currentStage();
      var list = readRecords().filter(function (r) { return r.stage === st.name; });
      if (statusFilter === 'submitted') list = list.filter(function (r) { return r.status === 'submitted'; });
      if (statusFilter === 'pending') list = list.filter(function (r) { return r.status === 'pending'; });
      list.sort(function (a, b) {
        return String(b.time || '').localeCompare(String(a.time || ''));
      });

      var box = document.getElementById('recordList');
      if (!list.length) {
        box.innerHTML = emptyHtml();
        return;
      }
      box.innerHTML = list.map(function (r) {
        var pending = r.status === 'pending';
        return '<div class="record-card" onclick="openDetail(\'' + r.id + '\')">' +
          '<span class="record-bar" style="background:' + st.color + '"></span>' +
          '<div class="record-body">' +
            '<div class="record-top">' +
              '<span class="record-stage">' + esc(st.name) + ' · ' + esc(r.batch) + '</span>' +
              '<span class="badge ' + (pending ? 'pending' : 'submitted') + '">' +
                (pending ? '待同步' : '已提交') + '</span>' +
            '</div>' +
            '<div class="record-desc">' + esc(r.desc || '-') + '</div>' +
            '<div class="record-foot">' +
              '<span>' + esc(fmtTimeText(r.time)) + '</span>' +
              '<span>' + esc(r.house || '-') + '</span>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function refresh() {
      renderTabs();
      renderBatchHint();
      renderStats();
      renderFilter();
      renderList();
      document.getElementById('addStageName').textContent = currentStage().name;
      document.getElementById('formTitle').textContent = '新增' + currentStage().name + '记录';
    }

    /* ---------------- 表单 ---------------- */

    function fieldHtml(f) {
      var input;
      if (f.type === 'number') {
        input = '<input class="p-input" id="f_' + f.key + '" type="number" inputmode="decimal" step="any" placeholder="' +
          esc(f.placeholder || '请输入数值') + '">';
      } else {
        input = '<input class="p-input" id="f_' + f.key + '" type="text" maxlength="40" placeholder="' +
          esc(f.placeholder || '请输入') + '">';
      }
      return '<div class="p-field">' +
        '<label class="p-label" for="f_' + f.key + '">' + esc(f.label) +
          '<span class="req">*</span></label>' + input +
        '<div class="field-error" id="err_' + f.key + '"></div>' +
      '</div>';
    }

    function renderForm() {
      var st = currentStage();
      selectedPhoto = st.photo;

      var batchInput = urlBatch
        ? '<input class="p-input" id="f_batch" type="text" value="' + esc(urlBatch) + '" readonly>'
        : '<input class="p-input" id="f_batch" type="text" maxlength="16" autocomplete="off" placeholder="如 JB-20261116-03">';

      var houseOptions = '<option value="">请选择菇房 / 车间</option>' + st.houses.map(function (h) {
        return '<option value="' + esc(h) + '">' + esc(h) + '</option>';
      }).join('');

      var photos = PHOTOS.map(function (p) {
        return '<div class="photo-opt' + (p.src === selectedPhoto ? ' active' : '') +
          '" onclick="selectPhoto(\'' + p.src + '\')">' +
          '<img src="' + p.src + '" alt="' + esc(p.label) + '凭证">' +
          '<span>' + esc(p.label) + '</span></div>';
      }).join('');

      document.getElementById('formBody').innerHTML =
        '<div class="p-field">' +
          '<label class="p-label" for="f_batch">批次号<span class="req">*</span></label>' + batchInput +
          '<div class="field-error" id="err_batch"></div>' +
        '</div>' +
        '<div class="p-field">' +
          '<label class="p-label" for="f_house">菇房 / 车间<span class="req">*</span></label>' +
          '<select class="p-select" id="f_house">' + houseOptions + '</select>' +
          '<div class="field-error" id="err_house"></div>' +
        '</div>' +
        '<div class="p-field">' +
          '<label class="p-label" for="f_operator">操作人<span class="req">*</span></label>' +
          '<input class="p-input" id="f_operator" type="text" maxlength="20" value="' + esc(currentOperator()) + '">' +
          '<div class="field-error" id="err_operator"></div>' +
        '</div>' +
        '<div class="p-field">' +
          '<label class="p-label" for="f_time">记录时间<span class="req">*</span></label>' +
          '<input class="p-input" id="f_time" type="datetime-local" value="' + nowLocal() + '">' +
          '<div class="field-error" id="err_time"></div>' +
        '</div>' +
        st.fields.map(fieldHtml).join('') +
        '<div class="p-field">' +
          '<label class="p-label">现场照片凭证<span class="req">*</span></label>' +
          '<div class="photo-grid" id="photoGrid">' + photos + '</div>' +
          '<div class="field-error" id="err_photo"></div>' +
        '</div>' +
        '<div class="p-field">' +
          '<label class="p-label" for="f_remark">备注</label>' +
          '<textarea class="p-textarea" id="f_remark" placeholder="备注信息（选填）"></textarea>' +
        '</div>';
    }

    function selectPhoto(src) {
      selectedPhoto = src;
      var opts = document.querySelectorAll('#photoGrid .photo-opt');
      for (var i = 0; i < opts.length; i++) {
        opts[i].classList.remove('active');
        var img = opts[i].querySelector('img');
        if (img && img.getAttribute('src') === src) opts[i].classList.add('active');
      }
      setErr('photo', '');
    }

    function setErr(key, msg) {
      var box = document.getElementById('err_' + key);
      var el = document.getElementById('f_' + key);
      if (box) box.textContent = msg || '';
      if (el) el.classList.toggle('is-invalid', !!msg);
    }

    function clearFormErrors() {
      var boxes = document.querySelectorAll('#formBody .field-error');
      for (var i = 0; i < boxes.length; i++) boxes[i].textContent = '';
      var inputs = document.querySelectorAll('#formBody .is-invalid');
      for (var k = 0; k < inputs.length; k++) inputs[k].classList.remove('is-invalid');
    }

    function validateForm(st) {
      clearFormErrors();
      var ok = true;
      function fail(key, msg) {
        setErr(key, msg);
        ok = false;
      }

      var batch = document.getElementById('f_batch').value.trim().toUpperCase();
      if (!batch) fail('batch', '请填写批次号');
      else if (!BATCH_RE.test(batch)) fail('batch', '批次码格式有误，示例 JB-20261116-03');

      var house = document.getElementById('f_house').value;
      if (!house) fail('house', '请选择菇房 / 车间');

      var operator = document.getElementById('f_operator').value.trim();
      if (!operator) fail('operator', '请填写操作人');

      var time = document.getElementById('f_time').value;
      if (!time) fail('time', '请选择记录时间');

      if (!selectedPhoto) fail('photo', '请选择一张现场照片');

      var values = {};
      st.fields.forEach(function (f) {
        var el = document.getElementById('f_' + f.key);
        var raw = el ? el.value.trim() : '';
        values[f.key] = raw;
        var name = f.label.replace(/（[^）]*）/g, '');
        if (f.required && !raw) {
          fail(f.key, '请填写' + name);
          return;
        }
        if (raw !== '' && f.type === 'number') {
          var n = Number(raw);
          if (!isFinite(n)) { fail(f.key, '请输入有效数字'); return; }
          if (f.integer && !Number.isInteger(n)) { fail(f.key, f.msg || '需为正整数'); return; }
          if (f.min != null && n < f.min) { fail(f.key, f.msg || ('不能小于 ' + f.min)); return; }
          if (f.max != null && n > f.max) { fail(f.key, f.msg || ('不能大于 ' + f.max)); return; }
        }
      });

      if (st.key === 'harvest') {
        var w = Number(values.weight);
        var a = Number(values.gradeA);
        var b = Number(values.gradeB);
        if (isFinite(w) && isFinite(a) && isFinite(b) && a + b > w + 1e-9) {
          fail('gradeA', 'A级 + B级不能超过采收重量');
          fail('gradeB', 'A级 + B级不能超过采收重量');
        }
      }

      if (!ok) {
        MobileStore.toast('请检查表单中标红的字段', 'warning');
        return null;
      }
      return { batch: batch, house: house, operator: operator, time: time, values: values };
    }

    function submitForm() {
      var st = currentStage();
      var v = validateForm(st);
      if (!v) return;

      var remark = document.getElementById('f_remark').value.trim();
      var desc = st.desc(v.values);
      if (remark) desc += ' · 备注：' + remark;

      var offline = (navigator.onLine === false) || (MobileStore.isOnline() === false);
      var rec = {
        id: 'proc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        stage: st.name,
        batch: v.batch,
        house: v.house,
        operator: v.operator,
        time: v.time,
        fields: v.values,
        photo: selectedPhoto,
        status: offline ? 'pending' : 'submitted',
        desc: desc
      };

      if (!saveRecords([rec].concat(readRecords()))) {
        MobileStore.toast('本地存储写入失败，请清理空间后重试', 'error');
        return;
      }

      if (offline) {
        MobileStore.enqueue({
          id: 'q_' + rec.id,
          type: 'process_record',
          refId: rec.id,
          payload: rec
        });
      }

      closeForm();
      refresh();
      MobileStore.toast(offline ? '网络不可用，记录已离线暂存' : '记录已提交成功',
        offline ? 'warning' : 'success');
    }

    /* ---------------- 弹窗 ---------------- */

    function lockBody(on) {
      document.body.style.overflow = on ? 'hidden' : '';
    }

    function openForm() {
      renderForm();
      document.getElementById('formModal').classList.add('show');
      lockBody(true);
    }

    function closeForm() {
      document.getElementById('formModal').classList.remove('show');
      lockBody(false);
    }

    function openDetail(id) {
      var r = readRecords().filter(function (x) { return x.id === id; })[0];
      if (!r) return;
      currentDetailId = id;
      var st = stageByName(r.stage) || STAGES[0];
      var pending = r.status === 'pending';

      var rows = st.fields.map(function (f) {
        var val = (r.fields && r.fields[f.key] != null && r.fields[f.key] !== '') ? r.fields[f.key] : '-';
        return '<div class="d-row"><span>' + esc(f.label) + '</span><b>' + esc(val) + '</b></div>';
      }).join('');

      document.getElementById('detailTitle').textContent = st.name + ' · 记录详情';
      document.getElementById('detailBody').innerHTML =
        '<div class="detail-badges">' +
          '<span class="stage-pill"><i style="background:' + st.color + '"></i>' + esc(st.name) + '</span>' +
          '<span class="badge ' + (pending ? 'pending' : 'submitted') + '">' +
            (pending ? '待同步' : '已提交') + '</span>' +
        '</div>' +
        '<div class="d-row"><span>批次号</span><b>' + esc(r.batch) + '</b></div>' +
        '<div class="d-row"><span>菇房 / 车间</span><b>' + esc(r.house) + '</b></div>' +
        '<div class="d-row"><span>操作人</span><b>' + esc(r.operator) + '</b></div>' +
        '<div class="d-row"><span>记录时间</span><b>' + esc(fmtTimeText(r.time)) + '</b></div>' +
        rows +
        '<div class="d-row"><span>描述摘要</span><b>' + esc(r.desc || '-') + '</b></div>' +
        '<div class="d-label">凭证照片</div>' +
        (r.photo
          ? '<img class="detail-photo" src="' + esc(r.photo) + '" alt="记录凭证照片">'
          : '<div class="d-empty">未上传照片</div>') +
        (pending ? '<div class="pending-note">该记录保存在本机，尚未同步至服务器；网络恢复后可重试同步。</div>' : '');

      document.getElementById('detailFoot').innerHTML =
        (pending ? '<button class="mb-btn btn-cancel" type="button" onclick="retrySync()">重试同步</button>' : '') +
        '<button class="mb-btn mb-btn-primary" type="button" onclick="closeDetail()">关闭</button>';

      document.getElementById('detailModal').classList.add('show');
      lockBody(true);
    }

    function closeDetail() {
      document.getElementById('detailModal').classList.remove('show');
      lockBody(false);
      currentDetailId = '';
    }

    function retrySync() {
      if (!currentDetailId) return;
      var id = currentDetailId;
      MobileStore.flush().then(function (res) {
        reconcilePending();
        refresh();
        var r = readRecords().filter(function (x) { return x.id === id; })[0];
        if (r) openDetail(id);
        if (res && res.ok) MobileStore.toast('同步成功', 'success');
        else if (!MobileStore.isOnline()) MobileStore.toast('当前网络不可用，记录仍待同步', 'warning');
        else MobileStore.toast('同步失败，请稍后重试', 'error');
      });
    }

    /* ---------------- 初始化 ---------------- */

    function initFromUrl() {
      var params = new URLSearchParams(window.location.search || '');
      urlBatch = (params.get('batch') || '').trim().toUpperCase();
      var raw = params.get('stage') || '';
      stageKey = STAGE_ALIAS[raw] || 'mix';
    }

    document.addEventListener('DOMContentLoaded', function () {
      initFromUrl();
      seedRecordsIfEmpty();
      refresh();
      MobileStore.renderSyncBar(document.getElementById('syncBar'));

      MobileStore.onQueueChange(function () {
        reconcilePending();
        refresh();
      });
      MobileStore.subscribe(function () {
        reconcilePending();
        refresh();
      });
      window.addEventListener('storage', function (e) {
        if (e.key === RECORD_KEY || e.key === MobileStore.KEYS.queue) {
          reconcilePending();
          refresh();
        }
      });

      document.getElementById('formModal').addEventListener('click', function (e) {
        if (e.target === this) closeForm();
      });
      document.getElementById('detailModal').addEventListener('click', function (e) {
        if (e.target === this) closeDetail();
      });

      /* 从扫码开工页跳转：自动打开对应工序表单 */
      if (urlBatch) {
        setTimeout(function () { openForm(); }, 280);
      }
    });
  </script>
</body>
</html>
