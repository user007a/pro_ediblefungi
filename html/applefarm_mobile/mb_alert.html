<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>食用菌环境监测系统 - 预警处置</title>
  <link rel="stylesheet" href="css/mobile-design-system.css">
  <style>
    /* ===== 菌菇工厂主题 v2.1：中性画布 + 品牌棕点缀（头部/主按钮/选中态）；
       状态色用设计系统惯例绿/琥珀/红/蓝，全棕暖调仅消费者追溯 H5 使用 ===== */
    :root {
      --bg: #FAF9F7;
      --text: #26221E;
      --text-secondary: #55504A;
      --text-tertiary: #7A7268;
      --border: #E6E1D8;
      --border-light: #F0EDE7;
      --shadow-card: 0 2px 12px rgba(69, 48, 35, 0.08);
    }

    body { background: var(--bg); }

    .wrap { max-width: 750px; margin: 0 auto; padding-bottom: 32px; }

    /* ===== 统计 ===== */
    .stat-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 14px 14px 0;
    }
    .stat-card {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 12px 8px;
      text-align: center;
    }
    .stat-num {
      font-size: 26px;
      line-height: 1.15;
      font-weight: 700;
      font-family: var(--font-family-number);
      color: var(--text);
    }
    .stat-label {
      margin-top: 3px;
      font-size: var(--font-xs);
      color: var(--text-secondary);
    }
    .stat-card.wait .stat-num { color: var(--warning-dark); }
    .stat-card.doing .stat-num { color: var(--info); }
    .stat-card.done .stat-num { color: var(--success-dark); }

    /* ===== 筛选 ===== */
    .filter-box {
      margin: 12px 14px 0;
      padding: 10px 12px;
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
    }
    .filter-row { display: flex; align-items: center; gap: 8px; }
    .filter-row + .filter-row { margin-top: 8px; }
    .filter-label {
      width: 30px;
      flex-shrink: 0;
      font-size: var(--font-2xs);
      color: var(--text-tertiary);
    }
    .chip-scroll {
      display: flex;
      gap: 7px;
      flex: 1;
      overflow-x: auto;
      padding: 1px 0;
      -webkit-overflow-scrolling: touch;
    }
    .chip {
      flex-shrink: 0;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-light);
      background: var(--primary-50);
      color: var(--text-secondary);
      font-size: var(--font-2xs);
      line-height: 1.7;
      white-space: nowrap;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .chip.active {
      background: var(--gradient-primary);
      border-color: transparent;
      color: var(--text-on-primary);
      font-weight: 600;
    }

    /* ===== 预警列表 ===== */
    .alert-list { padding: 12px 14px 0; }
    .alert-card {
      position: relative;
      overflow: hidden;
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 12px 13px 11px 17px;
      margin-bottom: 9px;
      cursor: pointer;
      transition: transform var(--transition-fast);
    }
    .alert-card:active { transform: scale(0.99); }
    .alert-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--info);
    }
    .alert-card.lv-yellow::before { background: var(--warning); }
    .alert-card.lv-orange::before { background: var(--warning-dark); }
    .alert-card.lv-red::before { background: var(--error); }

    .alert-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .alert-top-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .lv-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: var(--font-2xs);
      font-weight: 600;
      white-space: nowrap;
    }
    .lv-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .lv-badge.lv-blue {
      color: var(--info);
      background: var(--info-light);
      background: color-mix(in srgb, var(--info) 12%, #fff);
    }
    .lv-badge.lv-yellow {
      color: var(--warning-dark);
      background: var(--warning-light);
    }
    .lv-badge.lv-orange {
      color: var(--warning-dark);
      background: var(--warning-light);
      background: color-mix(in srgb, var(--warning-dark) 16%, #fff);
    }
    .lv-badge.lv-red {
      color: var(--error);
      background: var(--error-light);
      background: color-mix(in srgb, var(--error) 10%, #fff);
    }
    .alert-time {
      font-size: var(--font-2xs);
      color: var(--text-tertiary);
      white-space: nowrap;
    }
    .alert-title {
      font-size: var(--font-base);
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 5px;
    }
    .alert-house {
      font-size: var(--font-xs);
      color: var(--text-secondary);
      margin-bottom: 5px;
    }
    .alert-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      font-size: var(--font-2xs);
      color: var(--text-secondary);
    }
    .alert-meta b { color: var(--text); font-weight: 600; }
    .alert-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 9px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-light);
    }
    .alert-link {
      font-size: var(--font-xs);
      color: var(--primary-600);
      font-weight: 500;
    }

    .st-badge {
      font-size: var(--font-2xs);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-weight: 600;
      white-space: nowrap;
    }
    .st-badge.pending { background: var(--warning-light); color: var(--warning-dark); }
    .st-badge.processing {
      background: var(--info-light);
      background: color-mix(in srgb, var(--info) 12%, #fff);
      color: var(--info);
    }
    .st-badge.done { background: var(--success-light); color: var(--success-dark); }

    .empty {
      padding: 46px 20px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: var(--font-sm);
    }
    .empty svg {
      width: 44px;
      height: 44px;
      color: var(--primary-300);
      margin-bottom: 10px;
    }

    /* ===== 底部抽屉 ===== */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      z-index: 400;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(44, 32, 22, 0.5);
      opacity: 0;
      visibility: hidden;
      transition: opacity var(--transition-normal), visibility var(--transition-normal);
    }
    .sheet-overlay.show { opacity: 1; visibility: visible; }
    .sheet {
      width: 100%;
      max-width: 750px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--bg-white);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      padding: 16px 16px calc(22px + env(safe-area-inset-bottom, 0px));
      transform: translateY(26px);
      transition: transform var(--transition-normal);
    }
    .sheet-overlay.show .sheet { transform: translateY(0); }
    .sheet-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .sheet-title {
      font-size: var(--font-md);
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
    }
    .sheet-sub {
      margin-top: 3px;
      font-size: var(--font-xs);
      color: var(--text-tertiary);
    }
    .sheet-close {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      background: var(--primary-50);
      color: var(--text-secondary);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detail-box {
      margin: 10px 0 14px;
      padding: 10px 12px;
      background: var(--primary-50);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
    }
    .detail-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 3px 0;
      font-size: var(--font-sm);
    }
    .detail-row .k { color: var(--text-secondary); flex-shrink: 0; }
    .detail-row .v {
      color: var(--text);
      font-weight: 500;
      text-align: right;
      word-break: break-all;
    }
    .detail-row .v.warn { color: var(--error); }
    .detail-box .detail-box-title {
      font-size: var(--font-xs);
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .form-item { margin-bottom: 13px; }
    .form-label {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 6px;
      font-size: var(--font-xs);
      font-weight: 500;
      color: var(--text-secondary);
    }
    .form-label .req { color: var(--error); }
    .form-select,
    .form-textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-white);
      color: var(--text);
      font-size: var(--font-base);
      font-family: var(--font-family);
      outline: none;
      transition: border-color var(--transition-fast);
    }
    .form-select:focus,
    .form-textarea:focus { border-color: var(--primary); }
    .form-textarea {
      resize: vertical;
      min-height: 76px;
      line-height: 1.5;
    }
    .form-hint {
      margin-top: 5px;
      font-size: var(--font-2xs);
      color: var(--text-tertiary);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 46px;
      border: none;
      border-radius: var(--radius-lg);
      font-size: var(--font-md);
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity var(--transition-fast);
    }
    .btn:active { opacity: 0.88; }
    .btn-primary {
      background: var(--gradient-primary);
      color: var(--text-on-primary);
      box-shadow: 0 2px 10px rgba(107, 75, 53, 0.22);
    }
    .btn-ghost {
      background: var(--primary-50);
      border: 1px solid var(--primary-200);
      color: var(--primary-700);
    }
    .sheet-actions { margin-top: 16px; }
    .sheet-actions .btn + .btn { margin-top: 8px; }
    .link { color: var(--primary-600); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mb-back-bar">
      <button class="mb-back-arrow" type="button" onclick="goHome()" aria-label="返回首页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="mb-back-title">预警处置</div>
    </div>

    <div class="stat-row">
      <div class="stat-card wait">
        <div class="stat-num" id="statPending">0</div>
        <div class="stat-label">待处置</div>
      </div>
      <div class="stat-card doing">
        <div class="stat-num" id="statProcessing">0</div>
        <div class="stat-label">处置中</div>
      </div>
      <div class="stat-card done">
        <div class="stat-num" id="statDone">0</div>
        <div class="stat-label">今日已处置</div>
      </div>
    </div>

    <div class="filter-box">
      <div class="filter-row">
        <span class="filter-label">状态</span>
        <div class="chip-scroll" id="statusChips">
          <div class="chip active" data-status="all" onclick="setStatus('all')">全部</div>
          <div class="chip" data-status="pending" onclick="setStatus('pending')">待处置</div>
          <div class="chip" data-status="processing" onclick="setStatus('processing')">处置中</div>
          <div class="chip" data-status="done" onclick="setStatus('done')">已处置</div>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-label">级别</span>
        <div class="chip-scroll" id="levelChips">
          <div class="chip active" data-level="all" onclick="setLevel('all')">全部</div>
          <div class="chip" data-level="blue" onclick="setLevel('blue')">蓝色</div>
          <div class="chip" data-level="yellow" onclick="setLevel('yellow')">黄色</div>
          <div class="chip" data-level="orange" onclick="setLevel('orange')">橙色</div>
          <div class="chip" data-level="red" onclick="setLevel('red')">红色</div>
        </div>
      </div>
    </div>

    <div class="alert-list" id="alertList"></div>
  </div>

  <div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this)closeSheet()">
    <div class="sheet" id="sheet"></div>
  </div>

  <script>
    /* ============================================================
     * 预警处置（移动端）
     * 数据源：localStorage['mushroom_alert_records']
     * 转工单同步写入 localStorage['mushroom_repair_orders']
     * ============================================================ */
    var ALERT_KEY = 'mushroom_alert_records';
    var ORDER_KEY = 'mushroom_repair_orders';

    var LEVEL_TEXT = { blue: '蓝色', yellow: '黄色', orange: '橙色', red: '红色' };
    var LEVEL_ORDER = { red: 0, orange: 1, yellow: 2, blue: 3 };
    var STATUS_TEXT = { pending: '待处置', processing: '处置中', done: '已处置' };
    var STATUS_ORDER = { pending: 0, processing: 1, done: 2 };
    var RESULT_TEXT = { restored: '已恢复', observe: '待观察', repair: '需转维修工单' };
    var URGENCY_BY_LEVEL = { red: 'stop', orange: 'urgent', yellow: 'normal', blue: 'normal' };

    var filterStatus = 'all';
    var filterLevel = 'all';
    var currentId = null;
    var alerts = [];

    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function dateStr(d) {
      d = d || new Date();
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }
    function nowStr() {
      var d = new Date();
      return dateStr(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function getUser() {
      try { return sessionStorage.getItem('loginUser') || '李国强'; } catch (e) { return '李国强'; }
    }

    function seedAlerts() {
      var day = dateStr();
      var stamp = day.replace(/-/g, '');
      return [
        {
          id: 'AL-' + stamp + '-01', level: 'red', title: '一号出菇房温度超上限',
          house: '一号出菇房 GF-01', metric: '温度', current: '19.6℃', threshold: '上限 18.4℃',
          duration: '18 分钟', source: '温度传感器 T2', device: '温度传感器 T2', circuit: 'GF-01',
          status: 'pending', time: day + ' 09:12'
        },
        {
          id: 'AL-' + stamp + '-02', level: 'orange', title: '三号出菇房 CO₂ 浓度超上限',
          house: '三号出菇房 GF-03', metric: 'CO₂ 浓度', current: '1120ppm', threshold: '上限 800ppm',
          duration: '6 分钟', source: 'CO₂传感器 C1', device: 'CO₂传感器 C1', circuit: 'GF-03',
          status: 'processing', time: day + ' 08:47'
        },
        {
          id: 'AL-' + stamp + '-03', level: 'yellow', title: '二号出菇房湿度低于下限',
          house: '二号出菇房 GF-02', metric: '空气湿度', current: '86%', threshold: '下限 88%',
          duration: '12 分钟', source: '湿度传感器 H2', device: '湿度传感器 H2', circuit: 'GF-02',
          status: 'pending', time: day + ' 08:05'
        },
        {
          id: 'AL-' + stamp + '-04', level: 'blue', title: '五号加湿器通信延迟',
          house: '五号出菇房 GF-05', metric: '通信状态', current: '延迟 3 次', threshold: '延迟 ≤1 次',
          duration: '约 25 分钟', source: '网关 GW-05', device: '超声波加湿器 5#', circuit: 'GF-05',
          status: 'pending', time: day + ' 07:58'
        },
        {
          id: 'AL-' + stamp + '-05', level: 'orange', title: '二号循环风机故障停机',
          house: '二号出菇房 GF-02', metric: '设备运行', current: '已停机', threshold: '运行状态',
          duration: '9 分钟', source: '风机控制器 DO-05', device: '循环风机 2#', circuit: 'GF-02',
          status: 'pending', time: day + ' 07:30'
        }
      ];
    }

    function readAlerts() {
      try {
        var raw = localStorage.getItem(ALERT_KEY);
        if (raw) {
          var v = JSON.parse(raw);
          if (Array.isArray(v) && v.length) return v;
        }
      } catch (e) { /* 解析失败时回退种子数据 */ }
      var seed = seedAlerts();
      saveAlerts(seed);
      return seed;
    }
    function saveAlerts(list) {
      try { localStorage.setItem(ALERT_KEY, JSON.stringify(list)); } catch (e) { /* 存储失败忽略 */ }
    }
    function readOrders() {
      try {
        var raw = localStorage.getItem(ORDER_KEY);
        var v = raw ? JSON.parse(raw) : [];
        return Array.isArray(v) ? v : [];
      } catch (e) { return []; }
    }
    function saveOrders(list) {
      try { localStorage.setItem(ORDER_KEY, JSON.stringify(list)); } catch (e) { /* 存储失败忽略 */ }
    }
    function nextOrderNo(list) {
      var prefix = 'WX-' + dateStr().replace(/-/g, '') + '-';
      var max = 0;
      list.forEach(function (o) {
        if (!o || typeof o.id !== 'string' || o.id.indexOf(prefix) !== 0) return;
        var n = parseInt(o.id.slice(prefix.length), 10);
        if (!isNaN(n) && n > max) max = n;
      });
      var n = max + 1;
      return prefix + (n < 10 ? '0' + n : '' + n);
    }
    function findAlert(id) {
      for (var i = 0; i < alerts.length; i++) {
        if (alerts[i].id === id) return alerts[i];
      }
      return null;
    }

    function toast(msg, type) {
      if (window.MobileStore && typeof MobileStore.toast === 'function') {
        MobileStore.toast(msg, type || 'info');
        return;
      }
      var box = document.createElement('div');
      box.className = 'mb-toast mb-toast-' + (type || 'info');
      box.textContent = msg;
      box.setAttribute('role', 'status');
      document.body.appendChild(box);
      setTimeout(function () { box.classList.add('show'); }, 10);
      setTimeout(function () {
        box.classList.remove('show');
        setTimeout(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 260);
      }, 2200);
    }

    function goHome() { window.location.href = 'mb_home.html'; }

    function setStatus(s) {
      filterStatus = s;
      document.querySelectorAll('#statusChips .chip').forEach(function (c) {
        c.classList.toggle('active', c.getAttribute('data-status') === s);
      });
      renderList();
    }
    function setLevel(l) {
      filterLevel = l;
      document.querySelectorAll('#levelChips .chip').forEach(function (c) {
        c.classList.toggle('active', c.getAttribute('data-level') === l);
      });
      renderList();
    }

    function renderStats() {
      var pending = 0, processing = 0, doneToday = 0, today = dateStr();
      alerts.forEach(function (a) {
        if (a.status === 'pending') pending++;
        else if (a.status === 'processing') processing++;
        else if (a.status === 'done' && String(a.handledAt || '').indexOf(today) === 0) doneToday++;
      });
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statProcessing').textContent = processing;
      document.getElementById('statDone').textContent = doneToday;
    }

    function renderList() {
      var box = document.getElementById('alertList');
      var list = alerts.filter(function (a) {
        if (filterStatus !== 'all' && a.status !== filterStatus) return false;
        if (filterLevel !== 'all' && a.level !== filterLevel) return false;
        return true;
      });
      list.sort(function (a, b) {
        var sa = STATUS_ORDER[a.status] == null ? 9 : STATUS_ORDER[a.status];
        var sb = STATUS_ORDER[b.status] == null ? 9 : STATUS_ORDER[b.status];
        if (sa !== sb) return sa - sb;
        var la = LEVEL_ORDER[a.level] == null ? 9 : LEVEL_ORDER[a.level];
        var lb = LEVEL_ORDER[b.level] == null ? 9 : LEVEL_ORDER[b.level];
        if (la !== lb) return la - lb;
        return String(b.time || '').localeCompare(String(a.time || ''));
      });

      if (!list.length) {
        box.innerHTML = '<div class="empty">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.5"/></svg>' +
          '<div>暂无符合条件的预警</div></div>';
        return;
      }

      box.innerHTML = list.map(function (a) {
        var actionable = a.status !== 'done';
        return '<div class="alert-card lv-' + a.level + '" onclick="openSheet(\'' + a.id + '\')">' +
          '<div class="alert-top">' +
            '<div class="alert-top-left">' +
              '<span class="lv-badge lv-' + a.level + '">' + (LEVEL_TEXT[a.level] || a.level) + '预警</span>' +
              '<span class="st-badge ' + a.status + '">' + (STATUS_TEXT[a.status] || a.status) + '</span>' +
            '</div>' +
            '<span class="alert-time">' + esc(a.time) + '</span>' +
          '</div>' +
          '<div class="alert-title">' + esc(a.title) + '</div>' +
          '<div class="alert-house">' + esc(a.house) + '</div>' +
          '<div class="alert-meta">' +
            '<span>当前 <b>' + esc(a.current) + '</b></span>' +
            '<span>阈值 ' + esc(a.threshold) + '</span>' +
            '<span>持续 ' + esc(a.duration) + '</span>' +
          '</div>' +
          '<div class="alert-foot">' +
            '<span class="alert-house" style="margin:0;">来源：' + esc(a.source) + '</span>' +
            '<span class="alert-link">' + (actionable ? '去处置 ›' : '查看处置 ›') + '</span>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function detailRows(a, withHandle) {
      var html = '<div class="detail-box">' +
        '<div class="detail-row"><span class="k">指标</span><span class="v">' + esc(a.metric) + '</span></div>' +
        '<div class="detail-row"><span class="k">当前值</span><span class="v warn">' + esc(a.current) + '</span></div>' +
        '<div class="detail-row"><span class="k">阈值</span><span class="v">' + esc(a.threshold) + '</span></div>' +
        '<div class="detail-row"><span class="k">持续时长</span><span class="v">' + esc(a.duration) + '</span></div>' +
        '<div class="detail-row"><span class="k">数据来源</span><span class="v">' + esc(a.source) + '</span></div>' +
        '<div class="detail-row"><span class="k">菇房</span><span class="v">' + esc(a.house) + '</span></div>' +
        '<div class="detail-row"><span class="k">触发时间</span><span class="v">' + esc(a.time) + '</span></div>' +
        '<div class="detail-row"><span class="k">预警级别</span><span class="v">' + (LEVEL_TEXT[a.level] || a.level) + '</span></div>' +
        '</div>';
      if (withHandle) {
        html += '<div class="detail-box">' +
          '<div class="detail-box-title">处置记录</div>' +
          '<div class="detail-row"><span class="k">处置措施</span><span class="v">' + esc(a.measure || '—') + '</span></div>' +
          '<div class="detail-row"><span class="k">处置结果</span><span class="v">' + esc(RESULT_TEXT[a.result] || a.result || '—') + '</span></div>' +
          '<div class="detail-row"><span class="k">处置说明</span><span class="v">' + esc(a.remark || '—') + '</span></div>' +
          '<div class="detail-row"><span class="k">处置人</span><span class="v">' + esc(a.handledBy || '—') + '</span></div>' +
          '<div class="detail-row"><span class="k">处置时间</span><span class="v">' + esc(a.handledAt || '—') + '</span></div>' +
          (a.repairOrderNo ? '<div class="detail-row"><span class="k">关联工单</span><span class="v"><a class="link" href="mb_troubleshoot.html">' + esc(a.repairOrderNo) + ' ›</a></span></div>' : '') +
          '</div>';
      }
      return html;
    }

    function sheetHead(a, sub) {
      return '<div class="sheet-head">' +
        '<div>' +
          '<div class="sheet-title">' + esc(a.title) + '</div>' +
          '<div class="sheet-sub">' + esc(sub) + '</div>' +
        '</div>' +
        '<button class="sheet-close" type="button" onclick="closeSheet()" aria-label="关闭">×</button>' +
      '</div>';
    }

    function openSheet(id) {
      currentId = id;
      var a = findAlert(id);
      if (!a) return;
      var sheet = document.getElementById('sheet');
      if (a.status === 'done') {
        sheet.innerHTML = sheetHead(a, '已处置 · ' + (a.handledAt || '')) + detailRows(a, true) +
          '<div class="sheet-actions"><button class="btn btn-ghost" type="button" onclick="closeSheet()">关闭</button></div>';
      } else {
        sheet.innerHTML = sheetHead(a, '当前状态：' + (STATUS_TEXT[a.status] || a.status)) + detailRows(a, false) +
          '<div class="form-item">' +
            '<div class="form-label">处置措施 <span class="req">*</span></div>' +
            '<select class="form-select" id="fMeasure">' +
              '<option value="">请选择处置措施</option>' +
              '<option value="调整阈值">调整阈值</option>' +
              '<option value="启停设备">启停设备</option>' +
              '<option value="现场检修">现场检修</option>' +
              '<option value="上报主管">上报主管</option>' +
              '<option value="其他">其他</option>' +
            '</select>' +
          '</div>' +
          '<div class="form-item">' +
            '<div class="form-label">处置结果 <span class="req">*</span></div>' +
            '<select class="form-select" id="fResult" onchange="toggleRemarkHint()">' +
              '<option value="">请选择处置结果</option>' +
              '<option value="restored">已恢复</option>' +
              '<option value="observe">待观察</option>' +
              '<option value="repair">需转维修工单</option>' +
            '</select>' +
          '</div>' +
          '<div class="form-item">' +
            '<div class="form-label">处置说明</div>' +
            '<textarea class="form-textarea" id="fRemark" maxlength="200" placeholder="补充现场处置过程、复测结果等"></textarea>' +
            '<div class="form-hint" id="remarkHint">选填；处置结果为「需转维修工单」时必填</div>' +
          '</div>' +
          '<div class="sheet-actions">' +
            '<button class="btn btn-primary" type="button" onclick="submitDispose()">提交处置</button>' +
          '</div>';
      }
      document.getElementById('sheetOverlay').classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeSheet() {
      document.getElementById('sheetOverlay').classList.remove('show');
      document.body.style.overflow = '';
      currentId = null;
    }

    function toggleRemarkHint() {
      var r = document.getElementById('fResult');
      var hint = document.getElementById('remarkHint');
      if (!r || !hint) return;
      if (r.value === 'repair') {
        hint.textContent = '转维修工单必填：请说明故障情况与现场处置';
        hint.style.color = 'var(--error)';
      } else {
        hint.textContent = '选填；处置结果为「需转维修工单」时必填';
        hint.style.color = '';
      }
    }

    function submitDispose() {
      var a = findAlert(currentId);
      if (!a) return;
      var measureEl = document.getElementById('fMeasure');
      var resultEl = document.getElementById('fResult');
      var remarkEl = document.getElementById('fRemark');
      var measure = measureEl ? measureEl.value : '';
      var result = resultEl ? resultEl.value : '';
      var remark = remarkEl ? String(remarkEl.value || '').trim() : '';

      if (!measure) { toast('请选择处置措施', 'warning'); return; }
      if (!result) { toast('请选择处置结果', 'warning'); return; }
      if (result === 'repair' && !remark) {
        toast('转维修工单需填写处置说明', 'warning');
        if (remarkEl) remarkEl.focus();
        return;
      }
      if (!window.confirm('确认提交本次处置结果？')) return;

      var user = getUser();
      var time = nowStr();
      var msg = '处置已提交';

      a.status = 'done';
      a.handledBy = user;
      a.handledAt = time;
      a.measure = measure;
      a.result = result;
      a.remark = remark;

      if (result === 'repair') {
        var orders = readOrders();
        var no = nextOrderNo(orders);
        orders.unshift({
          id: no,
          device: a.device || a.source || a.title,
          circuit: a.circuit || a.house,
          urgency: URGENCY_BY_LEVEL[a.level] || 'normal',
          desc: a.title + '（当前 ' + a.current + '，' + a.threshold + '）' + (remark ? '；' + remark : ''),
          phone: '13800000002',
          reporter: user,
          time: time,
          photo: '',
          status: 'pending',
          fromAlert: a.id
        });
        saveOrders(orders);
        a.repairOrderNo = no;
        msg = '处置已提交，已转维修工单 ' + no;
      }

      saveAlerts(alerts);
      closeSheet();
      refresh();
      toast(msg, result === 'repair' ? 'warning' : 'success');
    }

    function refresh() {
      renderStats();
      renderList();
    }

    alerts = readAlerts();
    refresh();
  </script>
</body>
</html>
