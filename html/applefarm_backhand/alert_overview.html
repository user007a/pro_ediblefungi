<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%2352c41a'/%3E%3C/svg%3E">
<title>工厂化农业数据管理系统 - 预警管理</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .search-input { flex:1; min-width:220px; }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:999; backdrop-filter:blur(4px); }
  .modal-overlay.show { display:block; }
  .modal-box { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:var(--bg-card); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.15);
    width:600px; max-width:94vw; max-height:88vh; overflow-y:auto; z-index:1000; animation:modalSlideIn .25s ease-out; padding:20px 24px; }
  .modal-box.show { display:block; }
  @keyframes modalSlideIn { from{opacity:0;transform:translate(-50%,-50%) scale(.95)} to{opacity:1;transform:translate(-50%,-50%) scale(1)} }
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;
    padding-bottom:16px; border-bottom:1px solid var(--border-light); }
  .modal-header h3 { font-size:16px; font-weight:600; color:var(--text-primary); margin:0; }
  .modal-close { width:28px; height:28px; border:none; background:var(--gray-100); border-radius:6px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .modal-close:hover { background:var(--error-bg); color:var(--error); }
  .modal-body { padding:0 4px; }
  .modal-footer { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; padding:16px 0 0;
    border-top:1px solid var(--border-light); }
  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-size:13px; font-weight:500; color:var(--text-secondary); margin-bottom:8px; }
  .form-group label.required::after { content:' *'; color:var(--error); }
  .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px;
    border:1px solid var(--border-default); border-radius:8px; font-size:13px; box-sizing:border-box; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:var(--primary-400); box-shadow:0 0 0 3px rgba(24,144,255,.1); }
  .form-row { display:flex; gap:16px; }
  .form-row > .form-group { flex:1; }
  .form-hint { font-size:11.5px; color:var(--text-tertiary); margin-top:6px; }

  .drawer-mask { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:998; opacity:0; visibility:hidden; transition:all .25s; }
  .drawer-mask.show { opacity:1; visibility:visible; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:540px; max-width:94vw; background:var(--bg-card); z-index:999;
    transform:translateX(102%); transition:transform .25s ease; box-shadow:-8px 0 30px rgba(0,0,0,.12); display:flex; flex-direction:column; }
  .drawer.show { transform:none; }
  .drawer-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border-light); }
  .drawer-header h3 { margin:0; font-size:15px; font-weight:600; color:var(--text-primary); }
  .drawer-body { flex:1; overflow-y:auto; padding:16px 20px; }
  .drawer-section { font-weight:600; font-size:13px; color:var(--text-primary); margin:18px 0 8px; }
  .drawer-section:first-child { margin-top:0; }
  .detail-info { padding:12px; background:linear-gradient(135deg,var(--gray-50),var(--gray-100));
    border-radius:12px; margin-bottom:12px; border:1px solid var(--border-default); }
  .detail-row { display:flex; padding:9px 0; border-bottom:1px dashed var(--border-default); font-size:13px; }
  .detail-row:last-child { border-bottom:none; }
  .detail-label { width:104px; color:var(--text-tertiary); flex-shrink:0; }
  .detail-value { flex:1; color:var(--text-primary); word-break:break-all; }

  .level-tag { display:inline-block; padding:2px 8px; border-radius:var(--radius-sm); font-size:11.5px; font-weight:500; white-space:nowrap; }
  .level-tag.level-urgent { background:var(--error-bg); color:#cf1322; border:1px solid #ffccc7; }
  .level-tag.level-important { background:var(--warning-bg); color:#ad6800; border:1px solid var(--warning-border); }
  .level-tag.level-reminder { background:var(--info-bg); color:var(--primary-600); border:1px solid var(--info-border); }
  .level-tag.level-notice { background:var(--gray-100); color:var(--text-secondary); border:1px solid var(--border-default); }
  .status-tag { display:inline-flex; align-items:center; padding:3px 10px; font-size:11.5px;
    font-weight:500; border-radius:20px; white-space:nowrap; }
  .status-tag.st-pending { background:var(--warning-bg); color:#ad8b00; border:1px solid var(--warning-border); }
  .status-tag.st-processing { background:var(--info-bg); color:var(--primary-500); border:1px solid var(--info-border); }
  .status-tag.st-closed { background:#d9f7be; color:#3a8618; border:1px solid #b7eb8f; }
  .src-badge { display:inline-block; padding:2px 8px; border-radius:var(--radius-sm); font-size:11.5px; font-weight:500; white-space:nowrap; }

  .stat-card-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:16px; }
  .stat-card-row .stat-card { margin-top:0 !important; cursor:pointer; }
  .stat-label { font-size:12px; color:var(--text-tertiary); margin-bottom:6px; }
  .stat-value { font-size:26px; font-weight:700; color:var(--text-primary); font-variant-numeric:tabular-nums; }
  .stat-value .unit { font-size:13px; font-weight:500; color:var(--text-tertiary); margin-left:4px; }
  .stat-sub { margin-top:6px; font-size:12px; color:var(--text-tertiary); }
  .stat-sub.warn { color:var(--warning); }
  .stat-sub.err { color:var(--error); }

  .source-chips { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .src-chip { display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:10px; cursor:pointer;
    border:1px solid var(--border-default); background:#fff; font-size:13px; color:var(--text-secondary); transition:all .15s; }
  .src-chip .chip-dot { width:9px; height:9px; border-radius:3px; }
  .src-chip .chip-count { font-weight:700; font-variant-numeric:tabular-nums; color:var(--text-primary); }
  .src-chip:hover { border-color:var(--primary-400); }
  .src-chip.active { border-color:var(--primary-500); background:var(--primary-50); color:var(--primary-600); box-shadow:0 0 0 3px rgba(24,144,255,.08); }

  .status-tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .status-tab { padding:7px 16px; border-radius:8px; border:1px solid var(--border-default); background:#fff;
    font-size:13px; color:var(--text-secondary); cursor:pointer; }
  .status-tab:hover { border-color:var(--primary-400); color:var(--primary-600); }
  .status-tab.active { background:var(--primary-500); border-color:var(--primary-500); color:#fff; font-weight:500; }

  .data-table { min-width:1240px; }
  .data-table th { white-space:nowrap; }
  .data-table th.sortable { cursor:pointer; user-select:none; }
  .data-table th.sortable:hover { color:var(--primary-500); }
  .data-table th .arrow { font-size:10px; margin-left:3px; color:var(--primary-500); }
  .data-table tbody tr.clickable { cursor:pointer; }
  .data-table tbody tr.clickable:hover { background:#f7fbff; }
  .empty-row td { text-align:center; color:var(--text-tertiary); padding:40px 0; }
  .action-btns { display:flex; gap:6px; flex-wrap:nowrap; }
  .action-btn { padding:4px 10px; font-size:11.5px; font-weight:500; border:1px solid transparent;
    border-radius:6px; cursor:pointer; white-space:nowrap; background:none; }
  .action-btn.detail { color:#2b6cb0; background:#f5f8fc; border-color:#c5d9f0; }
  .action-btn.flow { color:#3a8618; background:#f6ffed; border-color:#b7eb8f; }
  .action-btn.assign { color:var(--primary-600); background:var(--primary-50); border-color:var(--primary-100); }
  #pagination-container { padding:12px 16px; }
  .selected-info { font-size:12.5px; color:var(--text-tertiary); margin-left:auto; }
  .selected-info strong { color:var(--primary-600); }

  .timeline { position:relative; padding-left:20px; }
  .timeline::before { content:''; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--border-default); }
  .tl-item { position:relative; padding:0 0 14px 8px; font-size:12.5px; }
  .tl-item::before { content:''; position:absolute; left:-19px; top:4px; width:10px; height:10px; border-radius:50%;
    background:#fff; border:2px solid var(--primary-400); }
  .tl-item.done::before { background:#52c41a; border-color:#52c41a; }
  .tl-item.todo::before { border-color:var(--border-default); }
  .tl-item .tl-title { font-weight:600; color:var(--text-primary); }
  .tl-item .tl-sub { color:var(--text-tertiary); font-size:11.5px; margin-top:2px; }
  .tl-item .tl-btn { margin-top:6px; }

  .sla-cell { font-variant-numeric:tabular-nums; font-size:12.5px; }
  .sla-count { font-weight:700; }
  .sla-count.ok { color:#3a8618; }
  .sla-count.tight { color:#e5484d; animation:slaBlink 1s ease-in-out infinite; }
  .sla-over { color:#e5484d; font-weight:700; }
  .sla-done { color:var(--text-tertiary); }
  @keyframes slaBlink { 0%,100%{opacity:1} 50%{opacity:.45} }
  .esc-badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600;
    background:#fff1f0; color:#cf1322; border:1px solid #ffa39e; white-space:nowrap; }
  .chan-chip { display:inline-block; padding:1px 8px; margin:2px 4px 2px 0; border-radius:20px; font-size:11px;
    background:var(--info-bg); color:var(--primary-600); border:1px solid var(--info-border); white-space:nowrap; }
  .step-btn { padding:3px 12px; font-size:11.5px; font-weight:500; border-radius:6px; cursor:pointer;
    color:var(--primary-600); background:var(--primary-50); border:1px solid var(--primary-100); }
  .step-btn:hover { background:var(--primary-100); }
</style>

<body data-active-menu="alert" data-active-submenu="alert-overview">

<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3L11 11M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </div>

    <main class="main-content">
      <nav class="device-tabs" aria-label="预警中心">
        <a href="alert_overview.html" class="active">预警管理</a>
        <a href="alert_settings.html">预警设置</a>
      </nav>

      <div class="stat-card-row" id="statCards"></div>

      <div class="source-chips" id="sourceChips"></div>

      <div class="page-section search-section">
        <div class="search-bar">
          <div class="status-tabs" id="statusTabs">
            <button class="status-tab active" data-status="" onclick="setStatusTab('')">全部</button>
            <button class="status-tab" data-status="pending" onclick="setStatusTab('pending')">待处理</button>
            <button class="status-tab" data-status="processing" onclick="setStatusTab('processing')">处理中</button>
            <button class="status-tab" data-status="closed" onclick="setStatusTab('closed')">已闭环</button>
          </div>
          <select class="search-select" id="levelSelect" style="min-width:130px;">
            <option value="">全部级别</option>
            <option value="urgent">红色·紧急</option>
            <option value="important">橙色·重要</option>
            <option value="reminder">黄色·提醒</option>
            <option value="notice">蓝色·提示</option>
          </select>
          <input type="text" class="search-input" id="searchInput" placeholder="搜索编号 / 标题 / 位置 / 描述...">
          <div class="search-actions">
            <button class="jg-btn" onclick="resetFilter()">重置</button>
          </div>
        </div>
      </div>

      <div class="page-section action-bar">
        <button class="jg-btn jg-btn-primary" onclick="openNewModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;">
            <path d="M12 5v14"/><path d="M5 12h14"/>
          </svg>新增预警
        </button>
        <button class="jg-btn-outline" id="bulkCloseBtn" onclick="bulkClose()" disabled>批量闭环</button>
        <button class="jg-btn-outline" onclick="exportAlerts()">导出CSV</button>
        <span class="selected-info" id="selectedInfo"></span>
      </div>

      <div class="page-section data-section">
        <div class="data-table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width:44px;text-align:center;"><input type="checkbox" id="checkAll" onclick="toggleAll(this)"></th>
                <th class="sortable" style="width:130px;" onclick="setSort('id')">预警编号<span class="arrow" id="ar-id"></span></th>
                <th>标题</th>
                <th class="sortable" style="width:80px;" onclick="setSort('level')">级别<span class="arrow" id="ar-level"></span></th>
                <th style="width:100px;">来源</th>
                <th style="width:170px;">位置</th>
                <th class="sortable" style="width:150px;" onclick="setSort('time')">时间<span class="arrow" id="ar-time"></span></th>
                <th style="width:150px;">响应时效</th>
                <th style="width:96px;">状态</th>
                <th style="width:210px;">操作</th>
              </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
          </table>
        </div>
        <div id="pagination-container"></div>
      </div>

    </main>
  </div>
</div>

<!-- 新增预警 -->
<div class="modal-overlay" id="newOverlay" onclick="closeNewModal()"></div>
<div class="modal-box" id="newModal">
  <div class="modal-header">
    <h3>新增预警</h3>
    <button class="modal-close" onclick="closeNewModal()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l8 8M11 3l-8 8"/></svg>
    </button>
  </div>
  <div class="modal-body">
    <div class="form-group"><label class="required">预警标题</label><input type="text" id="nTitle" placeholder="如 GF-06 CO₂ 浓度超标"></div>
    <div class="form-row">
      <div class="form-group"><label class="required">级别</label><select id="nLevel">
        <option value="urgent">紧急</option><option value="important" selected>重要</option>
        <option value="reminder">提醒</option><option value="notice">通知</option>
      </select></div>
      <div class="form-group"><label class="required">来源</label><select id="nSource"></select></div>
    </div>
    <div class="form-group"><label>位置</label><input type="text" id="nLocation" placeholder="如 出菇车间 · GF-06"></div>
    <div class="form-group"><label>预警描述</label><textarea id="nDesc" rows="3" placeholder="越限数值 / 持续时长 / 联动动作等"></textarea>
      <div class="form-hint">编号自动生成（FA-日期-序号），创建后进入「待处理」。</div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="jg-btn" onclick="closeNewModal()">取消</button>
    <button class="jg-btn jg-btn-primary" onclick="saveNew()">创建</button>
  </div>
</div>

<!-- 分派处理 -->
<div class="modal-overlay" id="assignOverlay" onclick="closeAssignModal()"></div>
<div class="modal-box" id="assignModal" style="width:460px;">
  <div class="modal-header">
    <h3 id="assignTitle">分派处理</h3>
    <button class="modal-close" onclick="closeAssignModal()">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l8 8M11 3l-8 8"/></svg>
    </button>
  </div>
  <div class="modal-body">
    <div class="form-group"><label class="required">处理负责人</label><select id="aOwner"></select></div>
    <div class="form-hint">确认后预警进入「处理中」，并记录分派时间。</div>
  </div>
  <div class="modal-footer">
    <button class="jg-btn" onclick="closeAssignModal()">取消</button>
    <button class="jg-btn jg-btn-primary" onclick="saveAssign()">开始处理</button>
  </div>
</div>

<!-- 处置措施 -->
<div class="modal-overlay" id="closeOverlay" onclick="closeCloseModal()"></div>
<div class="modal-box" id="closeModal" style="width:520px;">
  <div class="modal-header">
    <h3 id="closeTitle">填写处置措施</h3>
    <button class="modal-close" onclick="closeCloseModal()">

  <div class="modal-body">
    <div class="form-group"><label class="required">处置措施</label><textarea id="cMeasure" rows="3" placeholder="如：新风联动换气 30min 后 CO₂ 回落至 650ppm，复核正常"></textarea>

    <button class="jg-btn" onclick="closeCloseModal()">取消</button>

  </div>
</div>

    </button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<script>
/* ============================================================
 * 预警管理（环境越限 / 设备故障 / 污染超标 / 系统消息）
 * 数据源：FungiAlertData（list/get/stats/update/add）
 * 四色分级 + SLA 响应时效（红≤1/橙≤3/黄≤5/蓝≤30min）来自 LEVEL_META；
 * 待处理预警每秒倒计时，超时未响应自动 escalated=true 并提示升级规则。
 * 闭环五步（CLOSURE_STEPS）：派工→响应→措施→复核→关闭，
 * 依次写入 assignee/respondedAt/measures/reviewedAt/closedAt，
 * 状态流转 pending→processing→closed，前序步骤未完成时阻断并提示。
 * 页内补充字段 dispatchedAt（派工时间）由 FAD.update 写入。
 * ============================================================ */
var FAD = window.FungiAlertData;
var esc = DeviceUI.esc;
var LEVEL_ORDER = { urgent:0, important:1, reminder:2, notice:3 };
var SRC_META = {
  env: { text:'环境越限', color:'#1890ff', bg:'#e6f4ff' },
  device: { text:'设备故障', color:'#fa8c16', bg:'#fff7e6' },
  pollution: { text:'污染超标', color:'#722ed1', bg:'#f9f0ff' },
  system: { text:'系统消息', color:'#13c2c2', bg:'#e6fffb' }
};
var filterSource = '', filterStatus = '', filterLevel = '', filterEscalated = false;
var sortKey = 'time', sortDir = -1;
var curPage = 1, PAGE_SIZE = 8;
var selected = {};
var assignId = '', closeId = '', drawerAlertId = '';

function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function nowStr(){ var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function openPage(url, title){ if (window.parent && window.parent !== window && window.parent.openPage) window.parent.openPage(url, title); else location.href = url; }
function levelTag(l){
  var m = FAD.LEVEL_META[l] || FAD.LEVEL_META.notice;
  return '<span class="level-tag" style="background:' + m.hex + '1a;color:' + m.hex + ';border:1px solid ' + m.hex + '55;">' + m.name + '</span>';
}
function statusTag(s){ return '<span class="status-tag st-' + s + '">' + (FAD.STATUS_TEXT[s] || s) + '</span>'; }
function parseTime(str){
  if (!str) return null;
  var t = new Date(String(str).replace(' ', 'T') + ':00');
  return isNaN(t.getTime()) ? null : t;
}
function minutesBetween(fromStr, toStr){
  var f = parseTime(fromStr), t = toStr ? parseTime(toStr) : new Date();
  if (!f || !t) return null;
  return Math.max(0, Math.round((t.getTime() - f.getTime()) / 60000));
}
function slaDeadline(a){
  var t = parseTime(a.time);
  if (!t) return null;
  return t.getTime() + (a.slaMin || 30) * 60000;
}
function fmtCountdown(ms){
  var sec = Math.max(0, Math.ceil(ms / 1000));
  var m = Math.floor(sec / 60), s = sec % 60;
  if (m >= 60) return Math.floor(m / 60) + 'h' + pad2(m % 60) + 'm';
  return pad2(m) + ':' + pad2(s);
}
function slaCellHtml(a){
  if (a.status === 'closed') return '<span class="sla-done">已闭环归档</span>';
  if (a.respondedAt){
    var used = minutesBetween(a.time, a.respondedAt);
    var over = used != null && used > (a.slaMin || 30);
    return '<span class="' + (over ? 'sla-over' : 'sla-done') + '">已响应' + (used != null ? ' · 用时 ' + used + 'min' : '') + (over ? '（超时）' : '') + '</span>';
  }
  var dl = slaDeadline(a);
  if (dl == null) return '<span class="sla-done">—</span>';
  var remain = dl - Date.now();
  if (remain <= 0){
    return '<span class="sla-over">已超时</span>' + (a.escalated ? ' <span class="esc-badge">已升级</span>' : '');
  }
  return '<span class="sla-count ' + (remain <= 60000 ? 'tight' : 'ok') + '">剩余 ' + fmtCountdown(remain) + '</span>' +
    '<div style="font-size:11px;color:var(--text-tertiary);margin-top:2px;">SLA ≤' + a.slaMin + 'min</div>';
}
function slaCell(a){
  return '<span class="sla-cell" data-sla-id="' + esc(a.id) + '">' + slaCellHtml(a) + '</span>';
}
function channelChips(a){
  return (a.channels || []).map(function(c){ return '<span class="chan-chip">' + esc(c) + '</span>'; }).join('');
}
function isDispatched(a){ return a.assignee && a.assignee !== '—'; }
function nextAction(a){
  if (a.status === 'closed') return null;
  if (!isDispatched(a)) return { key:'assign', label:'派工', cls:'assign', fn:'openAssignModal' };
  if (!a.respondedAt) return { key:'respond', label:'响应', cls:'flow', fn:'respondAlert' };
  if (!a.measures) return { key:'measure', label:'填措施', cls:'flow', fn:'openMeasureModal' };
  if (!a.reviewedAt) return { key:'review', label:'复核', cls:'flow', fn:'reviewAlert' };
  return { key:'close', label:'关闭', cls:'flow', fn:'closeAlert' };
}
function srcBadge(key){
  var m = SRC_META[key] || { text:key, color:'#8c8c8c', bg:'#fafafa' };
  return '<span class="src-badge" style="color:' + m.color + ';background:' + m.bg + ';border:1px solid ' + m.color + '33;">' + m.text + '</span>';
}
function undoToast(msg, fn){
  var c = document.querySelector('.toast-container');
  if (!c){ c = document.createElement('div'); c.className = 'toast-container';
    c.style.cssText = 'position:fixed;top:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;'; document.body.appendChild(c); }
  var t = document.createElement('div'); t.className = 'jg-toast success';
  t.innerHTML = '<span class="jg-toast-icon">✓</span><span class="jg-toast-message">' + esc(msg) + '</span>';
  var b = document.createElement('button'); b.textContent = '撤销';
  b.style.cssText = 'margin-left:10px;padding:2px 10px;border:1px solid currentColor;border-radius:6px;background:none;color:inherit;cursor:pointer;font-size:12px;flex-shrink:0;';
  b.onclick = function(){ fn(); t.remove(); DeviceUI.toast('已撤销', 'info'); };
  t.appendChild(b); c.appendChild(t);
  setTimeout(function(){ if (t.parentNode){ t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(function(){ t.remove(); }, 300); } }, 6000);
}
function openDrawer(title, html){
  document.getElementById('drawerTitle').textContent = title;
  document.getElementById('drawerBody').innerHTML = html;
  document.getElementById('drawer').classList.add('show');
  document.getElementById('drawerMask').classList.add('show');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('drawerMask').classList.remove('show');
  drawerAlertId = '';
}

/* ---------- 统计卡 ---------- */
function renderStats(){
  var s = FAD.stats();
  var today = todayStr();
  var list = FAD.list();
  var newToday = list.filter(function(a){ return String(a.time).slice(0,10) === today; }).length;
  var escalated = list.filter(function(a){ return a.escalated && a.status !== 'closed'; }).length;
  document.getElementById('statCards').innerHTML =
    '<div class="stat-card" onclick="setStatusTab(\'pending\')"><div class="stat-label">待处理</div><div class="stat-value" style="color:' + (s.pending ? '#fa8c16' : 'inherit') + ';">' + s.pending + '<span class="unit">条</span></div>' +
    '<div class="stat-sub warn">点击筛选待处理预警</div></div>' +
    '<div class="stat-card" onclick="setStatusTab(\'processing\')"><div class="stat-label">处理中</div><div class="stat-value" style="color:#1890ff;">' + s.processing + '<span class="unit">条</span></div>' +
    '<div class="stat-sub">已派工，按五步闭环推进</div></div>' +
    '<div class="stat-card" onclick="setStatusTab(\'closed\')"><div class="stat-label">已闭环</div><div class="stat-value" style="color:#52c41a;">' + s.closed + '<span class="unit">条</span></div>' +
    '<div class="stat-sub">派工→响应→措施→复核→关闭</div></div>' +
    '<div class="stat-card" onclick="toggleEscalatedFilter()"><div class="stat-label">超时已升级</div><div class="stat-value" style="color:' + (escalated ? '#e5484d' : '#52c41a') + ';">' + escalated + '<span class="unit">条</span></div>' +
    '<div class="stat-sub ' + (escalated ? 'err' : '') + '">' + (filterEscalated ? '已筛选升级预警 · 点击取消' : '超时未响应自动升级 · 点击筛选') + '</div></div>' +
    '<div class="stat-card" onclick="resetFilter()"><div class="stat-label">今日新增</div><div class="stat-value">' + newToday + '<span class="unit">条</span></div>' +
    '<div class="stat-sub">' + today + ' 触发</div></div>';
}
function toggleEscalatedFilter(){
  filterEscalated = !filterEscalated;
  curPage = 1; renderStats(); renderTable();
}

/* ---------- 来源 chips ---------- */
function renderChips(){
  var list = FAD.list();
  document.getElementById('sourceChips').innerHTML = FAD.SOURCES.map(function(s){
    var n = list.filter(function(a){ return a.source === s.key; }).length;
    var m = SRC_META[s.key];
    return '<button class="src-chip' + (filterSource === s.key ? ' active' : '') + '" onclick="toggleSource(\'' + s.key + '\')">' +
      '<span class="chip-dot" style="background:' + m.color + ';"></span>' + s.text +
      '<span class="chip-count">' + n + '</span></button>';
  }).join('');
}
function toggleSource(key){
  filterSource = filterSource === key ? '' : key;
  curPage = 1; renderChips(); renderTable();
}
function setStatusTab(status){
  filterStatus = status;
  curPage = 1;
  var tabs = document.querySelectorAll('#statusTabs .status-tab');
  for (var i = 0; i < tabs.length; i++){
    tabs[i].classList.toggle('active', tabs[i].getAttribute('data-status') === status);
  }
  renderTable();
}

/* ---------- 筛选 / 排序 ---------- */
function filteredList(){
  var kw = document.getElementById('searchInput').value.trim().toLowerCase();
  var list = FAD.list().filter(function(a){
    if (filterSource && a.source !== filterSource) return false;
    if (filterStatus && a.status !== filterStatus) return false;
    if (filterLevel && a.level !== filterLevel) return false;
    if (filterEscalated && !(a.escalated && a.status !== 'closed')) return false;
    if (kw){
      var hay = [a.id, a.title, a.desc, a.location, a.levelName, a.assignee].join(' ').toLowerCase();
      if (hay.indexOf(kw) < 0) return false;
    }
    return true;
  });
  list.sort(function(a,b){
    if (sortKey === 'level') return ((LEVEL_ORDER[a.level] != null ? LEVEL_ORDER[a.level] : 9) - (LEVEL_ORDER[b.level] != null ? LEVEL_ORDER[b.level] : 9)) * sortDir;
    return String(a[sortKey] || '').localeCompare(String(b[sortKey] || ''), 'zh-CN') * sortDir;
  });
  return list;
}
function setSort(key){
  if (sortKey === key) sortDir = -sortDir; else { sortKey = key; sortDir = key === 'time' ? -1 : 1; }
  curPage = 1; renderTable();
}
function resetFilter(){
  filterSource = ''; filterLevel = ''; filterEscalated = false;
  document.getElementById('levelSelect').value = '';
  document.getElementById('searchInput').value = '';
  setStatusTab('');
  renderChips(); renderStats();
  DeviceUI.toast('已重置筛选条件', 'info');
}

/* ---------- 表格 ---------- */
function renderTable(){
  var list = filteredList();
  var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (curPage > totalPages) curPage = totalPages;
  var pageData = list.slice((curPage-1)*PAGE_SIZE, curPage*PAGE_SIZE);
  var body = document.getElementById('dataTableBody');
  if (!pageData.length){
    body.innerHTML = '<tr class="empty-row"><td colspan="10">暂无符合条件的预警记录</td></tr>';
  } else {
    body.innerHTML = pageData.map(function(a){
      var act = nextAction(a);
      var flow = act ? '<button class="action-btn ' + act.cls + '" onclick="' + act.fn + '(\'' + esc(a.id) + '\')">' + act.label + '</button>' : '';
      return '<tr class="clickable" onclick="openDetail(\'' + esc(a.id) + '\')">' +
        '<td style="text-align:center;" onclick="event.stopPropagation();"><input type="checkbox" ' + (selected[a.id] ? 'checked' : '') + ' onclick="toggleOne(\'' + esc(a.id) + '\',this)"></td>' +
        '<td><strong>' + esc(a.id) + '</strong>' + (a.escalated && a.status !== 'closed' ? '<div style="margin-top:3px;"><span class="esc-badge">已升级</span></div>' : '') + '</td>' +
        '<td>' + esc(a.title) + '</td>' +
        '<td>' + levelTag(a.level) + '<div style="font-size:11px;color:var(--text-tertiary);margin-top:3px;">SLA ≤' + a.slaMin + 'min</div></td>' +
        '<td>' + srcBadge(a.source) + '</td>' +
        '<td>' + esc(a.location) + '</td>' +
        '<td>' + esc(a.time) + '</td>' +
        '<td>' + slaCell(a) + '</td>' +
        '<td>' + statusTag(a.status) + '</td>' +
        '<td onclick="event.stopPropagation();"><div class="action-btns">' + flow +
          '<button class="action-btn detail" onclick="openDetail(\'' + esc(a.id) + '\')">详情</button>' +
        '</div></td></tr>';
    }).join('');
  }
  ['id','level','time'].forEach(function(k){
    document.getElementById('ar-' + k).textContent = sortKey === k ? (sortDir > 0 ? '▲' : '▼') : '';
  });
  var pg = '<div class="pagination">';
  pg += '<button class="page-btn ' + (curPage <= 1 ? 'disabled' : '') + '" onclick="gotoPage(' + (curPage-1) + ')">‹</button>';
  for (var i = 1; i <= totalPages; i++){
    pg += '<button class="page-btn ' + (i === curPage ? 'active' : '') + '" onclick="gotoPage(' + i + ')">' + i + '</button>';
  }
  pg += '<button class="page-btn ' + (curPage >= totalPages ? 'disabled' : '') + '" onclick="gotoPage(' + (curPage+1) + ')">›</button>';
  pg += '<span style="margin-left:16px;font-size:13px;color:#6b7b6b;">第 ' + curPage + ' 页/共 ' + totalPages + ' 页，共 ' + list.length + ' 条记录</span></div>';
  document.getElementById('pagination-container').innerHTML = pg;
  var all = document.getElementById('checkAll');
  all.checked = pageData.length > 0 && pageData.every(function(x){ return selected[x.id]; });
  renderSelected();
}
function gotoPage(n){
  var totalPages = Math.max(1, Math.ceil(filteredList().length / PAGE_SIZE));
  if (n < 1 || n > totalPages) return;
  curPage = n; renderTable();
}
function toggleOne(id, box){ if (box.checked) selected[id] = true; else delete selected[id]; renderSelected(); }
function toggleAll(box){
  filteredList().slice((curPage-1)*PAGE_SIZE, curPage*PAGE_SIZE).forEach(function(x){
    if (box.checked) selected[x.id] = true; else delete selected[x.id];
  });
  renderTable();
}
function renderSelected(){
  var ids = Object.keys(selected);
  var btn = document.getElementById('bulkCloseBtn');
  btn.disabled = !ids.length;
  btn.textContent = ids.length ? '批量闭环（' + ids.length + '）' : '批量闭环';
  document.getElementById('selectedInfo').innerHTML = ids.length ? '已选 <strong>' + ids.length + '</strong> 条预警' : '';
}

/* ---------- 详情抽屉 ---------- */
function openDetail(id){
  var a = FAD.get(id);
  if (!a) return;
  drawerAlertId = id;
  var m = FAD.LEVEL_META[a.level] || FAD.LEVEL_META.notice;
  var rows = [
    ['预警编号', a.id], ['标题', a.title],
    ['级别', levelTag(a.level), 'raw'], ['来源', srcBadge(a.source), 'raw'],
    ['位置', a.location], ['触发时间', a.time],
    ['响应时效', '≤' + a.slaMin + 'min（' + m.name + '）'],
    ['通知渠道', channelChips(a), 'raw'],
    ['升级规则', a.escalate || '—'],
    ['超时升级', a.escalated ? '<span class="esc-badge">已升级</span> 超时未响应，按规则自动升级' : '未触发', 'raw'],
    ['状态', statusTag(a.status), 'raw'],
    ['响应时效实况', slaCell(a), 'raw']
  ];
  var html = '<div class="drawer-section">预警信息</div><div class="detail-info">' +
    rows.map(function(r){
      return '<div class="detail-row"><span class="detail-label">' + r[0] + '</span><span class="detail-value">' + (r[2] === 'raw' ? r[1] : esc(r[1])) + '</span></div>';
    }).join('') + '</div>';
  html += '<div class="drawer-section">预警描述</div><div style="font-size:13px;color:var(--text-primary);padding:10px 12px;background:var(--gray-50);border-radius:8px;border:1px solid var(--border-light);">' + esc(a.desc || '—') + '</div>';

  var act = nextAction(a);
  var steps = [
    { name:'派工', done: isDispatched(a), sub: isDispatched(a) ? '负责人 ' + a.assignee + (a.dispatchedAt ? ' · ' + a.dispatchedAt : '') : '待选择处理负责人', fn:'openAssignModal', btn:'去派工' },
    { name:'响应', done: !!a.respondedAt, sub: a.respondedAt ? a.respondedAt + (minutesBetween(a.time, a.respondedAt) != null ? ' · 用时 ' + minutesBetween(a.time, a.respondedAt) + 'min' : '') : '待负责人到场确认响应', fn:'respondAlert', btn:'标记响应' },
    { name:'措施', done: !!a.measures, sub: a.measures || '待填写处置措施（必填）', fn:'openMeasureModal', btn:'填写措施' },
    { name:'复核', done: !!a.reviewedAt, sub: a.reviewedAt ? a.reviewedAt + ' · 复核通过' : '待复核处置效果', fn:'reviewAlert', btn:'标记复核' },
    { name:'关闭', done: a.status === 'closed' && !!a.closedAt, sub: a.closedAt ? a.closedAt + ' · 闭环归档' : '待确认关闭', fn:'closeAlert', btn:'确认关闭' }
  ];
  html += '<div class="drawer-section">闭环流程（' + FAD.CLOSURE_STEPS.join(' → ') + '）</div><div class="timeline">';
  html += '<div class="tl-item done"><div class="tl-title">预警触发</div><div class="tl-sub">' + esc(a.time) + ' · ' + esc((SRC_META[a.source] || {}).text || a.source) + '</div></div>';
  steps.forEach(function(st){
    var isNext = act && st.fn === act.fn;
    html += '<div class="tl-item ' + (st.done ? 'done' : 'todo') + '"><div class="tl-title">' + st.name + (st.done ? ' ✓' : '') + '</div>' +
      '<div class="tl-sub">' + esc(st.sub) + '</div>' +
      (isNext && !st.done ? '<div class="tl-btn"><button class="step-btn" onclick="' + st.fn + '(\'' + esc(a.id) + '\')">' + st.btn + '</button></div>' : '') +
      '</div>';
  });
  html += '</div>';
  if (a.source === 'env'){
    html += '<div style="margin-top:16px;"><button class="jg-btn" onclick="closeDrawer();openPage(\'env_monitor.html\',\'设备环境数据\')">查看环境数据</button></div>';
  } else if (a.source === 'device'){
    html += '<div style="margin-top:16px;"><button class="jg-btn" onclick="closeDrawer();openPage(\'device_maintain.html\',\'设备运维工单\')">查看运维工单</button></div>';
  }
  openDrawer('预警详情 · ' + a.id, html);
}

/* ---------- 新增 ---------- */
function nextAlertId(){
  var d = new Date();
  var key = String(d.getFullYear()).slice(2) + pad2(d.getMonth()+1) + pad2(d.getDate());
  var prefix = 'FA-' + key + '-';
  var max = 0;
  FAD.list().forEach(function(a){
    if (a.id.indexOf(prefix) === 0){ var n = parseInt(a.id.slice(prefix.length), 10); if (!isNaN(n)) max = Math.max(max, n); }
  });
  return prefix + pad2(max + 1);
}

  document.getElementById('nLocation').value = '';

}

/* ---------- 闭环五步：派工 → 响应 → 措施 → 复核 → 关闭 ---------- */
function openAssignModal(id){
  assignId = id;
  var a = FAD.get(id);
  document.getElementById('assignTitle').textContent = '派工 · ' + (a ? a.title : id);
  document.getElementById('aOwner').value = '张才孙';
  document.getElementById('assignOverlay').classList.add('show');
  document.getElementById('assignModal').classList.add('show');
}
function closeAssignModal(){
  document.getElementById('assignOverlay').classList.remove('show');
  document.getElementById('assignModal').classList.remove('show');
  assignId = '';
}
function saveAssign(){
  if (!assignId) return;
  var a = FAD.get(assignId);
  if (!a) return;
  if (a.status === 'closed'){ DeviceUI.toast('该预警已闭环，无需派工', 'warning'); closeAssignModal(); return; }
  /* 派工仅指定负责人，保持 pending：契约 enrich 会在 processing 时自动回填 respondedAt，
     故「响应」步骤才推进到 processing，保证五步各自留痕 */
  FAD.update(assignId, { assignee: document.getElementById('aOwner').value, dispatchedAt: nowStr() });
  DeviceUI.toast('预警 ' + assignId + ' 已派工给 ' + document.getElementById('aOwner').value + '，下一步：响应', 'success');
  closeAssignModal(); refreshAll();
}
function respondAlert(id){
  var a = FAD.get(id);
  if (!a) return;
  if (!isDispatched(a)){ DeviceUI.toast('请先完成「派工」，再标记响应', 'error'); return; }
  if (a.respondedAt){ DeviceUI.toast('该预警已记录响应时间', 'info'); return; }
  Modal.confirm('确认负责人已到场响应预警 ' + id + '？将记录响应时间并停止 SLA 倒计时。', {
    title: '响应确认', confirmText: '确认响应'
  }).then(function(ok){
    if (!ok) return;
    FAD.update(id, { respondedAt: nowStr(), status: 'processing' });
    var used = minutesBetween(a.time, null);
    DeviceUI.toast('已记录响应' + (used != null ? '，用时 ' + used + 'min' + (used > a.slaMin ? '（超出 SLA ' + a.slaMin + 'min）' : '') : '') + '，下一步：填写措施', 'success');
    refreshAll();
  });
}
function openMeasureModal(id){
  var a = FAD.get(id);
  if (!a) return;
  if (!isDispatched(a)){ DeviceUI.toast('请先完成「派工」', 'error'); return; }
  if (!a.respondedAt){ DeviceUI.toast('请先完成「响应」，再填写处置措施', 'error'); return; }
  closeId = id;
  document.getElementById('closeTitle').textContent = '填写处置措施 · ' + a.title;
  document.getElementById('cMeasure').value = a.measures || '';
  document.getElementById('closeOverlay').classList.add('show');
  document.getElementById('closeModal').classList.add('show');
}
function closeCloseModal(){
  document.getElementById('closeOverlay').classList.remove('show');
  document.getElementById('closeModal').classList.remove('show');
  closeId = '';
}
function saveMeasures(){
  if (!closeId) return;
  var measure = document.getElementById('cMeasure').value.trim();
  if (!measure){ DeviceUI.toast('请填写处置措施（必填）', 'error'); return; }
  FAD.update(closeId, { measures: measure });
  DeviceUI.toast('处置措施已保存，下一步：复核', 'success');
  closeCloseModal(); refreshAll();
}
function reviewAlert(id){
  var a = FAD.get(id);
  if (!a) return;
  if (!a.measures){ DeviceUI.toast('请先填写「处置措施」，再复核', 'error'); return; }
  if (a.reviewedAt){ DeviceUI.toast('该预警已完成复核', 'info'); return; }
  Modal.confirm('确认处置措施已复核通过？\n措施：' + a.measures, {
    title: '复核确认 · ' + id, confirmText: '复核通过'
  }).then(function(ok){
    if (!ok) return;
    FAD.update(id, { reviewedAt: nowStr() });
    DeviceUI.toast('复核通过，下一步：关闭归档', 'success');
    refreshAll();
  });
}
function closeAlert(id){
  var a = FAD.get(id);
  if (!a) return;
  if (!a.reviewedAt){ DeviceUI.toast('请先完成「复核」，才能关闭预警', 'error'); return; }
  if (a.status === 'closed'){ DeviceUI.toast('该预警已闭环', 'info'); return; }
  Modal.confirm('确认关闭预警 ' + id + ' 并归档？关闭后流程结束。', {
    title: '关闭确认', confirmText: '确认关闭'
  }).then(function(ok){
    if (!ok) return;
    FAD.update(id, { status: 'closed', closedAt: nowStr() });
    DeviceUI.toast('预警 ' + id + ' 已闭环归档', 'success');
    refreshAll();
  });
}

/* ---------- 批量闭环（仅复核通过者可关闭，带撤销） ---------- */
function bulkClose(){
  var ids = Object.keys(selected).filter(function(id){
    var a = FAD.get(id);
    return a && a.status !== 'closed';
  });
  if (!ids.length){ DeviceUI.toast('所选预警均已闭环', 'info'); return; }
  var ready = ids.filter(function(id){ return FAD.get(id).reviewedAt; });
  var blocked = ids.length - ready.length;
  if (!ready.length){
    DeviceUI.toast('所选 ' + ids.length + ' 条预警均未完成复核，已阻断关闭：请先完成 派工→响应→措施→复核', 'error');
    return;
  }
  Modal.confirm('选中 ' + ids.length + ' 条未闭环预警，其中 ' + ready.length + ' 条已复核通过可关闭' +
    (blocked ? '，' + blocked + ' 条未完成复核将被跳过' : '') + '。关闭后可在提示中撤销。', {
    title: '批量闭环', confirmText: '关闭 ' + ready.length + ' 条'
  }).then(function(ok){
    if (!ok) return;
    var snapshot = ready.map(function(id){
      var a = FAD.get(id);
      return { id: id, status: a.status, closedAt: a.closedAt };
    });
    ready.forEach(function(id){
      FAD.update(id, { status: 'closed', closedAt: nowStr() });
    });
    selected = {};
    refreshAll();
    if (blocked) DeviceUI.toast(blocked + ' 条未完成复核的预警已跳过（阻断规则生效）', 'warning');
    undoToast('已批量闭环 ' + ready.length + ' 条预警', function(){
      snapshot.forEach(function(s){
        FAD.update(s.id, { status: s.status, closedAt: s.closedAt });
      });
      refreshAll();
    });
  });
}

/* ---------- 导出 ---------- */
function exportAlerts(){
  var headers = ['预警编号','标题','级别','响应时效(min)','通知渠道','来源','位置','时间','状态','超时升级','负责人','派工时间','响应时间','处置措施','复核时间','关闭时间','描述'];
  var rows = filteredList().map(function(a){
    return [a.id, a.title, a.levelName || a.level, a.slaMin, (a.channels || []).join('、'),
      (SRC_META[a.source] || {}).text || a.source, a.location, a.time, FAD.STATUS_TEXT[a.status] || a.status,
      a.escalated ? '是' : '否', a.assignee || '', a.dispatchedAt || '', a.respondedAt || '', a.measures || '',
      a.reviewedAt || '', a.closedAt || '', a.desc || ''];
  });
  DeviceUI.exportCsv('预警记录', headers, rows);
}

/* ---------- SLA 倒计时 / 超时自动升级 ---------- */
function slaTick(){
  var nodes = document.querySelectorAll('[data-sla-id]');
  for (var i = 0; i < nodes.length; i++){
    var a = FAD.get(nodes[i].getAttribute('data-sla-id'));
    if (a) nodes[i].innerHTML = slaCellHtml(a);
  }
  var overdue = FAD.list().filter(function(a){
    if (a.status !== 'pending' || a.respondedAt || a.escalated) return false;
    var dl = slaDeadline(a);
    return dl != null && Date.now() > dl;
  });
  if (overdue.length){
    overdue.forEach(function(a){ FAD.update(a.id, { escalated: true }); });
    DeviceUI.toast(overdue.length + ' 条预警超时未响应，已自动升级：' + overdue.map(function(a){ return a.id; }).join('、'), 'warning');
    refreshAll();
  }
}

/* ---------- 刷新 / 初始化 ---------- */
function refreshAll(){
  renderStats(); renderChips(); renderTable();
  if (drawerAlertId && document.getElementById('drawer').classList.contains('show')){
    var keepId = drawerAlertId;
    if (FAD.get(keepId)) openDetail(keepId); else closeDrawer();
  }
}
document.addEventListener('DOMContentLoaded', function(){
  /* 应用预警设置页保存的四色时效覆盖层（契约文件只读，覆盖层存 localStorage） */
  try {
    var ov = JSON.parse(localStorage.getItem('mushroom_alert_matrix_v1') || 'null');
    if (ov && ov.sla){
      Object.keys(ov.sla).forEach(function(k){
        if (FAD.LEVEL_META[k] && ov.sla[k] != null) FAD.LEVEL_META[k].slaMin = ov.sla[k];
      });
      FAD.list().forEach(function(a){
        var m = FAD.LEVEL_META[a.level];
        if (m) a.slaMin = m.slaMin;
      });
    }
  } catch(e){}
  DeviceUI.fillSelect('nSource', FAD.SOURCES.map(function(s){ return { value: s.key, label: s.text }; }), null);
  DeviceUI.fillSelect('aOwner', DeviceUI.operators(), null);
  var params = new URLSearchParams(location.search);
  var src = params.get('source');
  if (src && SRC_META[src]) filterSource = src;
  refreshAll();
  slaTick();
  setInterval(slaTick, 1000);
  document.getElementById('searchInput').addEventListener('input', function(){ curPage = 1; renderTable(); });
  document.getElementById('levelSelect').addEventListener('change', function(){ filterLevel = this.value; curPage = 1; renderTable(); });
  window.addEventListener('fungiAlertChange', function(){ renderStats(); renderChips(); renderTable(); });
});
</script>
