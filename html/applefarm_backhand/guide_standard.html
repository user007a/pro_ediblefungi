<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工厂化农业数据管理系统 - 工艺标准</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%2352c41a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .page-head{margin-bottom:16px;}
  .page-head h1{font-size:18px;font-weight:700;margin:0;color:var(--text-primary);}
  .page-head .crumb{font-size:12px;color:var(--text-tertiary);margin-top:4px;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;}
  .stat-card{background:var(--bg-card,#fff);border:1px solid var(--border-color,#e8ece8);border-radius:12px;padding:16px 18px;border-left:4px solid #1890ff;}
  .stat-card.green{border-left-color:#52c41a;}
  .stat-card.orange{border-left-color:#fa8c16;}
  .stat-card.purple{border-left-color:#722ed1;}
  .stat-label{font-size:12px;color:var(--text-tertiary);margin-bottom:6px;}
  .stat-value{font-size:22px;font-weight:600;line-height:1.2;}
  .stat-value small{font-size:12px;font-weight:400;color:var(--text-tertiary);margin-left:4px;}
  .stat-sub{margin-top:6px;font-size:12px;color:var(--text-tertiary);}
  @media(max-width:1100px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
  th.sortable:hover{color:#1890ff;}
  .sort-arrow{font-size:10px;margin-left:3px;color:#1890ff;}
  .empty-cell{text-align:center;color:var(--text-tertiary);padding:32px 0!important;}
  .row-btn{padding:3px 10px;font-size:12px;border-radius:6px;border:1px solid var(--border-default,#d9d9d9);background:#fff;color:var(--text-secondary,#555);cursor:pointer;margin-right:6px;white-space:nowrap;}
  .row-btn:hover{border-color:#1890ff;color:#1890ff;}
  .row-btn.danger{color:#ff4d4f;border-color:#ffccc7;}
  .row-btn.danger:hover{background:#fff2f0;}
  .row-btn.primary{color:#1890ff;border-color:#91d5ff;}
  .drawer-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9998;}
  .drawer-mask.show{display:block;}
  .drawer{position:fixed;top:0;right:-580px;width:560px;max-width:94vw;height:100vh;background:#fff;z-index:9999;box-shadow:-8px 0 32px rgba(0,0,0,.15);transition:right .25s ease;display:flex;flex-direction:column;}
  .drawer.open{right:0;}
  .drawer-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid #eef1ef;flex:none;}
  .drawer-header h3{margin:0;font-size:16px;font-weight:600;color:var(--text-primary);}
  .drawer-close{width:28px;height:28px;border:none;background:none;font-size:18px;cursor:pointer;color:#8c8c8c;border-radius:6px;}
  .drawer-close:hover{background:#f5f5f5;color:#333;}
  .drawer-body{padding:20px 24px;overflow-y:auto;flex:1;}
  .detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 20px;margin-bottom:16px;}
  .detail-item.full{grid-column:1/-1;}
  .detail-item .dl{font-size:12px;color:var(--text-tertiary);margin-bottom:2px;}
  .detail-item .dv{font-size:14px;color:var(--text-primary);font-weight:500;word-break:break-all;}
  .drawer-sec{font-size:13px;font-weight:600;color:var(--text-primary);margin:18px 0 10px;padding-left:8px;border-left:3px solid #1890ff;}
  .key-box{background:#f7f9f7;border:1px solid #e8ede8;border-radius:8px;padding:14px 16px;font-size:13px;line-height:1.8;color:var(--text-primary);}
  .ver-list{list-style:none;margin:0;padding:0;}
  .ver-list li{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed #eef1ef;font-size:13px;}
  .ver-list li:last-child{border-bottom:none;}
  .ver-tag{flex:none;width:56px;font-weight:600;color:#1890ff;}
  .ver-date{flex:none;width:96px;color:var(--text-tertiary);}
  .modal-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.45);align-items:center;justify-content:center;}
  .modal-overlay.show{display:flex;}
  .modal-box{width:560px;max-width:92vw;max-height:86vh;background:#fff;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid #eef1ef;flex:none;}
  .modal-header h3{font-size:16px;font-weight:600;margin:0;}
  .modal-close{width:28px;height:28px;border:none;background:none;font-size:18px;cursor:pointer;color:#8c8c8c;border-radius:6px;}
  .modal-body{padding:20px 24px;overflow-y:auto;}
  .form-group{margin-bottom:14px;}
  .form-group.full{grid-column:1/-1;}
  .form-group label{display:block;font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:6px;}
  .form-group label .req{color:#ff4d4f;margin-left:2px;}
  #modal .modal-body input,#modal .modal-body select,#modal .modal-body textarea{width:100%;padding:9px 12px;border:1.5px solid #d9d9d9;border-radius:8px;font-size:13px!important;background:#fff;outline:none;font-family:inherit;box-sizing:border-box;}
  #modal .modal-body textarea{min-height:72px;resize:vertical;line-height:1.6;}
  #modal .modal-body input:focus,#modal .modal-body select:focus,#modal .modal-body textarea:focus{border-color:#1890ff;box-shadow:0 0 0 3px rgba(24,144,255,.1);}
  .modal-footer{display:flex;justify-content:flex-end;gap:12px;padding:14px 24px;border-top:1px solid #eef1ef;flex:none;}
  .toast-undo{display:none;padding:3px 12px;border-radius:6px;border:1px solid currentColor;background:rgba(255,255,255,.6);font-size:12px;font-weight:600;cursor:pointer;color:inherit;}
  .tabs{margin-bottom:16px;}
  .range-inputs{display:flex;align-items:center;gap:8px;}
  .range-inputs input{flex:1;}
  .range-inputs span{color:var(--text-tertiary);flex:none;}
  .room-checks{display:flex;flex-wrap:wrap;gap:8px;}
  .room-checks label{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid #e8ede8;border-radius:20px;font-size:13px;cursor:pointer;background:#f7f9f7;margin:0;font-weight:400;}
  .room-checks label.checked{background:#e6f7ff;border-color:#91d5ff;color:#096dd9;}
  .room-checks input{width:auto!important;}
  .hint-bar{background:#f0f5ff;border:1px solid #d6e4ff;border-radius:8px;padding:10px 14px;font-size:12px;color:#2f54eb;line-height:1.7;margin-bottom:14px;}
  .mini-table{width:100%;border-collapse:collapse;font-size:12px;}
  .mini-table th{background:#f7f9f7;color:var(--text-tertiary);font-weight:600;padding:7px 8px;text-align:left;border-bottom:1px solid #e8ede8;white-space:nowrap;}
  .mini-table td{padding:7px 8px;border-bottom:1px solid #f4f6f4;}
</style>
<style id="standalone-fix">.main-wrapper{margin-left:0!important;width:100%!important;}</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="guide" data-active-submenu="guide-standard">

<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar"><div class="tab-bar-actions"><button class="tab-close-all" title="关闭全部标签"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3L11 11M11 3L3 11"/></svg></button></div></div>
    <main class="main-content"><div class="content-wrapper">

      <div class="page-head">
        <h1>工艺标准</h1>
        <div class="crumb">企业管理 / 工艺标准 · 工艺 SOP · 配方模板 · 接种等级 · 生长曲线 · 参数覆盖（就近生效）</div>
      </div>

      <div class="stat-grid" id="statGrid"></div>

      <div class="tabs" id="mainTabs">
        <div class="tab-item active" data-tab="sops" onclick="switchTab('sops')">工艺SOP</div>
        <div class="tab-item" data-tab="recipes" onclick="switchTab('recipes')">配方模板</div>
        <div class="tab-item" data-tab="grades" onclick="switchTab('grades')">接种等级</div>
        <div class="tab-item" data-tab="curves" onclick="switchTab('curves')">生长曲线</div>
        <div class="tab-item" data-tab="overrides" onclick="switchTab('overrides')">参数覆盖</div>
      </div>

      <div class="page-section search-section">
        <div class="search-bar">
          <select class="search-select" id="filterSelect" onchange="renderTable()"></select>
          <input type="text" class="search-input" id="searchInput" placeholder="搜索编号、名称、关键参数..." oninput="renderTable()">
          <div class="search-actions">
            <button class="jg-btn" onclick="resetFilters()">重置</button>
          </div>
        </div>
      </div>

      <div class="page-section action-bar">
        <div class="action-left">
          <button class="jg-btn jg-btn-primary" id="newBtn" onclick="openForm()">+ 新建标准</button>
          <button class="jg-btn" id="exportBtn" onclick="exportCurrent()">导出CSV</button>
          <button class="jg-btn" id="batchDelBtn" onclick="batchDelete(FS_COL[currentTab],TAB_LABEL[currentTab])">批量删除</button>
          <span class="selected-info" id="selInfo"></span>
        </div>
      </div>

      <div class="page-section data-section">
        <div class="data-table-wrapper">
          <table class="data-table">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>

    </div></main>
  </div>
</div>

<div class="drawer-mask" id="drawerMask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header"><h3 id="drawerTitle">详情</h3><button class="drawer-close" id="drawerClose" onclick="closeDrawer()">×</button></div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-header"><h3 id="modalTitle">编辑</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer"><button class="jg-btn" onclick="closeModal()">取消</button><button class="jg-btn jg-btn-primary" id="modalSave" onclick="saveModal()">保存</button></div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal" onclick="if(event.target===this)closeConfirm()">
  <div class="modal-box" style="width:420px;">
    <div class="modal-header"><h3>操作确认</h3><button class="modal-close" onclick="closeConfirm()">×</button></div>
    <div class="modal-body"><p id="confirmText" style="margin:0;font-size:14px;color:var(--text-primary);"></p></div>
    <div class="modal-footer"><button class="jg-btn" onclick="closeConfirm()">取消</button><button class="jg-btn jg-btn-primary" id="confirmOk" onclick="doConfirm()">确认</button></div>
  </div>
</div>

<div class="toast" id="toast"><span class="toast-message" id="toastMessage"></span><button class="toast-undo" id="toastUndo">撤销</button></div>

<script src="js/shared/fungi-store.js"></script>
<script>
var FS = window.FungiStore;
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function today(){return FS.dayKey(0);}
function nav(url,title){try{if(window.parent&&window.parent!==window&&typeof window.parent.openPage==='function'){window.parent.openPage(url,title);return;}}catch(e){}location.href=url;}
var toastTimer=null;
function showToast(msg,type,undoFn){var t=document.getElementById('toast');document.getElementById('toastMessage').textContent=msg;t.className='toast toast-'+(type||'success')+' show';var ub=document.getElementById('toastUndo');if(undoFn){ub.style.display='inline-block';ub.onclick=function(){hideToast();undoFn();};}else{ub.style.display='none';ub.onclick=null;}clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,undoFn?6000:2600);}
function hideToast(){document.getElementById('toast').classList.remove('show');}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');}
var confirmCb=null;
function askConfirm(msg,cb){document.getElementById('confirmText').textContent=msg;confirmCb=cb;document.getElementById('confirmModal').classList.add('show');}
function doConfirm(){var cb=confirmCb;closeConfirm();if(cb)cb();}
function closeConfirm(){confirmCb=null;document.getElementById('confirmModal').classList.remove('show');}
function openDrawer(title,html){document.getElementById('drawerTitle').textContent=title;document.getElementById('drawerBody').innerHTML=html;document.getElementById('drawer').classList.add('open');document.getElementById('drawerMask').classList.add('show');}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawerMask').classList.remove('show');}
function rowClick(e,id){if(e.target.closest('button,input,select,a,label'))return;openDetail(id);}
function val(id){var el=document.getElementById(id);return el?el.value.trim():'';}
function reqOK(){var ok=true;document.querySelectorAll('#modalBody [data-req]').forEach(function(el){if(!String(el.value).trim()){el.style.borderColor='#ff4d4f';ok=false;}else{el.style.borderColor='';}});if(!ok)showToast('请填写完整必填项（红框）','error');return ok;}
function fg(label,html,req,full){return '<div class="form-group'+(full?' full':'')+'"><label>'+label+(req?'<span class="req">*</span>':'')+'</label>'+html+'</div>';}
function inp(id,v,type,req){return '<input id="'+id+'" type="'+(type||'text')+'" value="'+esc(v==null?'':v)+'"'+(req?' data-req="1"':'')+'>';}
function sel(id,opts,v,req){return '<select id="'+id+'"'+(req?' data-req="1"':'')+'>'+opts.map(function(o){return '<option value="'+esc(o)+'"'+(String(o)===String(v)?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';}
var selected={};
function toggleAll(cb){document.querySelectorAll('#tableBody .row-check').forEach(function(c){c.checked=cb.checked;selected[c.dataset.id]=cb.checked;});updateSelInfo();}
function toggleRow(cb){selected[cb.dataset.id]=cb.checked;updateSelInfo();}
function updateSelInfo(){var n=Object.keys(selected).filter(function(k){return selected[k];}).length;var el=document.getElementById('selInfo');if(el)el.textContent=n?('已选 '+n+' 条'):'';var all=document.getElementById('selectAll');if(all){var boxes=document.querySelectorAll('#tableBody .row-check');all.checked=boxes.length>0&&n===boxes.length;}}
function removeRow(col,id,label){var idx=FS.list(col).findIndex(function(x){return x.id===id;});askConfirm('确认删除「'+label+'」？删除后可撤销。',function(){var gone=FS.remove(col,id);delete selected[id];renderAll();showToast('已删除「'+label+'」','success',function(){FS.restore(col,gone,idx);renderAll();showToast('已撤销删除','success');});});}
function batchDelete(col,label){var ids=Object.keys(selected).filter(function(k){return selected[k];});if(!ids.length){showToast('请先勾选要删除的记录','warning');return;}askConfirm('确认删除选中的 '+ids.length+' 条'+label+'？删除后可撤销。',function(){var list=FS.list(col);var removed=ids.map(function(id){return {obj:FS.get(col,id),idx:list.findIndex(function(x){return x.id===id;})};}).filter(function(r){return r.obj;}).sort(function(a,b){return a.idx-b.idx;});ids.forEach(function(id){FS.remove(col,id);});selected={};renderAll();showToast('已删除 '+removed.length+' 条'+label,'success',function(){removed.forEach(function(r){FS.restore(col,r.obj,r.idx);});renderAll();showToast('已撤销批量删除','success');});});}
function exportCSV(name,headers,rows){if(!rows.length){showToast('当前视图暂无可导出数据','warning');return;}var csv='﻿'+[headers].concat(rows).map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'_'+today()+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);showToast('导出成功，文件已下载','success');}
var sortKey='',sortDir=1;
function sortBy(k){if(sortKey===k){sortDir=-sortDir;}else{sortKey=k;sortDir=1;}renderTable();}
function applySort(rows){if(!sortKey)return rows;return rows.slice().sort(function(a,b){var x=a[sortKey],y=b[sortKey];if(typeof x==='number'&&typeof y==='number')return (x-y)*sortDir;return String(x==null?'':x).localeCompare(String(y==null?'':y),'zh')*sortDir;});}
function paintArrows(){document.querySelectorAll('th.sortable').forEach(function(th){var a=th.querySelector('.sort-arrow');if(a)a.textContent=th.dataset.key===sortKey?(sortDir>0?'▲':'▼'):'';});}
function resetFilters(){document.getElementById('searchInput').value='';document.getElementById('filterSelect').value='';renderAll();}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();closeConfirm();closeDrawer();}});

/* ===== 工艺标准 · 五 tab：SOP / 配方模板 / 接种等级 / 生长曲线 / 参数覆盖 ===== */
var currentTab='sops';
var TAB_LABEL={sops:'标准',recipes:'配方模板',grades:'接种等级',curves:'生长曲线',overrides:'参数覆盖'};
var FS_COL={sops:'sops',recipes:'recipeTemplates',grades:'inocGrades',curves:'curveTemplates',overrides:'paramOverrides'};
var PARAMS=[['temp','温度(°C)'],['hum','湿度(%)'],['co2','CO₂(ppm)'],['light','光照(lx)'],['wind','风速(m/s)'],['negPressure','负压(Pa)']];
var METRICS={'CO₂ 上限':'ppm','CO₂ 下限':'ppm','温度下限':'°C','温度上限':'°C','RH 下限':'%','RH 上限':'%','光照上限':'lx'};
var modalMode='form',distributingId='';
function bumpVer(v){var m=/^v(\d+)\.(\d+)$/.exec(String(v||'v1.0'));if(!m)return 'v1.1';return 'v'+m[1]+'.'+(Number(m[2])+1);}
function pad2(n){return (n<10?'0':'')+n;}
function varietyOpts(){var dic=FS.get('dictionaries','DIC-VAR');var items=dic?dic.items.slice():['平菇','杏鲍菇','金针菇','香菇'];if(items.indexOf('全品种')<0)items.unshift('全品种');return items;}
function roomOpts(){return FS.list('rooms').map(function(r){return r.id;}).concat(['PY-01']);}
function switchTab(tab){
  currentTab=tab;selected={};sortKey='';sortDir=1;
  document.querySelectorAll('#mainTabs .tab-item').forEach(function(el){el.classList.toggle('active',el.dataset.tab===tab);});
  var f=document.getElementById('filterSelect');
  if(tab==='sops'||tab==='recipes'){
    f.style.display='';f.innerHTML='<option value="">全部状态</option><option value="启用">启用</option><option value="停用">停用</option>';
  }else if(tab==='grades'){
    f.style.display='none';f.innerHTML='';
  }else if(tab==='curves'){
    f.style.display='';f.innerHTML='<option value="">全部品种</option>'+varietyOpts().filter(function(v){return v!=='全品种';}).map(function(v){return '<option value="'+esc(v)+'">'+esc(v)+'</option>';}).join('');
  }else{
    f.style.display='';f.innerHTML='<option value="">全部级别</option><option value="全局">全局</option><option value="菇房">菇房</option><option value="批次">批次</option>';
  }
  f.value='';
  document.getElementById('searchInput').value='';
  document.getElementById('newBtn').textContent={sops:'+ 新建标准',recipes:'+ 新建配方模板',grades:'+ 新建等级',curves:'+ 新建曲线',overrides:'+ 新建覆盖'}[tab];
  renderAll();
}
function currentRows(){
  var kw=document.getElementById('searchInput').value.trim().toLowerCase();
  var fv=document.getElementById('filterSelect').value;
  if(currentTab==='sops'){
    return FS.list('sops').filter(function(s){
      if(fv&&s.status!==fv)return false;
      if(kw&&(s.id+' '+s.name+' '+s.key+' '+s.scope).toLowerCase().indexOf(kw)===-1)return false;
      return true;
    });
  }
  if(currentTab==='recipes'){
    return FS.list('recipeTemplates').filter(function(t){
      if(fv&&t.status!==fv)return false;
      if(kw&&(t.id+' '+t.name+' '+t.variety+' '+t.author).toLowerCase().indexOf(kw)===-1)return false;
      return true;
    });
  }
  if(currentTab==='grades'){
    return FS.list('inocGrades').filter(function(g){
      if(kw&&(g.id+' '+g.name+' '+g.clean+' '+g.settle+' '+g.desc).toLowerCase().indexOf(kw)===-1)return false;
      return true;
    });
  }
  if(currentTab==='curves'){
    return FS.list('curveTemplates').filter(function(c){
      if(fv&&c.variety!==fv)return false;
      if(kw&&(c.id+' '+c.variety+' '+c.condition+' '+c.turnStd+' '+c.author).toLowerCase().indexOf(kw)===-1)return false;
      return true;
    });
  }
  return FS.list('paramOverrides').filter(function(o){
    if(fv&&o.level!==fv)return false;
    if(kw&&(o.id+' '+o.scope+' '+o.metric+' '+o.source+' '+o.operator).toLowerCase().indexOf(kw)===-1)return false;
    return true;
  });
}
function renderStats(){
  var ss=FS.list('sops'),ts=FS.list('recipeTemplates'),cs=FS.list('curveTemplates'),os=FS.list('paramOverrides');
  var on=ss.filter(function(s){return s.status==='启用';}).length;
  var roomHits=ts.reduce(function(s,t){return s+(t.rooms||[]).length;},0);
  var lv={全局:0,菇房:0,批次:0};
  os.forEach(function(o){lv[o.level]=(lv[o.level]||0)+1;});
  var cards=[

/* 版本历史：store 未存历史版本，按当前版本号与生效日期在页内推导 */
function versionHistory(s){
  var m=String(s.version).match(/v(\d+)\.(\d+)/);
  var out=[{ver:s.version,date:String(s.effective).slice(0,10),note:'现行版本'}];
  if(m){
    var major=+m[1],minor=+m[2];
    var base=new Date(String(s.effective).slice(0,10)+'T00:00:00').getTime();
    var step=1;
    for(var mi=minor-1;mi>=0&&step<=3;mi--,step++){
      out.push({ver:'v'+major+'.'+mi,date:fmtDate(base-step*120*86400000),note:'历史版本'});
    }
    if(step<=3&&major>1)out.push({ver:'v'+(major-1)+'.0',date:fmtDate(base-step*120*86400000),note:'历史版本'});
  }
  return out;
}
function fmtDate(t){var d=new Date(t);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}

function saveModal(){

    if(editingId){FS.update('sops',editingId,patch);showToast('工艺标准已更新','success');}
    else{FS.add('sops',patch);showToast('工艺标准已创建','success');}
  }else if(currentTab==='recipes'){
    var tid=val('f_id');
    if(!editingId&&FS.get('recipeTemplates',tid)){showToast('模板编号 '+tid+' 已存在','error');return;}
    if(!/^v\d+\.\d+$/.test(val('f_version'))){showToast('版本号格式应为 v主.次，如 v4.1','error');return;}
    var patch2={name:val('f_name'),variety:val('f_variety'),version:val('f_version'),effective:val('f_effective')+' 00:00',author:val('f_author'),status:val('f_status')};
    for(var i=0;i<PARAMS.length;i++){
      var k=PARAMS[i][0],lo=Number(val('f_'+k+'_lo')),hi=Number(val('f_'+k+'_hi'));
      if(isNaN(lo)||isNaN(hi)){showToast(PARAMS[i][1]+' 必须为数字','error');return;}

      patch2[k]=[lo,hi];
    }
    if(editingId){
      var old=FS.get('recipeTemplates',editingId);
      if(old&&patch2.version===old.version)patch2.version=bumpVer(old.version);
      patch2.rooms=old?old.rooms:[];
      FS.update('recipeTemplates',editingId,patch2);
      showToast('配方模板已更新，版本 '+patch2.version,'success');
    }else{patch2.id=tid;patch2.rooms=[];FS.add('recipeTemplates',patch2);showToast('配方模板已创建','success');}

    var patch5={level:lv2,scope:val('f_scope'),metric:val('f_metric'),value:vv,unit:METRICS[val('f_metric')]||'',source:lv2==='全局'?'配方模板':(lv2==='菇房'?'菇房覆盖':'批次覆盖'),operator:val('f_operator'),time:FS.nowStamp()};
    if(editingId){FS.update('paramOverrides',editingId,patch5);showToast('参数覆盖已更新（就近生效）','success');}
    else{patch5.id=oid;FS.add('paramOverrides',patch5);showToast('参数覆盖已创建（就近生效）','success');}
  }
  closeModal();renderAll();
}
function distributeTpl(id){
  var t=FS.get('recipeTemplates',id);if(!t)return;
  distributingId=id;modalMode='distribute';
  var rooms=roomOpts();
  var checks=rooms.map(function(r){
    var on=(t.rooms||[]).indexOf(r)>=0;
    var info=r==='PY-01'?'培养室':(FS.get('rooms',r)||{}).status||'';
    return '<label class="'+(on?'checked':'')+'"><input type="checkbox" class="room-check" value="'+esc(r)+'"'+(on?' checked':'')+' onchange="this.parentNode.classList.toggle(\'checked\',this.checked)">'+esc(r)+(info?' · '+esc(info):'')+'</label>';
  }).join('');
  openModal('下发到菇房 · '+t.name,
    '<div class="hint-bar">当前版本 '+esc(t.version)+' · 生效 '+esc(String(t.effective).slice(0,10))+'。下发后版本号自动递增，生效日期更新为今天，所选菇房环境参数以本模板为准（菇房/批次覆盖仍就近优先）。</div>'+
    '<div class="room-checks">'+checks+'</div>'
  );
}
function doDistribute(){
  var t=FS.get('recipeTemplates',distributingId);if(!t){closeModal();return;}
  var selRooms=[];
  document.querySelectorAll('#modalBody .room-check').forEach(function(c){if(c.checked)selRooms.push(c.value);});
  if(!selRooms.length){showToast('请至少选择一间菇房','warning');return;}
  var nv=bumpVer(t.version);
  FS.update('recipeTemplates',distributingId,{rooms:selRooms,version:nv,effective:today()+' 00:00'});
  closeModal();modalMode='form';renderAll();
  showToast('「'+t.name+'」已下发至 '+selRooms.length+' 间菇房（'+selRooms.join('、')+'），版本升至 '+nv,'success');
}
function openDetail(id){
  if(currentTab==='sops'){
    var s=FS.get('sops',id);if(!s)return;
    var hist=versionHistory(s);
    openDrawer('工艺标准 · '+s.name,
      '<div class="detail-grid">'+
      '<div class="detail-item"><div class="dl">编号</div><div class="dv">'+esc(s.id)+'</div></div>'+
      '<div class="detail-item"><div class="dl">版本</div><div class="dv">'+esc(s.version)+'</div></div>'+
      '<div class="detail-item"><div class="dl">适用范围</div><div class="dv">'+esc(s.scope)+'</div></div>'+
      '<div class="detail-item"><div class="dl">生效日期</div><div class="dv">'+esc(String(s.effective).slice(0,10))+'</div></div>'+
      '<div class="detail-item"><div class="dl">状态</div><div class="dv"><span class="status-tag '+(s.status==='启用'?'normal':'inactive')+'">'+esc(s.status)+'</span></div></div>'+
      '</div>'+
      '<div class="drawer-sec">关键参数全文</div>'+
      '<div class="key-box">'+esc(s.key)+'</div>'+
      '<div class="drawer-sec">版本历史</div>'+
      '<ul class="ver-list">'+hist.map(function(h){
        return '<li><span class="ver-tag">'+esc(h.ver)+'</span><span class="ver-date">'+esc(h.date)+'</span><span>'+esc(h.note)+'</span></li>';
      }).join('')+'</ul>'+
      '<p style="font-size:11px;color:var(--text-tertiary);margin-top:10px;">版本历史由当前版本号与生效日期推导，供演示参考。</p>'
    );
  }else if(currentTab==='recipes'){
    var t=FS.get('recipeTemplates',id);if(!t)return;
    var globalOv=FS.list('paramOverrides').filter(function(o){return o.source==='配方模板'&&o.scope===id;});
    openDrawer('配方模板 · '+t.name,
      '<div class="detail-grid">'+
      '<div class="detail-item"><div class="dl">编号</div><div class="dv">'+esc(t.id)+'</div></div>'+
      '<div class="detail-item"><div class="dl">品种</div><div class="dv">'+esc(t.variety)+'</div></div>'+
      '<div class="detail-item"><div class="dl">版本</div><div class="dv">'+esc(t.version)+'</div></div>'+
      '<div class="detail-item"><div class="dl">生效日期</div><div class="dv">'+esc(String(t.effective).slice(0,10))+'</div></div>'+
      '<div class="detail-item"><div class="dl">作者</div><div class="dv">'+esc(t.author)+'</div></div>'+
      '<div class="detail-item"><div class="dl">状态</div><div class="dv"><span class="status-tag '+(t.status==='启用'?'normal':'inactive')+'">'+esc(t.status)+'</span></div></div>'+
      '</div>'+
      '<div class="drawer-sec">结构化环境参数</div>'+
      '<table class="mini-table"><thead><tr><th>参数</th><th>下限</th><th>上限</th></tr></thead><tbody>'+
      PARAMS.map(function(p){return '<tr><td>'+p[1]+'</td><td>'+t[p[0]][0]+'</td><td>'+t[p[0]][1]+'</td></tr>';}).join('')+
      '</tbody></table>'+
      '<div class="drawer-sec">已下发菇房（'+(t.rooms||[]).length+'）</div>'+
      ((t.rooms||[]).length?'<div class="room-checks">'+t.rooms.map(function(r){return '<label class="checked" style="cursor:default;">'+esc(r)+'</label>';}).join('')+'</div>':'<p style="font-size:12px;color:var(--text-tertiary);">尚未下发，点击「下发到菇房」选择目标菇房。</p>')+
      '<div class="drawer-sec">全局参数来源</div>'+
      (globalOv.length?'<table class="mini-table"><thead><tr><th>覆盖</th><th>指标</th><th>值</th></tr></thead><tbody>'+globalOv.map(function(o){return '<tr><td>'+esc(o.id)+'</td><td>'+esc(o.metric)+'</td><td>'+esc(o.value)+' '+esc(o.unit)+'</td></tr>';}).join('')+'</tbody></table>':'<p style="font-size:12px;color:var(--text-tertiary);">本模板暂无全局参数覆盖记录。</p>')+
      '<div style="margin-top:14px;"><button class="jg-btn jg-btn-primary" onclick="closeDrawer();distributeTpl(\''+t.id+'\')">下发到菇房</button></div>'
    );
  }else if(currentTab==='grades'){
    var g=FS.get('inocGrades',id);if(!g)return;
    openDrawer('接种等级 · '+g.name,
      '<div class="detail-grid">'+
      '<div class="detail-item"><div class="dl">等级</div><div class="dv"><span class="status-tag '+gradeCls(g.id)+'">'+esc(g.id)+'</span></div></div>'+
      '<div class="detail-item"><div class="dl">洁净度</div><div class="dv">'+esc(g.clean)+'</div></div>'+
      '<div class="detail-item"><div class="dl">沉降菌</div><div class="dv">'+esc(g.settle)+'</div></div>'+
      '<div class="detail-item"><div class="dl">污染率</div><div class="dv">'+esc(g.infection)+'</div></div>'+
      '<div class="detail-item full"><div class="dl">判定说明</div><div class="dv">'+esc(g.desc)+'</div></div>'+
      '</div>'+
      (g.id==='C'?'<p style="font-size:12px;color:#ff4d4f;">C 级禁止放行：重新灭菌接种并追责。</p>':'')
    );
  }else if(currentTab==='curves'){
    var c=FS.get('curveTemplates',id);if(!c)return;
    openDrawer('生长曲线 · '+c.variety,
      '<div class="detail-grid">'+
      '<div class="detail-item"><div class="dl">编号</div><div class="dv">'+esc(c.id)+'</div></div>'+
      '<div class="detail-item"><div class="dl">品种</div><div class="dv">'+esc(c.variety)+'</div></div>'+
      '<div class="detail-item"><div class="dl">积温阈值</div><div class="dv">'+Number(c.accumTemp).toLocaleString()+' °C·d</div></div>'+
      '<div class="detail-item"><div class="dl">天数阈值</div><div class="dv">'+c.days+' 天</div></div>'+
      '<div class="detail-item"><div class="dl">作者</div><div class="dv">'+esc(c.author)+'</div></div>'+
      '</div>'+
      '<div class="drawer-sec">双条件判定</div>'+
      '<div class="key-box">'+esc(c.condition)+'</div>'+
      '<div class="drawer-sec">转潮标准</div>'+
      '<div class="key-box">'+esc(c.turnStd)+'</div>'
    );
  }else{
    var o=FS.get('paramOverrides',id);if(!o)return;
    var same=FS.list('paramOverrides').filter(function(x){return x.metric===o.metric;});
    var rank={'批次':3,'菇房':2,'全局':1};
    same.sort(function(a,b){return rank[b.level]-rank[a.level];});
    openDrawer('参数覆盖 · '+o.id,
      '<div class="detail-grid">'+
      '<div class="detail-item"><div class="dl">级别</div><div class="dv"><span class="status-tag '+levelCls(o.level)+'">'+esc(o.level)+'</span></div></div>'+
      '<div class="detail-item"><div class="dl">作用域</div><div class="dv">'+esc(o.scope)+'</div></div>'+
      '<div class="detail-item"><div class="dl">指标</div><div class="dv">'+esc(o.metric)+'</div></div>'+
      '<div class="detail-item"><div class="dl">覆盖值</div><div class="dv">'+esc(o.value)+' '+esc(o.unit)+'</div></div>'+
      '<div class="detail-item"><div class="dl">来源</div><div class="dv">'+esc(o.source)+'</div></div>'+
      '<div class="detail-item"><div class="dl">操作人 / 时间</div><div class="dv">'+esc(o.operator)+' · '+esc(o.time)+'</div></div>'+
      '</div>'+
      '<div class="hint-bar">生效优先级：批次 &gt; 菇房 &gt; 全局。同一指标多级覆盖时，就近（最具体作用域）生效。</div>'+
      '<div class="drawer-sec">同指标覆盖（按优先级）</div>'+
      '<table class="mini-table"><thead><tr><th>优先</th><th>级别</th><th>作用域</th><th>值</th></tr></thead><tbody>'+
      same.map(function(x,i){return '<tr'+(x.id===o.id?' style="background:#f0f5ff;"':'')+'><td>'+(i+1)+'</td><td>'+esc(x.level)+'</td><td>'+esc(x.scope)+'</td><td>'+esc(x.value)+' '+esc(x.unit)+(x.id===o.id?'（本条）':'')+'</td></tr>';}).join('')+
      '</tbody></table>'
    );
  }
}
function exportCurrent(){
  var rows=applySort(currentRows());
  if(currentTab==='sops'){
    exportCSV('工艺标准',['编号','名称','版本','适用','生效日期','状态','关键参数'],rows.map(function(s){return [s.id,s.name,s.version,s.scope,String(s.effective).slice(0,10),s.status,s.key];}));
  }else if(currentTab==='recipes'){
    exportCSV('配方模板',['编号','名称','品种','版本','生效日期','作者','温度','湿度','CO2','光照','风速','负压','下发菇房','状态'],rows.map(function(t){
      return [t.id,t.name,t.variety,t.version,String(t.effective).slice(0,10),t.author,t.temp.join('~'),t.hum.join('~'),t.co2.join('~'),t.light.join('~'),t.wind.join('~'),t.negPressure.join('~'),(t.rooms||[]).join('、'),t.status];
    }));
  }else if(currentTab==='grades'){
    exportCSV('接种等级',['等级','名称','洁净度','沉降菌','污染率','判定说明'],rows.map(function(g){return [g.id,g.name,g.clean,g.settle,g.infection,g.desc];}));
  }else if(currentTab==='curves'){
    exportCSV('生长曲线',['编号','品种','积温阈值','天数阈值','双条件','转潮标准','作者'],rows.map(function(c){return [c.id,c.variety,c.accumTemp,c.days,c.condition,c.turnStd,c.author];}));
  }else{
    exportCSV('参数覆盖',['编号','级别','作用域','指标','值','单位','来源','操作人','时间'],rows.map(function(o){return [o.id,o.level,o.scope,o.metric,o.value,o.unit,o.source,o.operator,o.time];}));
  }
}
window.addEventListener('fungiStoreChange',function(e){
  var c=e.detail&&e.detail.col;
  if(c==='sops'||c==='recipeTemplates'||c==='inocGrades'||c==='curveTemplates'||c==='paramOverrides'||c==='*')renderAll();
});
switchTab('sops');
</script>
