<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%2352c41a'/%3E%3C/svg%3E">

<style>
  .search-input { flex:1; min-width:220px; }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:999; backdrop-filter:blur(4px); }
  .modal-overlay.show { display:block; }
  .modal-box { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:var(--bg-card); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.15);
    width:640px; max-width:94vw; max-height:88vh; overflow-y:auto; z-index:1000; animation:modalSlideIn .25s ease-out; padding:20px 24px; }
  .modal-box.show { display:block; }
  @keyframes modalSlideIn { from{opacity:0;transform:translate(-50%,-50%) scale(.95)} to{opacity:1;transform:translate(-50%,-50%) scale(1)} }
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;
    padding-bottom:16px; border-bottom:1px solid var(--border-light); }
  .modal-header h3 { font-size:16px; font-weight:600; color:var(--text-primary); margin:0; }
  .modal-close { width:28px; height:28px; border:none; background:var(--gray-100); border-radius:6px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .modal-close:hover { background:var(--error-bg); color:var(--error); }
  .modal-body { padding:0 4px; }
  .modal-footer { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; padding:16px 0 0;
    border-top:1px solid var(--border-light); }
  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-size:13px; font-weight:500; color:var(--text-secondary); margin-bottom:8px; }
  .form-group label.required::after { content:' *'; color:var(--error); }
  .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px;
    border:1px solid var(--border-default); border-radius:8px; font-size:13px; box-sizing:border-box; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline:none; border-color:var(--primary-400); box-shadow:0 0 0 3px rgba(24,144,255,.1); }
  .form-row { display:flex; gap:16px; }
  .form-row > .form-group { flex:1; }

  .drawer-mask { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:998; opacity:0; visibility:hidden; transition:all .25s; }
  .drawer-mask.show { opacity:1; visibility:visible; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:520px; max-width:94vw; background:var(--bg-card); z-index:999;
    transform:translateX(102%); transition:transform .25s ease; box-shadow:-8px 0 30px rgba(0,0,0,.12); display:flex; flex-direction:column; }
  .drawer.show { transform:none; }
  .drawer-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border-light); }
  .drawer-header h3 { margin:0; font-size:15px; font-weight:600; color:var(--text-primary); }
  .drawer-body { flex:1; overflow-y:auto; padding:16px 20px; }
  .drawer-section { font-weight:600; font-size:13px; color:var(--text-primary); margin:18px 0 8px; }
  .drawer-section:first-child { margin-top:0; }
  .detail-info { padding:12px; background:linear-gradient(135deg,var(--gray-50),var(--gray-100));
    border-radius:12px; margin-bottom:12px; border:1px solid var(--border-default); }
  .detail-row { display:flex; padding:9px 0; border-bottom:1px dashed var(--border-default); font-size:13px; }
  .detail-row:last-child { border-bottom:none; }
  .detail-label { width:104px; color:var(--text-tertiary); flex-shrink:0; }
  .detail-value { flex:1; color:var(--text-primary); word-break:break-all; }

  .status-tag { display:inline-flex; align-items:center; padding:3px 10px; font-size:11.5px;
    font-weight:500; border-radius:20px; white-space:nowrap; }
  .status-tag.online { background:#d9f7be; color:#3a8618; border:1px solid #b7eb8f; }
  .status-tag.offline { background:var(--error-bg); color:#cf1322; border:1px solid #ffccc7; }
  .status-tag.processing { background:var(--info-bg); color:var(--primary-500); border:1px solid var(--info-border); }
  .status-tag.warning { background:var(--warning-bg); color:#ad8b00; border:1px solid var(--warning-border); }
  .status-tag.idle { background:var(--gray-100); color:var(--text-secondary); border:1px solid var(--border-default); }
  .due-tag { display:inline-block; padding:2px 8px; border-radius:var(--radius-sm); font-size:11.5px; font-weight:500; white-space:nowrap; }
  .due-tag.overdue { background:var(--error-bg); color:#cf1322; border:1px solid #ffccc7; }
  .due-tag.soon { background:var(--warning-bg); color:#ad6800; border:1px solid var(--warning-border); }
  .due-tag.ok { background:#f6ffed; color:#389e0d; border:1px solid #b7eb8f; }
  .type-badge { display:inline-block; padding:2px 8px; border-radius:var(--radius-sm); font-size:11.5px;
    font-weight:500; background:var(--primary-50); color:var(--primary-600); border:1px solid var(--primary-100); }
  .type-badge.repair { background:var(--error-bg); color:#cf1322; border-color:#ffccc7; }

  .action-btns { display:flex; gap:6px; flex-wrap:nowrap; }
  .action-btn { padding:4px 10px; font-size:11.5px; font-weight:500; border:1px solid transparent;
    border-radius:6px; cursor:pointer; white-space:nowrap; background:none; }
  .action-btn.detail { color:#2b6cb0; background:#f5f8fc; border-color:#c5d9f0; }
  .action-btn.edit { color:var(--primary-600); background:var(--gray-50); border-color:var(--border-default); }
  .action-btn.del { color:#cf1322; background:var(--error-bg); border-color:#ffccc7; }
  .action-btn.flow { color:#3a8618; background:#f6ffed; border-color:#b7eb8f; }
  .action-btn.gen { color:#ad6800; background:var(--warning-bg); border-color:var(--warning-border); }

  .stat-card-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:16px; }
  .stat-card-row .stat-card { margin-top:0 !important; cursor:default; }
  .stat-card-row .stat-card:hover { transform:none; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .stat-label { font-size:12px; color:var(--text-tertiary); margin-bottom:6px; }
  .stat-value { font-size:26px; font-weight:700; color:var(--text-primary); font-variant-numeric:tabular-nums; }
  .stat-value .unit { font-size:13px; font-weight:500; color:var(--text-tertiary); margin-left:4px; }
  .stat-sub { margin-top:6px; font-size:12px; color:var(--text-tertiary); }
  .stat-sub.warn { color:var(--warning); }
  .stat-sub.err { color:var(--error); }

  .section-title { font-size:14px; font-weight:600; color:var(--text-primary); margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .section-title .count { font-size:12px; font-weight:500; color:var(--text-tertiary); }
  .data-table { min-width:1000px; }
  .data-table th { white-space:nowrap; }
  .data-table th.sortable { cursor:pointer; user-select:none; }
  .data-table th.sortable:hover { color:var(--primary-500); }
  .data-table th .arrow { font-size:10px; margin-left:3px; color:var(--primary-500); }
  .data-table tbody tr.clickable { cursor:pointer; }
  .data-table tbody tr.clickable:hover { background:#f7fbff; }
  .empty-row td { text-align:center; color:var(--text-tertiary); padding:32px 0; }
  #orderPagination { padding:12px 16px; }
  .selected-info { font-size:12.5px; color:var(--text-tertiary); margin-left:auto; }
  .selected-info strong { color:var(--primary-600); }

  .timeline { position:relative; padding-left:20px; }
  .timeline::before { content:''; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--border-default); }
  .tl-item { position:relative; padding:0 0 14px 8px; font-size:12.5px; }
  .tl-item::before { content:''; position:absolute; left:-19px; top:4px; width:10px; height:10px; border-radius:50%;
    background:#fff; border:2px solid var(--primary-400); }
  .tl-item.done::before { background:#52c41a; border-color:#52c41a; }
  .tl-item.todo::before { border-color:var(--border-default); }
  .tl-item .tl-title { font-weight:600; color:var(--text-primary); }
  .tl-item .tl-sub { color:var(--text-tertiary); font-size:11.5px; margin-top:2px; }
</style>

<script>
/* ============================================================
 * 设备运维工单（保养计划 + 维修/保养工单流转）
 * 数据源：FungiStore.maintainPlans / maintainOrders / spares / spareMoves
 * 到期倒计时按 plan.next 与今日差值推导（逾期红 / 3 天内橙）。
 * 完成工单时若 parts ≠ '—'：扣减 spares.stock 并写 spareMoves 出库；
 * 库存不足则阻止完成。流转时间 startedAt/closedAt 为页内补充字段
 * （store 种子无分阶段时间戳，种子工单对应阶段显示「—」）。
 * ============================================================ */
var FS = window.FungiStore;
var esc = DeviceUI.esc;
var ORDER_CLS = { '待处理':'warning', '处理中':'processing', '已完成':'online' };
var editingOrderId = '', editingPlanId = '';
var sortKey = 'time', sortDir = -1;
var orderPage = 1, PAGE_SIZE = 8;
var selected = {};

function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function nowStr(){ var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function todayStr(){ return FS.dayKey(0); }
function openPage(url, title){ if (window.parent && window.parent !== window && window.parent.openPage) window.parent.openPage(url, title); else location.href = url; }
function orderTag(s){ return '<span class="status-tag ' + (ORDER_CLS[s] || 'idle') + '">' + esc(s) + '</span>'; }
function deviceName(id){ var d = FS.get('devices', id); return d ? d.name : id; }
function spareName(id){ if (!id || id === '—') return '—'; var s = FS.get('spares', id); return s ? id + ' ' + s.name : id; }
function daysUntil(dateStr){
  var d = new Date(String(dateStr).slice(0,10) + 'T00:00:00');
  var t = new Date(todayStr() + 'T00:00:00');
  return Math.round((d - t) / 86400000);
}
function dueTag(next){
  var n = daysUntil(next);
  if (isNaN(n)) return '<span class="due-tag ok">—</span>';
  if (n < 0) return '<span class="due-tag overdue">已逾期 ' + (-n) + ' 天</span>';
  if (n <= 3) return '<span class="due-tag soon">' + (n === 0 ? '今日到期' : n + ' 天内到期') + '</span>';
  return '<span class="due-tag ok">' + n + ' 天后到期</span>';
}
function undoToast(msg, fn){
  var c = document.querySelector('.toast-container');
  if (!c){ c = document.createElement('div'); c.className = 'toast-container';
    c.style.cssText = 'position:fixed;top:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;'; document.body.appendChild(c); }
  var t = document.createElement('div'); t.className = 'jg-toast success';
  t.innerHTML = '<span class="jg-toast-icon">✓</span><span class="jg-toast-message">' + esc(msg) + '</span>';
  var b = document.createElement('button'); b.textContent = '撤销';
  b.style.cssText = 'margin-left:10px;padding:2px 10px;border:1px solid currentColor;border-radius:6px;background:none;color:inherit;cursor:pointer;font-size:12px;flex-shrink:0;';
  b.onclick = function(){ fn(); t.remove(); DeviceUI.toast('已撤销', 'info'); };
  t.appendChild(b); c.appendChild(t);
  setTimeout(function(){ if (t.parentNode){ t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(function(){ t.remove(); }, 300); } }, 6000);
}
function openDrawer(title, html){
  document.getElementById('drawerTitle').textContent = title;
  document.getElementById('drawerBody').innerHTML = html;
  document.getElementById('drawer').classList.add('show');
  document.getElementById('drawerMask').classList.add('show');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('drawerMask').classList.remove('show');
}

/* ---------- 统计卡 ---------- */
function renderStats(){
  var orders = FS.list('maintainOrders');
  var pending = orders.filter(function(x){ return x.status === '待处理'; }).length;
  var processing = orders.filter(function(x){ return x.status === '处理中'; }).length;
  var month = todayStr().slice(0,7);
  var doneMonth = orders.filter(function(x){ return x.status === '已完成' && String(x.time).slice(0,7) === month; }).length;
  var overdue = FS.list('maintainPlans').filter(function(p){ return daysUntil(p.next) < 0; }).length;
  document.getElementById('statCards').innerHTML =
    '<div class="stat-card"><div class="stat-label">待处理</div><div class="stat-value" style="color:' + (pending ? '#fa8c16' : 'inherit') + ';">' + pending + '<span class="unit">单</span></div>' +
    '<div class="stat-sub warn">维修 / 保养待分派</div></div>' +
    '<div class="stat-card"><div class="stat-label">处理中</div><div class="stat-value" style="color:#1890ff;">' + processing + '<span class="unit">单</span></div>' +
    '<div class="stat-sub">现场检修进行中</div></div>' +
    '<div class="stat-card"><div class="stat-label">本月完成</div><div class="stat-value" style="color:#52c41a;">' + doneMonth + '<span class="unit">单</span></div>' +
    '<div class="stat-sub">' + month + ' 已完成工单</div></div>' +
    '<div class="stat-card"><div class="stat-label">逾期保养</div><div class="stat-value" style="color:' + (overdue ? '#ff4d4f' : '#52c41a') + ';">' + overdue + '<span class="unit">项</span></div>' +
    '<div class="stat-sub ' + (overdue ? 'err' : '') + '">' + (overdue ? '请尽快生成保养工单' : '保养计划均在期内') + '</div></div>';
}

/* ---------- 保养计划 ---------- */
function renderPlans(){
  var plans = FS.list('maintainPlans');
  document.getElementById('planCount').textContent = '共 ' + plans.length + ' 项 · 到期前 3 天预警';
  var body = document.getElementById('planBody');
  if (!plans.length){
    body.innerHTML = '<tr class="empty-row"><td colspan="8">暂无保养计划</td></tr>';
    return;
  }
  body.innerHTML = plans.map(function(p){
    return '<tr>' +
      '<td><strong>' + esc(p.id) + '</strong></td>' +
      '<td title="' + esc(deviceName(p.device)) + '">' + esc(p.device) + '</td>' +
      '<td>' + esc(p.item) + '</td>' +
      '<td>' + p.cycle + ' 天</td>' +
      '<td>' + esc(p.last) + '</td>' +
      '<td>' + esc(p.next) + '</td>' +
      '<td>' + dueTag(p.next) + '</td>' +
      '<td><div class="action-btns">' +
        '<button class="action-btn gen" onclick="genOrder(\'' + esc(p.id) + '\')">生成工单</button>' +
        '<button class="action-btn edit" onclick="openPlanModal(\'' + esc(p.id) + '\')">编辑</button>' +
        '<button class="action-btn del" onclick="deletePlan(\'' + esc(p.id) + '\')">删除</button>' +
      '</div></td></tr>';
  }).join('');
}
function genOrder(planId){
  var p = FS.get('maintainPlans', planId);
  if (!p) return;
  Modal.confirm('按保养计划「' + p.item + '」为设备 ' + deviceName(p.device) + ' 生成待处理保养工单？', {
    title: '生成保养工单', confirmText: '生成'
  }).then(function(ok){
    if (!ok) return;
    var order = FS.add('maintainOrders', { device: p.device, type: '保养', item: p.item, status: '待处理', owner: '张才孙', parts: '—', time: nowStr() });
    var next = new Date(todayStr() + 'T00:00:00');
    next.setDate(next.getDate() + (p.cycle || 30));
    FS.update('maintainPlans', planId, { last: todayStr(), next: next.getFullYear() + '-' + pad2(next.getMonth()+1) + '-' + pad2(next.getDate()) });
    DeviceUI.toast('保养工单 ' + order.id + ' 已生成', 'success');
    refreshAll();
  });
}
function openPlanModal(id){
  editingPlanId = id || '';
  var p = id ? FS.get('maintainPlans', id) : null;
  document.getElementById('planTitle').textContent = p ? '编辑计划 · ' + p.id : '新增保养计划';
  document.getElementById('pDevice').value = p ? p.device : 'DV-01';
  document.getElementById('pCycle').value = p ? p.cycle : '';
  document.getElementById('pItem').value = p ? p.item : '';
  document.getElementById('pLast').value = p ? String(p.last).slice(0,10) : todayStr();
  document.getElementById('pNext').value = p ? String(p.next).slice(0,10) : '';
  document.getElementById('planOverlay').classList.add('show');
  document.getElementById('planModal').classList.add('show');
}
function closePlanModal(){
  document.getElementById('planOverlay').classList.remove('show');
  document.getElementById('planModal').classList.remove('show');
  editingPlanId = '';
}
function savePlan(){
  var item = document.getElementById('pItem').value.trim();
  var cycle = Number(document.getElementById('pCycle').value);
  var next = document.getElementById('pNext').value;
  if (!item){ DeviceUI.toast('请填写保养项目', 'error'); return; }
  if (!cycle || cycle < 1){ DeviceUI.toast('请填写有效周期（天）', 'error'); return; }
  if (!next){ DeviceUI.toast('请选择下次保养日期', 'error'); return; }
  var patch = { device: document.getElementById('pDevice').value, item: item, cycle: cycle,
    last: document.getElementById('pLast').value || todayStr(), next: next };
  if (editingPlanId){
    FS.update('maintainPlans', editingPlanId, patch);
    DeviceUI.toast('保养计划已更新', 'success');
  } else {
    FS.add('maintainPlans', patch);
    DeviceUI.toast('保养计划已创建', 'success');
  }
  closePlanModal(); refreshAll();
}
function deletePlan(id){
  var p = FS.get('maintainPlans', id);
  if (!p) return;
  DeviceUI.confirmDelete('确定删除保养计划「' + p.item + '」吗？删除后可在提示中撤销。').then(function(ok){
    if (!ok) return;
    var list = FS.list('maintainPlans');
    var idx = list.findIndex(function(x){ return x.id === id; });
    FS.remove('maintainPlans', id);
    refreshAll();
    undoToast('计划 ' + id + ' 已删除', function(){ FS.restore('maintainPlans', p, idx); refreshAll(); });
  });
}

/* ---------- 工单筛选 / 排序 ---------- */
function orderFiltered(){
  var status = document.getElementById('statusSelect').value;
  var type = document.getElementById('typeSelect').value;
  var dev = document.getElementById('deviceSelect').value;
  var kw = document.getElementById('searchInput').value.trim().toLowerCase();
  var list = FS.list('maintainOrders').filter(function(x){
    if (status && x.status !== status) return false;
    if (type && x.type !== type) return false;
    if (dev && x.device !== dev) return false;
    if (kw){
      var hay = [x.id, x.device, deviceName(x.device), x.item, x.owner, x.parts].join(' ').toLowerCase();
      if (hay.indexOf(kw) < 0) return false;
    }
    return true;
  });
  list.sort(function(a,b){ return String(a[sortKey] || '').localeCompare(String(b[sortKey] || ''), 'zh-CN') * sortDir; });
  return list;
}
function setSort(key){
  if (sortKey === key) sortDir = -sortDir; else { sortKey = key; sortDir = key === 'time' ? -1 : 1; }
  orderPage = 1; renderOrders();
}
function resetFilter(){
  ['statusSelect','typeSelect','deviceSelect'].forEach(function(id){ document.getElementById(id).value = ''; });
  document.getElementById('searchInput').value = '';
  orderPage = 1; renderOrders();
  DeviceUI.toast('已重置筛选条件', 'info');
}

/* ---------- 工单表 ---------- */
function renderOrders(){
  var list = orderFiltered();
  var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (orderPage > totalPages) orderPage = totalPages;
  var pageData = list.slice((orderPage-1)*PAGE_SIZE, orderPage*PAGE_SIZE);
  document.getElementById('orderCount').textContent = '共 ' + list.length + ' 单';
  var body = document.getElementById('orderBody');
  if (!pageData.length){
    body.innerHTML = '<tr class="empty-row"><td colspan="10">暂无符合条件的工单</td></tr>';
  } else {
    body.innerHTML = pageData.map(function(o){
      var flowBtn = '';
      if (o.status === '待处理') flowBtn = '<button class="action-btn flow" onclick="startOrder(\'' + esc(o.id) + '\')">开始处理</button>';
      else if (o.status === '处理中') flowBtn = '<button class="action-btn flow" onclick="finishOrder(\'' + esc(o.id) + '\')">完成</button>';
      return '<tr class="clickable" onclick="openOrderDrawer(\'' + esc(o.id) + '\')">' +
        '<td style="text-align:center;" onclick="event.stopPropagation();"><input type="checkbox" ' + (selected[o.id] ? 'checked' : '') + ' onclick="toggleOne(\'' + esc(o.id) + '\',this)"></td>' +
        '<td><strong>' + esc(o.id) + '</strong></td>' +
        '<td title="' + esc(deviceName(o.device)) + '">' + esc(o.device) + '</td>' +
        '<td><span class="type-badge' + (o.type === '维修' ? ' repair' : '') + '">' + esc(o.type) + '</span></td>' +
        '<td>' + esc(o.item) + '</td>' +
        '<td>' + esc(spareName(o.parts)) + '</td>' +
        '<td>' + orderTag(o.status) + '</td>' +
        '<td>' + esc(o.owner) + '</td>' +
        '<td>' + esc(o.time) + '</td>' +
        '<td onclick="event.stopPropagation();"><div class="action-btns">' + flowBtn +
          '<button class="action-btn edit" onclick="openOrderModal(\'' + esc(o.id) + '\')">编辑</button>' +
          '<button class="action-btn del" onclick="deleteOrder(\'' + esc(o.id) + '\')">删除</button>' +
        '</div></td></tr>';
    }).join('');
  }
  ['id','status','time'].forEach(function(k){
    document.getElementById('ar-' + k).textContent = sortKey === k ? (sortDir > 0 ? '▲' : '▼') : '';
  });
  var pg = '<div class="pagination">';
  pg += '<button class="page-btn ' + (orderPage <= 1 ? 'disabled' : '') + '" onclick="gotoPage(' + (orderPage-1) + ')">‹</button>';
  for (var i = 1; i <= totalPages; i++){
    pg += '<button class="page-btn ' + (i === orderPage ? 'active' : '') + '" onclick="gotoPage(' + i + ')">' + i + '</button>';
  }
  pg += '<button class="page-btn ' + (orderPage >= totalPages ? 'disabled' : '') + '" onclick="gotoPage(' + (orderPage+1) + ')">›</button>';
  pg += '<span style="margin-left:16px;font-size:13px;color:#6b7b6b;">第 ' + orderPage + ' 页/共 ' + totalPages + ' 页，共 ' + list.length + ' 条记录</span></div>';
  document.getElementById('orderPagination').innerHTML = pg;
  var all = document.getElementById('checkAll');
  all.checked = pageData.length > 0 && pageData.every(function(x){ return selected[x.id]; });
  renderSelected();
}
function gotoPage(n){
  var totalPages = Math.max(1, Math.ceil(orderFiltered().length / PAGE_SIZE));
  if (n < 1 || n > totalPages) return;
  orderPage = n; renderOrders();
}
function toggleOne(id, box){ if (box.checked) selected[id] = true; else delete selected[id]; renderSelected(); }
function toggleAll(box){
  orderFiltered().slice((orderPage-1)*PAGE_SIZE, orderPage*PAGE_SIZE).forEach(function(x){
    if (box.checked) selected[x.id] = true; else delete selected[x.id];
  });
  renderOrders();
}
function renderSelected(){
  var ids = Object.keys(selected);
  var btn = document.getElementById('bulkDelBtn');
  btn.disabled = !ids.length;
  btn.textContent = ids.length ? '批量删除（' + ids.length + '）' : '批量删除';
  document.getElementById('selectedInfo').innerHTML = ids.length ? '已选 <strong>' + ids.length + '</strong> 单' : '';
}

/* ---------- 状态流转 ---------- */
function startOrder(id){
  var o = FS.get('maintainOrders', id);
  if (!o) return;
  FS.update('maintainOrders', id, { status: '处理中', startedAt: nowStr() });
  DeviceUI.toast('工单 ' + id + ' 已开始处理', 'success');
  refreshAll();
}
function finishOrder(id){
  var o = FS.get('maintainOrders', id);
  if (!o) return;
  var needSpare = o.parts && o.parts !== '—';
  var spare = needSpare ? FS.get('spares', o.parts) : null;
  if (needSpare && !spare){ DeviceUI.toast('备件 ' + o.parts + ' 不存在，无法完成', 'error'); return; }
  if (needSpare && spare.stock < 1){
    DeviceUI.toast('备件「' + spare.name + '」库存不足（当前 ' + spare.stock + '），请先入库后再完成工单', 'error');
    return;
  }
  Modal.confirm('确定完成工单「' + o.item + '」吗？' + (needSpare ? '将出库备件「' + spare.name + '」×1（当前库存 ' + spare.stock + '）。' : ''), {
    title: '完成工单', confirmText: '完成'
  }).then(function(ok){
    if (!ok) return;
    if (needSpare){
      FS.update('spares', spare.id, { stock: spare.stock - 1 });
      FS.add('spareMoves', { type: '出库', spare: spare.id, qty: 1, ref: id, operator: o.owner, time: nowStr() });
    }
    FS.update('maintainOrders', id, { status: '已完成', closedAt: nowStr() });
    if (o.type === '维修'){
      var dev = FS.get('devices', o.device);
      if (dev && dev.status === '故障') FS.update('devices', o.device, { status: '运行' });
    }
    DeviceUI.toast('工单 ' + id + ' 已完成' + (needSpare ? '，备件已出库' : ''), 'success');
    refreshAll();
  });
}

/* ---------- 工单 CRUD ---------- */
function openOrderModal(id){
  editingOrderId = id || '';
  var o = id ? FS.get('maintainOrders', id) : null;
  document.getElementById('orderTitle').textContent = o ? '编辑工单 · ' + o.id : '新建工单';
  document.getElementById('oDevice').value = o ? o.device : 'DV-03';
  document.getElementById('oType').value = o ? o.type : '维修';
  document.getElementById('oItem').value = o ? o.item : '';
  document.getElementById('oOwner').value = o ? o.owner : '张才孙';
  document.getElementById('oParts').value = o ? (o.parts || '—') : '—';
  document.getElementById('oStatus').value = o ? o.status : '待处理';
  document.getElementById('orderOverlay').classList.add('show');
  document.getElementById('orderModal').classList.add('show');
}
function closeOrderModal(){
  document.getElementById('orderOverlay').classList.remove('show');
  document.getElementById('orderModal').classList.remove('show');
  editingOrderId = '';
}
function saveOrder(){
  var item = document.getElementById('oItem').value.trim();
  if (!item){ DeviceUI.toast('请填写故障 / 保养描述', 'error'); return; }
  var patch = {
    device: document.getElementById('oDevice').value,
    type: document.getElementById('oType').value,
    item: item,
    owner: document.getElementById('oOwner').value,
    parts: document.getElementById('oParts').value,
    status: document.getElementById('oStatus').value
  };
  if (editingOrderId){
    FS.update('maintainOrders', editingOrderId, patch);
    DeviceUI.toast('工单已更新', 'success');
  } else {
    patch.time = nowStr();
    var o = FS.add('maintainOrders', patch);
    DeviceUI.toast('工单 ' + o.id + ' 已创建', 'success');
  }
  closeOrderModal(); refreshAll();
}
function deleteOrder(id){
  var o = FS.get('maintainOrders', id);
  if (!o) return;
  DeviceUI.confirmDelete('确定删除工单「' + id + '」吗？删除后可在提示中撤销。').then(function(ok){
    if (!ok) return;
    var list = FS.list('maintainOrders');
    var idx = list.findIndex(function(x){ return x.id === id; });
    FS.remove('maintainOrders', id);
    delete selected[id];
    refreshAll();
    undoToast('工单 ' + id + ' 已删除', function(){ FS.restore('maintainOrders', o, idx); refreshAll(); });
  });
}
function bulkDelete(){
  var ids = Object.keys(selected);
  if (!ids.length) return;
  DeviceUI.confirmDelete('确定删除选中的 ' + ids.length + ' 张工单吗？删除后可在提示中撤销。').then(function(ok){
    if (!ok) return;
    var list = FS.list('maintainOrders');
    var items = ids.map(function(id){
      return { obj: list.filter(function(x){ return x.id === id; })[0], idx: list.findIndex(function(x){ return x.id === id; }) };
    }).filter(function(x){ return x.obj; }).sort(function(a,b){ return a.idx - b.idx; });
    items.forEach(function(x){ FS.remove('maintainOrders', x.obj.id); });
    selected = {};
    refreshAll();
    undoToast('已删除 ' + items.length + ' 张工单', function(){
      items.forEach(function(x){ FS.restore('maintainOrders', x.obj, x.idx); });
      refreshAll();
    });
  });
}

/* ---------- 详情抽屉（故障描述 + 处理记录时间线） ---------- */
function openOrderDrawer(id){
  var o = FS.get('maintainOrders', id);
  if (!o) return;
  var moves = FS.list('spareMoves').filter(function(m){ return m.ref === id; });
  var rows = [
    ['工单号', o.id], ['设备', o.device + ' · ' + deviceName(o.device)],
    ['类型', o.type], ['状态', orderTag(o.status), 'raw'],
    ['负责人', o.owner], ['所需备件', spareName(o.parts)], ['创建时间', o.time]
  ];
  var html = '<div class="drawer-section">工单信息</div><div class="detail-info">' +
    rows.map(function(r){
      return '<div class="detail-row"><span class="detail-label">' + r[0] + '</span><span class="detail-value">' + (r[2] === 'raw' ? r[1] : esc(r[1])) + '</span></div>';
    }).join('') + '</div>';
  html += '<div class="drawer-section">故障 / 保养描述</div><div style="font-size:13px;color:var(--text-primary);padding:10px 12px;background:var(--gray-50);border-radius:8px;border:1px solid var(--border-light);">' + esc(o.item) + '</div>';
  html += '<div class="drawer-section">处理记录时间线</div><div class="timeline">';
  html += '<div class="tl-item done"><div class="tl-title">工单创建</div><div class="tl-sub">' + esc(o.time) + ' · ' + esc(o.owner) + ' 负责</div></div>';
  var started = o.status === '处理中' || o.status === '已完成';
  html += '<div class="tl-item ' + (started ? 'done' : 'todo') + '"><div class="tl-title">开始处理</div><div class="tl-sub">' + (started ? esc(o.startedAt || '—（种子数据无阶段时间）') : '待开始') + '</div></div>';
  var closed = o.status === '已完成';
  html += '<div class="tl-item ' + (closed ? 'done' : 'todo') + '"><div class="tl-title">完成闭环</div><div class="tl-sub">' + (closed ? esc(o.closedAt || '—（种子数据无阶段时间）') : '待完成') + '</div></div>';
  moves.forEach(function(m){
    html += '<div class="tl-item done"><div class="tl-title">备件' + esc(m.type) + ' · ' + esc(spareName(m.spare)) + ' ×' + m.qty + '</div><div class="tl-sub">' + esc(m.time) + ' · ' + esc(m.operator) + ' · 流水 ' + esc(m.id) + '</div></div>';
  });
  html += '</div>';
  openDrawer('工单详情 · ' + o.id, html);
}

/* ---------- 导出 ---------- */
function exportOrders(){
  var headers = ['工单号','设备','类型','故障/保养描述','备件','状态','负责人','时间'];
  var rows = orderFiltered().map(function(o){ return [o.id, o.device, o.type, o.item, o.parts || '—', o.status, o.owner, o.time]; });
  DeviceUI.exportCsv('运维工单', headers, rows);
}

/* ---------- 刷新 / 初始化 ---------- */
function refreshAll(){ renderStats(); renderPlans(); renderOrders(); }
document.addEventListener('DOMContentLoaded', function(){
  var devOpts = FS.list('devices').map(function(d){ return { value: d.id, label: d.id + ' · ' + d.name }; });
  DeviceUI.fillSelect('oDevice', devOpts, null);
  DeviceUI.fillSelect('pDevice', devOpts, null);
  var devIds = {};
  FS.list('maintainOrders').forEach(function(o){ devIds[o.device] = true; });
  DeviceUI.fillSelect('deviceSelect', Object.keys(devIds).sort(), '全部设备');
  DeviceUI.fillSelect('oOwner', DeviceUI.operators(), null);
  var spareOpts = [{ value: '—', label: '—（无需备件）' }].concat(FS.list('spares').map(function(s){
    return { value: s.id, label: s.id + ' · ' + s.name + '（库存 ' + s.stock + '）' };
  }));
  DeviceUI.fillSelect('oParts', spareOpts, null);
  refreshAll();
  document.getElementById('searchInput').addEventListener('input', function(){ orderPage = 1; renderOrders(); });
  ['statusSelect','typeSelect','deviceSelect'].forEach(function(id){
    document.getElementById(id).addEventListener('change', function(){ orderPage = 1; renderOrders(); });
  });
});
