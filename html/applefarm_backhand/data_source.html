<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工厂化农业数据管理系统 - 监管对接</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%2352c41a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .modal-overlay { position:fixed; inset:0; background:rgba(0,21,41,0.5); display:flex; align-items:center; justify-content:center; z-index:1200; opacity:0; visibility:hidden; transition:all .25s ease; }
  .modal-overlay.active { opacity:1; visibility:visible; }
  .modal { background:var(--bg-card); border-radius:16px; width:520px; max-width:92vw; max-height:90vh; overflow:hidden; transform:scale(.92); transition:all .25s ease; display:flex; flex-direction:column; }
  .modal-overlay.active .modal { transform:scale(1); }
  .modal-header { padding:18px 24px; border-bottom:1px solid var(--border-default); display:flex; align-items:center; justify-content:space-between; background:linear-gradient(135deg,#13c2c2 0%,#1890ff 100%); color:#fff; flex-shrink:0; }
  .modal-header h3 { font-size:17px; font-weight:600; margin:0; color:#fff; }
  .modal-close { width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.2); border:none; color:#fff; cursor:pointer; font-size:16px; line-height:1; }
  .modal-close:hover { background:rgba(255,255,255,.32); }
  .modal-body { padding:22px 24px; overflow-y:auto; }
  .modal-footer { padding:14px 24px; border-top:1px solid var(--border-default); display:flex; justify-content:flex-end; gap:12px; flex-shrink:0; }
  .form-group { display:flex; flex-direction:column; gap:7px; margin-bottom:14px; }
  .form-group label { font-size:13px; font-weight:600; color:var(--text-primary); }
  .form-group input, .form-group select { padding:9px 12px; border:1px solid var(--border-default); border-radius:8px; font-size:14px; transition:all .2s; background:#fff; color:var(--text-primary); }
  .form-group input:focus, .form-group select:focus { outline:none; border-color:#1890ff; box-shadow:0 0 0 3px rgba(24,144,255,.12); }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-hint { font-size:12px; color:var(--text-tertiary); }
  .req { color:#ff4d4f; }
  .detail-grid { display:grid; grid-template-columns:100px 1fr; gap:10px; padding:9px 0; border-bottom:1px dashed var(--border-light); font-size:13px; }
  .detail-grid:last-child { border-bottom:none; }
  .detail-label { color:var(--text-tertiary); }
  .detail-value { color:var(--text-primary); font-weight:500; word-break:break-all; }
  .drawer-overlay { position:fixed; inset:0; background:rgba(0,21,41,.45); z-index:1100; opacity:0; visibility:hidden; transition:all .25s; }
  .drawer-overlay.active { opacity:1; visibility:visible; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:520px; max-width:94vw; background:var(--bg-card); z-index:1101; transform:translateX(102%); transition:transform .3s ease; display:flex; flex-direction:column; box-shadow:-10px 0 34px rgba(0,21,41,.16); }
  .drawer.active { transform:none; }
  .drawer-header { padding:18px 22px; background:linear-gradient(135deg,#13c2c2 0%,#722ed1 100%); color:#fff; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .drawer-header h3 { margin:0; font-size:16px; color:#fff; }
  .drawer-body { flex:1; overflow-y:auto; padding:18px 22px; }
  .drawer-footer { padding:12px 22px; border-top:1px solid var(--border-default); display:flex; gap:10px; justify-content:flex-end; flex-shrink:0; }
  .drawer-body::-webkit-scrollbar, .modal-body::-webkit-scrollbar { width:6px; }
  .drawer-body::-webkit-scrollbar-track, .modal-body::-webkit-scrollbar-track { background:#e6fffb; }
  .drawer-body::-webkit-scrollbar-thumb, .modal-body::-webkit-scrollbar-thumb { background:#87e8de; border-radius:3px; }
  .drawer-body::-webkit-scrollbar-thumb:hover, .modal-body::-webkit-scrollbar-thumb:hover { background:#13c2c2; }
  .toast { position:fixed; top:20px; right:20px; padding:13px 18px; background:var(--bg-card); border-radius:10px; box-shadow:0 6px 24px rgba(0,21,41,.18); display:flex; align-items:center; gap:10px; z-index:2000; transform:translateX(120%); transition:all .3s ease; border-left:4px solid #52c41a; max-width:min(480px,90vw); font-size:13px; }
  .toast.show { transform:translateX(0); }
  .toast.error { border-left-color:#ff4d4f; }
  .toast.warning { border-left-color:#fa8c16; }
  .toast.info { border-left-color:#1890ff; }
  .toast-undo { border:1px solid #1890ff; color:#1890ff; background:#e6f4ff; border-radius:6px; padding:3px 12px; font-size:12px; cursor:pointer; flex-shrink:0; }
  .toast-undo:hover { background:#1890ff; color:#fff; }
  .stats-section { margin-bottom:16px; }
  .stats-section .stat-card { height:100%; }
  .stats-section .stat-card + .stat-card { margin-top:0; }
  .data-section { overflow-x:auto; }
  .data-section::-webkit-scrollbar { height:8px; }
  .data-section::-webkit-scrollbar-track { background:#f6ffed; }
  .data-section::-webkit-scrollbar-thumb { background:#b7eb8f; border-radius:4px; }
  .data-section::-webkit-scrollbar-thumb:hover { background:#52c41a; }
  @media (max-width:1100px){ .stats-section { grid-template-columns:repeat(2,1fr); } }
  .bulk-bar { display:none; align-items:center; gap:12px; padding:8px 14px; margin-bottom:10px; background:#e6f4ff; border:1px solid #91caff; border-radius:8px; font-size:13px; color:#0958d9; }
  .bulk-bar.show { display:flex; }
  th.sortable { cursor:pointer; user-select:none; }
  th.sortable:hover { color:#1890ff; }
  .empty-row td { text-align:center; color:var(--text-tertiary); padding:36px 0 !important; font-size:13px; }
  .mono { font-family:Consolas,Menlo,monospace; font-size:12.5px; }
  .section-title { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:600; color:var(--text-primary); margin:20px 0 12px; }
  .section-title::before { content:''; width:4px; height:16px; border-radius:2px; background:linear-gradient(180deg,#13c2c2,#1890ff); }
  .config-card { background:var(--bg-card); border:1px solid var(--border-default); border-radius:12px; padding:20px; box-shadow:0 1px 3px rgba(16,24,40,.06); }
  .config-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:1100px){ .config-grid { grid-template-columns:1fr; } }
  .json-pre { background:#001529; color:#d6e4ff; border-radius:10px; padding:14px 16px; font-family:Consolas,Menlo,monospace; font-size:12px; line-height:1.7; overflow-x:auto; white-space:pre; }
  .json-pre::-webkit-scrollbar { height:6px; }
  .json-pre::-webkit-scrollbar-track { background:#002140; }
  .json-pre::-webkit-scrollbar-thumb { background:#1890ff; border-radius:3px; }
  .json-key { color:#87e8de; }
  .json-str { color:#b7eb8f; }
  .json-num { color:#ffc069; }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
</head>
<body data-active-menu="trace" data-active-submenu="data-source">

<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3L11 11M11 3L3 11"/></svg>
        </button>
      </div>
    </div>

    <main class="main-content">
      <div class="content-wrapper">

        <div class="stats-section metrics-row">
          <div class="stat-card cyan">
            <div class="stat-header"><span class="stat-label">今日上报</span><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span></div>
            <div class="stat-value" id="stToday">—</div>
            <div class="stat-footer"><span style="font-size:12px;color:var(--text-tertiary);" id="stTotal">累计报文 —</span></div>
          </div>
          <div class="stat-card green">
            <div class="stat-header"><span class="stat-label">上报成功率</span><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span></div>
            <div class="stat-value" id="stRate">—</div>
            <div class="stat-footer"><span style="font-size:12px;color:var(--text-tertiary);">省监管平台回执口径</span></div>
          </div>
          <div class="stat-card red">
            <div class="stat-header"><span class="stat-label">死信队列</span><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg></span></div>
            <div class="stat-value" id="stDead">—</div>
            <div class="stat-footer"><span style="font-size:12px;color:var(--text-tertiary);">清零后自动闭环关联预警</span></div>
          </div>
          <div class="stat-card blue">
            <div class="stat-header"><span class="stat-label">最近回执</span><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="m9 15 2 2 4-4"/></svg></span></div>
            <div class="stat-value" id="stReceipt" style="font-size:19px;line-height:1.4;">—</div>
            <div class="stat-footer"><span style="font-size:12px;color:var(--text-tertiary);" id="stReceiptTime">—</span></div>
          </div>
        </div>

        <div class="section-title">对接配置</div>
        <div class="config-card" style="margin-bottom:16px;">
          <div class="config-grid">
            <div class="form-group" style="margin-bottom:0;"><label>监管平台地址 <span class="req">*</span></label><input type="text" id="cfgUrl" placeholder="https://…"></div>
            <div class="form-group" style="margin-bottom:0;"><label>企业编码（统一社会信用代码）<span class="req">*</span></label><input type="text" id="cfgEnt" placeholder="18 位信用代码"></div>
            <div class="form-group" style="margin-bottom:0;"><label>证书有效期 <span class="req">*</span></label><input type="date" id="cfgCert"></div>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:12px;flex-wrap:wrap;">
            <span class="form-hint" id="cfgHint">配置保存于本机（mushroom_reg_config），上报报文将携带企业编码签名。</span>
            <button class="jg-btn jg-btn-primary" onclick="saveConfig()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>保存配置
            </button>
          </div>
        </div>

        <div class="search-section">
          <div class="search-bar">
            <select class="search-select" id="typeSelect" style="width:150px;">
              <option value="">全部类型</option><option>批次报文</option><option>采收报文</option><option>冷链报文</option><option>灭菌报文</option><option>接种报文</option>
            </select>
            <select class="search-select" id="statusSelect" style="width:130px;">
              <option value="">全部状态</option><option>成功</option><option>死信</option>
            </select>
            <input type="text" class="search-input" placeholder="报文号 / 批次 / 回执搜索…" id="kwInput" style="width:220px;">
            <div class="search-actions">
              <button class="jg-btn jg-btn-primary" onclick="applyFilter(true)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</button>
              <button class="jg-btn" onclick="resetSearch()">重置</button>
            </div>
          </div>
        </div>

        <div class="action-bar">
          <div class="action-left">
            <button class="jg-btn jg-btn-primary" onclick="openReportModal()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>手动上报
            </button>
            <button class="jg-btn" style="border-color:#fa8c16;color:#fa8c16;" onclick="resendAllDead()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>死信全部重发
            </button>
            <button class="jg-btn" onclick="exportCSV()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导出 CSV
            </button>
          </div>
          <div class="action-right"><span style="font-size:13px;color:var(--text-tertiary);" id="filterInfo"></span></div>
        </div>

        <div class="bulk-bar" id="bulkBar">
          <span>已勾选 <strong id="bulkCount">0</strong> 条报文</span>
          <button class="jg-btn" style="border-color:#ff4d4f;color:#ff4d4f;" onclick="bulkDelete()">批量删除</button>
          <button class="jg-btn" onclick="clearSelection()">取消勾选</button>
        </div>

        <div class="data-section">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width:44px;"><input type="checkbox" id="checkAll" onchange="toggleAll(this.checked)" aria-label="全选"></th>
                <th style="width:56px;">序号</th>
                <th>报文号</th>
                <th>批次号</th>
                <th>报文类型</th>
                <th>记录数</th>
                <th class="sortable" onclick="toggleSort()" id="thTime">上报时间 <span id="sortArrow">↕</span></th>
                <th>监管回执</th>
                <th>状态</th>
                <th style="width:190px;">操作</th>
              </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
          </table>
          <div id="pagination-container"></div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- 报文详情抽屉 -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="rpDrawer" role="dialog" aria-label="报文详情">
  <div class="drawer-header">
    <h3 id="drawerTitle">报文详情</h3>
    <button class="modal-close" onclick="closeDrawer()" aria-label="关闭">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-footer" id="drawerFooter"></div>
</div>

<!-- 手动上报弹窗 -->
<div class="modal-overlay" id="reportModal">
  <div class="modal">
    <div class="modal-header"><h3>手动上报监管平台</h3><button class="modal-close" onclick="closeModal('reportModal')">×</button></div>
    <div class="modal-body">
      <div class="form-group"><label>生产批次 <span class="req">*</span></label><select id="rpBatch"><option value="">请选择批次</option></select></div>
      <div class="form-row">
        <div class="form-group"><label>报文类型 <span class="req">*</span></label><select id="rpType"><option value="">请选择</option><option>批次报文</option><option>采收报文</option><option>冷链报文</option><option>灭菌报文</option><option>接种报文</option></select></div>
        <div class="form-group"><label>记录数 <span class="req">*</span></label><input type="number" id="rpCount" value="1" min="1" max="500"></div>

    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('reportModal')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="confirmReport()">提交上报</button>

  </div>

<!-- 通用确认弹窗 -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal" style="width:420px;">
    <div class="modal-header" style="background:linear-gradient(135deg,#fa8c16 0%,#ff4d4f 100%);"><h3 id="confirmTitle">确认操作</h3><button class="modal-close" onclick="closeModal('confirmModal')">×</button></div>
    <div class="modal-body"><div id="confirmText" style="font-size:14px;color:var(--text-secondary);line-height:1.7;"></div></div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('confirmModal')">取消</button>
      <button class="jg-btn jg-btn-primary" id="confirmOk" style="background:#ff4d4f;border-color:#ff4d4f;">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <span id="toastMessage">操作成功</span>
  <button class="toast-undo" id="toastUndo" style="display:none;">撤销</button>
</div>

<script src="js/shared/fungi-store.js"></script>
<script src="js/shared/fungi-alert-data.js"></script>
<script>
/* ============================================================
 * 监管对接 —— FungiStore.regulatory 单一真源
 * 死信重发 → 成功 + 湘监收〔2026〕mmdd-序号 回执
 * 死信清零 → FungiAlertData.update('FA-261115-08',{status:'closed'})
 * 对接配置存 localStorage mushroom_reg_config
 * ============================================================ */
'use strict';
var FS = window.FungiStore;
var REG_KEY='mushroom_reg_config';
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n,l){ n=String(n); while(n.length<(l||2)) n='0'+n; return n; }
function nowHM(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function nowStr(){ return FS.at(0, nowHM()); }
function currentUser(){ try{ return JSON.parse(sessionStorage.getItem('snzg_user')||'{}'); }catch(e){ return {}; } }
function opLog(action, object){
  try{
    var u=currentUser();
    var arr=JSON.parse(localStorage.getItem('mushroom_op_log')||'[]');
    arr.unshift({ time:nowStr(), account:u.username||'admin', action:action, object:object||'—' });
    if(arr.length>200) arr.length=200;
    localStorage.setItem('mushroom_op_log', JSON.stringify(arr));
  }catch(e){}
}
var toastTimer=null, undoFn=null;
function showToast(msg,type,undo){
  var t=document.getElementById('toast');
  document.getElementById('toastMessage').textContent=msg;
  var ub=document.getElementById('toastUndo');
  undoFn=undo||null; ub.style.display=undo?'':'none';
  t.className='toast '+(type||'success')+' show';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove('show'); undoFn=null; }, undo?6000:3400);
}
document.getElementById('toastUndo').addEventListener('click',function(){
  if(undoFn){ var f=undoFn; undoFn=null; f(); }
  document.getElementById('toast').classList.remove('show');
});
function openModal(id){ document.getElementById(id).classList.add('active'); }
function closeModal(id){ document.getElementById(id).classList.remove('active'); }
function askConfirm(title,html,onOk){
  document.getElementById('confirmTitle').textContent=title;
  document.getElementById('confirmText').innerHTML=html;
  var btn=document.getElementById('confirmOk');
  var nb=btn.cloneNode(true); btn.parentNode.replaceChild(nb,btn);
  nb.addEventListener('click',function(){ closeModal('confirmModal'); onOk(); });
  openModal('confirmModal');
}
function openDrawer(){ document.getElementById('drawerOverlay').classList.add('active'); document.getElementById('rpDrawer').classList.add('active'); }
function closeDrawer(){ document.getElementById('drawerOverlay').classList.remove('active'); document.getElementById('rpDrawer').classList.remove('active'); }
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ document.querySelectorAll('.modal-overlay.active').forEach(function(o){ closeModal(o.id); }); closeDrawer(); }
});
document.querySelectorAll('.modal-overlay').forEach(function(o){
  o.addEventListener('click',function(e){ if(e.target===o) closeModal(o.id); });
});

/* ---------- 配置 ---------- */
function defaultConfig(){
  return { url:'https://hnspjg.example.gov.cn/openapi/v2', entCode:'91430100MA4L2X8K3B', certExpire:FS.at(180,'00:00').slice(0,10) };
}
function loadConfig(){
  try{
    var c=JSON.parse(localStorage.getItem(REG_KEY)||'null');
    if(c && c.url) return Object.assign(defaultConfig(),c);
  }catch(e){}
  return defaultConfig();
}
function renderConfig(){
  var c=loadConfig();
  document.getElementById('cfgUrl').value=c.url;
  document.getElementById('cfgEnt').value=c.entCode;
  document.getElementById('cfgCert').value=c.certExpire;
  var days=Math.ceil((new Date(c.certExpire+'T00:00:00')-new Date())/86400000);
  var hint=document.getElementById('cfgHint');
  if(isNaN(days)) hint.textContent='配置保存于本机（mushroom_reg_config）。';
  else if(days<0) hint.innerHTML='<span style="color:#ff4d4f;font-weight:600;">证书已过期 '+(-days)+' 天，请立即更新！</span>';
  else if(days<30) hint.innerHTML='<span style="color:#fa8c16;font-weight:600;">证书剩余 '+days+' 天，请及时续期。</span>';
  else hint.textContent='证书剩余 '+days+' 天 · 配置保存于本机（mushroom_reg_config）。';
}
function saveConfig(){
  var url=document.getElementById('cfgUrl').value.trim();
  var ent=document.getElementById('cfgEnt').value.trim();
  var cert=document.getElementById('cfgCert').value;
  if(!url||!/^https?:\/\/.+/.test(url)){ showToast('请填写合法的平台地址（http/https）','error'); return; }
  if(!/^[0-9A-Z]{18}$/.test(ent)){ showToast('企业编码应为 18 位统一社会信用代码','error'); return; }
  if(!cert){ showToast('请选择证书有效期','error'); return; }
  localStorage.setItem(REG_KEY,JSON.stringify({ url:url, entCode:ent, certExpire:cert }));
  opLog('保存监管对接配置',ent);
  renderConfig();
  showToast('对接配置已保存','success');
}

/* ---------- 回执 ---------- */
function nextReceipt(){
  var mmdd=FS.dayKey(0).slice(5).replace('-','');
  var prefix='湘监收〔2026〕'+mmdd+'-';
  var n=1;
  var used={};
  FS.list('regulatory').forEach(function(r){ if(r.receipt) used[r.receipt]=true; });
  while(used[prefix+pad(n)]) n++;
  return prefix+pad(n);
}
function checkDeadLetterClosed(){
  var dead=FS.list('regulatory').filter(function(r){ return r.status==='死信'; }).length;
  if(dead===0 && window.FungiAlertData){
    var a=FungiAlertData.get('FA-261115-08');
    if(a && a.status!=='closed'){
      FungiAlertData.update('FA-261115-08',{ status:'closed' });
      showToast('死信队列已清零，预警「监管上报回执异常」自动闭环','success');
      opLog('闭环预警','FA-261115-08 监管上报回执异常');
    }
  }
}

/* ---------- 统计 ---------- */
function renderStats(){
  var rows=FS.list('regulatory');
  var today=FS.dayKey(0);
  var todayRows=rows.filter(function(r){ return String(r.time).slice(0,10)===today; });
  var ok=rows.filter(function(r){ return r.status==='成功'; }).length;
  var dead=rows.length-ok;
  document.getElementById('stToday').textContent=todayRows.length;
  document.getElementById('stTotal').textContent='累计报文 '+rows.length+' 条';
  document.getElementById('stRate').textContent=rows.length?(ok/rows.length*100).toFixed(1)+'%':'—';
  document.getElementById('stDead').textContent=dead;
  var latest=rows.filter(function(r){ return r.status==='成功'&&r.receipt&&r.receipt!=='—'; })
    .sort(function(a,b){ return String(b.time).localeCompare(String(a.time)); })[0];
  document.getElementById('stReceipt').textContent=latest?latest.receipt:'暂无回执';
  document.getElementById('stReceiptTime').textContent=latest?latest.time:'—';
}

/* ---------- 列表 ---------- */
var sortDesc=true, selected={};
var Pagination={
  currentPage:1,pageSize:10,filteredData:[],
  updateData:function(data){ this.filteredData=data; this.currentPage=1; this.render(); },
  goToPage:function(p){ var tp=Math.max(1,Math.ceil(this.filteredData.length/this.pageSize)); if(p<1||p>tp) return; this.currentPage=p; this.render(); },
  render:function(){
    var total=this.filteredData.length, tp=Math.max(1,Math.ceil(total/this.pageSize));
    if(this.currentPage>tp) this.currentPage=tp;
    var start=(this.currentPage-1)*this.pageSize;
    var rows=this.filteredData.slice(start,start+this.pageSize);
    var tbody=document.getElementById('dataTableBody');
    tbody.innerHTML=rows.length?rows.map(function(r,i){ return renderRow(r,start+i+1); }).join('')
      :'<tr class="empty-row"><td colspan="10">暂无符合条件的报文，点击「手动上报」生成</td></tr>';
    var html='<div class="pagination">';
    html+='<button class="page-btn '+(this.currentPage<=1?'disabled':'')+'" onclick="Pagination.goToPage('+(this.currentPage-1)+')">‹</button>';
    for(var i=1;i<=tp;i++){
      if(i===1||i===tp||Math.abs(i-this.currentPage)<=1) html+='<button class="page-btn '+(i===this.currentPage?'active':'')+'" onclick="Pagination.goToPage('+i+')">'+i+'</button>';
      else if(Math.abs(i-this.currentPage)===2) html+='<span style="padding:0 6px;color:#9aa5b1;">…</span>';
    }
    html+='<button class="page-btn '+(this.currentPage>=tp?'disabled':'')+'" onclick="Pagination.goToPage('+(this.currentPage+1)+')">›</button>';
    html+='<span style="margin-left:14px;font-size:13px;color:#6b7b6b;">第 '+this.currentPage+' / '+tp+' 页 · 共 '+total+' 条</span></div>';
    document.getElementById('pagination-container').innerHTML=html;
    syncCheckAll();
  }
};
function currentFiltered(){
  var t=document.getElementById('typeSelect').value;
  var s=document.getElementById('statusSelect').value;
  var kw=document.getElementById('kwInput').value.trim().toLowerCase();
  var rows=FS.list('regulatory').filter(function(r){
    if(t && r.type!==t) return false;
    if(s && r.status!==s) return false;
    if(kw && r.id.toLowerCase().indexOf(kw)<0 && String(r.batch).toLowerCase().indexOf(kw)<0 && String(r.receipt||'').toLowerCase().indexOf(kw)<0) return false;
    return true;
  });
  rows.sort(function(a,b){ var r=String(a.time).localeCompare(String(b.time)); return sortDesc?-r:r; });
  return rows;
}
function applyFilter(notify){
  var rows=currentFiltered();
  Pagination.updateData(rows);
  document.getElementById('filterInfo').textContent='筛选结果 '+rows.length+' 条';
  if(notify) showToast('找到 '+rows.length+' 条报文','info');
}
function resetSearch(){
  ['typeSelect','statusSelect'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('kwInput').value='';
  applyFilter(false); showToast('已重置筛选条件','info');
}
function toggleSort(){ sortDesc=!sortDesc; document.getElementById('sortArrow').textContent=sortDesc?'↓':'↑'; applyFilter(false); }
function statusPill(s){
  return s==='成功'
    ? '<span style="display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f;">成功</span>'
    : '<span style="display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:#fff1f0;color:#ff4d4f;border:1px solid #ffa39e;">死信</span>';
}
function renderRow(r,seq){
  var acts='';
  if(r.status==='死信') acts+='<button class="action-btn" style="color:#fa8c16;" onclick="resendOne(\''+esc(r.id)+'\')">重发</button>';
  acts+='<button class="action-btn detail" onclick="viewDetail(\''+esc(r.id)+'\')">报文</button>';
  acts+='<button class="action-btn" style="color:#ff4d4f;" onclick="deleteOne(\''+esc(r.id)+'\')">删除</button>';
  return '<tr>'+
    '<td><input type="checkbox" '+(selected[r.id]?'checked':'')+' onchange="toggleRow(\''+esc(r.id)+'\',this.checked)" aria-label="勾选"></td>'+
    '<td>'+seq+'</td>'+
    '<td><strong class="mono">'+esc(r.id)+'</strong></td>'+
    '<td class="mono">'+esc(r.batch)+'</td>'+
    '<td>'+esc(r.type)+'</td>'+
    '<td>'+r.count+'</td>'+
    '<td>'+esc(r.time)+'</td>'+
    '<td class="mono" style="font-size:12px;">'+esc(r.receipt||'—')+'</td>'+
    '<td>'+statusPill(r.status)+'</td>'+
    '<td><div class="action-btns">'+acts+'</div></td></tr>';
}
function toggleRow(id,on){ if(on) selected[id]=true; else delete selected[id]; syncBulk(); }
function toggleAll(on){
  Pagination.filteredData.slice((Pagination.currentPage-1)*Pagination.pageSize,Pagination.currentPage*Pagination.pageSize).forEach(function(r){
    if(on) selected[r.id]=true; else delete selected[r.id];
  });
  Pagination.render(); syncBulk();
}
function syncCheckAll(){
  var rows=Pagination.filteredData.slice((Pagination.currentPage-1)*Pagination.pageSize,Pagination.currentPage*Pagination.pageSize);
  document.getElementById('checkAll').checked=rows.length>0 && rows.every(function(r){ return selected[r.id]; });
}
function syncBulk(){
  var n=Object.keys(selected).length;
  document.getElementById('bulkCount').textContent=n;
  document.getElementById('bulkBar').classList.toggle('show',n>0);
}
function clearSelection(){ selected={}; Pagination.render(); syncBulk(); }
function removeRecords(ids){
  var removed=[];
  ids.forEach(function(id){
    var idx=FS.list('regulatory').findIndex(function(x){ return x.id===id; });
    var obj=FS.remove('regulatory',id);
    if(obj) removed.push({obj:obj,idx:idx});
    delete selected[id];
  });
  refresh();
  showToast('已删除 '+removed.length+' 条报文','warning',function(){
    removed.sort(function(a,b){ return a.idx-b.idx; }).forEach(function(r){ FS.restore('regulatory',r.obj,r.idx); });
    refresh(); showToast('已撤销删除','success');
  });
  opLog('删除监管报文',ids.join('、'));
}
function bulkDelete(){
  var ids=Object.keys(selected); if(!ids.length) return;
  askConfirm('批量删除报文','即将删除勾选的 <strong>'+ids.length+'</strong> 条报文记录（监管平台已收数据不受影响），可撤销。是否继续？',function(){ removeRecords(ids); });
}
function deleteOne(id){
  askConfirm('删除报文记录','确定删除报文 <strong class="mono">'+esc(id)+'</strong> 吗？删除后可撤销。',function(){ removeRecords([id]); });
}

/* ---------- 重发 ---------- */
function resendOne(id){
  var r=FS.get('regulatory',id); if(!r) return;
  var receipt=nextReceipt();
  FS.update('regulatory',id,{ status:'成功', receipt:receipt, time:nowStr() });
  opLog('死信重发',id+' → '+receipt);
  refresh();
  showToast('重发成功：'+id+' · 回执 '+receipt,'success');
  checkDeadLetterClosed();
}
function resendAllDead(){
  var dead=FS.list('regulatory').filter(function(r){ return r.status==='死信'; });
  if(!dead.length){ showToast('死信队列为空，无需重发','info'); return; }
  askConfirm('死信全部重发','死信队列共 <strong>'+dead.length+'</strong> 条报文，将逐条重发并获取监管回执。是否继续？',function(){
    dead.forEach(function(r){
      FS.update('regulatory',r.id,{ status:'成功', receipt:nextReceipt(), time:nowStr() });
    });
    opLog('死信全部重发',dead.length+' 条');
    refresh();
    showToast('已重发 '+dead.length+' 条死信报文','success');
    checkDeadLetterClosed();
  });
}

/* ---------- 手动上报 ---------- */
function openReportModal(){
  var sel=document.getElementById('rpBatch');
  sel.innerHTML='<option value="">请选择批次</option>'+FS.list('batches').map(function(b){
    return '<option value="'+esc(b.id)+'">'+esc(b.id)+' · '+esc(b.variety)+'</option>';
  }).join('');
  document.getElementById('rpType').value='';
  document.getElementById('rpCount').value=1;
  openModal('reportModal');
}
function confirmReport(){
  var batch=document.getElementById('rpBatch').value;
  var type=document.getElementById('rpType').value;
  var count=Math.floor(Number(document.getElementById('rpCount').value));
  if(!batch){ showToast('请选择生产批次','error'); return; }
  if(!type){ showToast('请选择报文类型','error'); return; }
  if(!count||count<1||count>500){ showToast('记录数需在 1-500 之间','error'); return; }
  var rec=FS.add('regulatory',{ type:type, batch:batch, count:count, status:'成功', receipt:nextReceipt(), time:nowStr() });
  closeModal('reportModal');
  opLog('手动上报监管',rec.id+' · '+type);
  refresh();
  showToast('上报成功：'+rec.id+' · 回执 '+rec.receipt,'success');
}

/* ---------- 抽屉 JSON 预览 ---------- */
function jsonHighlight(obj){
  var json=JSON.stringify(obj,null,2);
  return esc(json)
    .replace(/(&quot;[^&]*?&quot;)(\s*:)/g,'<span class="json-key">$1</span>$2')
    .replace(/:\s*(&quot;.*?&quot;)/g,': <span class="json-str">$1</span>')
    .replace(/:\s*(\d+\.?\d*)/g,': <span class="json-num">$1</span>');
}
function viewDetail(id){
  var r=FS.get('regulatory',id); if(!r) return;
  var cfg=loadConfig();
  var batch=FS.list('batches').filter(function(b){ return b.id===r.batch; })[0];
  var chain=FS.list('chain').filter(function(c){ return c.batch===r.batch; })[0];
  var nodesDone=chain?Object.keys(chain.nodes).filter(function(k){ return chain.nodes[k]!=null; }).length:0;
  document.getElementById('drawerTitle').textContent='报文详情 · '+r.id;
  var payload={
    reportId:r.id,
    platform:cfg.url,
    entCode:cfg.entCode,
    reportType:r.type,
    batch:{
      batchNo:r.batch,
      variety:batch?batch.variety:null,
      strain:batch?batch.strain:null,
      bags:batch?batch.bags:null,
      chainNodesDone:nodesDone+'/9'
    },
    recordCount:r.count,
    sendTime:r.time,
    status:r.status==='成功'?'ACK':'DEAD_LETTER',
    receipt:r.receipt&&r.receipt!=='—'?r.receipt:null,
    sign:'SM2withSM3 · 企业证书（演示）'
  };
  document.getElementById('drawerBody').innerHTML=
    '<div class="detail-grid"><span class="detail-label">报文号</span><span class="detail-value mono">'+esc(r.id)+'</span></div>'+
    '<div class="detail-grid"><span class="detail-label">批次 / 类型</span><span class="detail-value mono">'+esc(r.batch)+' · '+esc(r.type)+'</span></div>'+
    '<div class="detail-grid"><span class="detail-label">状态</span><span class="detail-value">'+statusPill(r.status)+'</span></div>'+
    '<div class="detail-grid"><span class="detail-label">监管回执</span><span class="detail-value mono">'+esc(r.receipt||'—')+'</span></div>'+
    '<div class="detail-grid"><span class="detail-label">上报时间</span><span class="detail-value">'+esc(r.time)+'</span></div>'+
    '<div style="margin:14px 0 8px;font-size:13px;font-weight:600;color:var(--text-primary);">报文 JSON 预览</div>'+
    '<pre class="json-pre">'+jsonHighlight(payload)+'</pre>'+
    (r.status==='死信'?'<div style="margin-top:12px;font-size:12px;color:#ff4d4f;line-height:1.7;">死信原因：监管平台网关超时（演示），报文已进入死信队列，重发后将重新获取回执。</div>':'');
  var f='<button class="jg-btn" onclick="copyJson(\''+esc(r.id)+'\')">复制 JSON</button>';
  if(r.status==='死信') f+='<button class="jg-btn jg-btn-primary" onclick="closeDrawer();resendOne(\''+esc(r.id)+'\')">重发报文</button>';
  document.getElementById('drawerFooter').innerHTML=f;
  window.__currentPayload=payload;
  openDrawer();
}
function copyJson(){
  var text=JSON.stringify(window.__currentPayload||{},null,2);
  function done(){ showToast('报文 JSON 已复制','success'); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,function(){ fallback(); });
  }else fallback();
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ showToast('复制失败，请手动选择复制','warning'); }
    ta.remove();
  }
}

/* ---------- 导出 ---------- */
function exportCSV(){
  var rows=Pagination.filteredData;
  if(!rows.length){ showToast('当前没有可导出的数据','warning'); return; }
  var head=['报文号','批次号','类型','记录数','上报时间','回执','状态'];
  var lines=[head.join(',')].concat(rows.map(function(r){
    return [r.id,r.batch,r.type,r.count,r.time,r.receipt||'',r.status].map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(',');
  }));
  var blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='监管报文_'+FS.dayKey(0)+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1500);
  opLog('导出监管报文CSV',rows.length+' 条');
  showToast('已导出 '+rows.length+' 条报文','success');
}

function refresh(){ renderStats(); applyFilter(false); }
document.addEventListener('DOMContentLoaded',function(){
  renderConfig();
  ['typeSelect','statusSelect'].forEach(function(id){ document.getElementById(id).addEventListener('change',function(){ applyFilter(false); }); });
  document.getElementById('kwInput').addEventListener('input',function(){ applyFilter(false); });
  window.addEventListener('fungiStoreChange',function(){ renderStats(); });
  refresh();
});
