<style>
  .search-input { flex:1; min-width:220px; }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:999; backdrop-filter:blur(4px); }
  .modal-overlay.show { display:block; }
  .modal-box { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:var(--bg-card); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.15);
    width:640px; max-width:94vw; max-height:88vh; overflow-y:auto; z-index:1000; animation:modalSlideIn .25s ease-out; padding:20px 24px; }
  .modal-box.show { display:block; }
  @keyframes modalSlideIn { from{opacity:0;transform:translate(-50%,-50%) scale(.95)} to{opacity:1;transform:translate(-50%,-50%) scale(1)} }
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;
    padding-bottom:16px; border-bottom:1px solid var(--border-light); }
  .modal-header h3 { font-size:16px; font-weight:600; color:var(--text-primary); margin:0; }
  .modal-close { width:28px; height:28px; border:none; background:var(--gray-100); border-radius:6px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .modal-close:hover { background:var(--error-bg); color:var(--error); }
  .modal-body { padding:0 4px; }
  .modal-footer { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; padding:16px 0 0;
    border-top:1px solid var(--border-light); }
  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-size:13px; font-weight:500; color:var(--text-secondary); margin-bottom:8px; }
  .form-group label.required::after { content:' *'; color:var(--error); }
  .form-group input, .form-group select { width:100%; padding:10px;
    border:1px solid var(--border-default); border-radius:8px; font-size:13px; box-sizing:border-box; }
  .form-group input:focus, .form-group select:focus { outline:none; border-color:var(--primary-400); box-shadow:0 0 0 3px rgba(24,144,255,.1); }
  .form-row { display:flex; gap:16px; }
  .form-row > .form-group { flex:1; }
  .form-check { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-primary); padding:10px 0; }
  .form-check input { width:auto; }

  .drawer-mask { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:998; opacity:0; visibility:hidden; transition:all .25s; }

  .drawer { position:fixed; top:0; right:0; bottom:0; width:560px; max-width:94vw; background:var(--bg-card); z-index:999;
    transform:translateX(102%); transition:transform .25s ease; box-shadow:-8px 0 30px rgba(0,0,0,.12); display:flex; flex-direction:column; }
  .drawer.show { transform:none; }
  .drawer-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border-light); }
  .drawer-header h3 { margin:0; font-size:15px; font-weight:600; color:var(--text-primary); }
  .drawer-body { flex:1; overflow-y:auto; padding:16px 20px; }
  .drawer-section { font-weight:600; font-size:13px; color:var(--text-primary); margin:18px 0 8px; }
  .drawer-section:first-child { margin-top:0; }
  .detail-info { padding:12px; background:linear-gradient(135deg,var(--gray-50),var(--gray-100));
    border-radius:12px; margin-bottom:12px; border:1px solid var(--border-default); }
  .detail-row { display:flex; padding:9px 0; border-bottom:1px dashed var(--border-default); font-size:13px; }
  .detail-row:last-child { border-bottom:none; }
  .detail-label { width:104px; color:var(--text-tertiary); flex-shrink:0; }
  .detail-value { flex:1; color:var(--text-primary); word-break:break-all; }

  .level-tag { display:inline-block; padding:2px 8px; border-radius:var(--radius-sm); font-size:11.5px; font-weight:500; white-space:nowrap; }
  .level-tag.level-urgent { background:var(--error-bg); color:#cf1322; border:1px solid #ffccc7; }
  .level-tag.level-important { background:var(--warning-bg); color:#ad6800; border:1px solid var(--warning-border); }
  .level-tag.level-reminder { background:var(--info-bg); color:var(--primary-600); border:1px solid var(--info-border); }
  .level-tag.level-notice { background:var(--gray-100); color:var(--text-secondary); border:1px solid var(--border-default); }
  .status-tag { display:inline-flex; align-items:center; padding:3px 10px; font-size:11.5px;
    font-weight:500; border-radius:20px; white-space:nowrap; }
  .status-tag.online { background:#d9f7be; color:#3a8618; border:1px solid #b7eb8f; }
  .status-tag.offline { background:var(--error-bg); color:#cf1322; border:1px solid #ffccc7; }
  .status-tag.idle { background:var(--gray-100); color:var(--text-secondary); border:1px solid var(--border-default); }
  .cond-text { font-variant-numeric:tabular-nums; font-weight:600; color:var(--text-primary); }

  .switch { position:relative; display:inline-block; width:40px; height:22px; vertical-align:middle; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; cursor:pointer; inset:0; background:var(--gray-300,#d9d9d9); border-radius:22px; transition:.2s; }
  .slider::before { content:''; position:absolute; height:16px; width:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + .slider { background:#52c41a; }

  .action-btns { display:flex; gap:6px; flex-wrap:nowrap; }

  .action-btn.edit { color:var(--primary-600); background:var(--gray-50); border-color:var(--border-default); }

  .stat-card-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:16px; }
  .stat-card-row .stat-card { margin-top:0 !important; cursor:default; }
  .stat-card-row .stat-card:hover { transform:none; box-shadow:0 1px 3px rgba(0,0,0,.04); }

  .stat-value { font-size:26px; font-weight:700; color:var(--text-primary); font-variant-numeric:tabular-nums; }

  .empty-row td { text-align:center; color:var(--text-tertiary); padding:40px 0; }
  .selected-info { font-size:12.5px; color:var(--text-tertiary); margin-left:auto; }
  .selected-info strong { color:var(--primary-600); }

  .pv-item { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--border-light);

  .pv-item .pv-sub { color:var(--text-tertiary); font-size:11.5px; margin-top:2px; }

<script>
/* ============================================================
 * 预警设置（规则台账 + 启用开关 + 越限预览）
 * 数据源：FungiStore.rules；实时值 FungiStore.envCurrent / stats。
 * store 无 name 字段：规则名按指标推导（NAME_MAP），新建/编辑时
 * 作为页内补充字段写入。越限预览按规则指标对适用区逐区计算：
 *   CO₂/湿度/温度 → envCurrent；污染率 → stats().pollutionGF04；
 *   设备离线时长 → devices 离线台数（时长自对应预警时间推导）；
 *   层间温差 → 预警 FA-261116-05 描述值 0.9°C（store 无层间传感数据）。
 * 今日触发估算 = 启用规则按当前实时值命中的区数合计。
 * ============================================================ */
var FS = window.FungiStore;
var FAD = window.FungiAlertData;
var esc = DeviceUI.esc;
var LEVEL_TEXT = { urgent:'紧急', important:'重要', reminder:'提醒', notice:'通知' };
var LEVEL_ORDER = { urgent:0, important:1, reminder:2, notice:3 };
var NAME_MAP = {
  'CO₂ 浓度':'CO₂ 浓度上限', '温度区间':'温度区间偏离', '相对湿度':'相对湿度下限',
  '污染率':'污染率上限', '设备离线时长':'设备离线时长', '层间温差':'层间温差上限',
  '预冷区温度':'预冷区温度上限', '光照强度':'光照强度上限'
};
var TEMP_RANGE = { 'GF-01':[15,20], 'GF-05':[15,20], 'GF-02':[14,18], 'GF-06':[14,18], 'GF-03':[10,14], 'GF-04':[12,18] };
var editingId = '';
var sortKey = 'id', sortDir = 1;
var selected = {};

function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function ruleName(r){ return r.name || NAME_MAP[r.metric] || (r.metric + ' 预警'); }
function levelTag(l){ return '<span class="level-tag level-' + l + '">' + (LEVEL_TEXT[l] || l) + '</span>'; }
function condText(r){ return '<span class="cond-text">' + esc(r.op) + ' ' + esc(r.threshold) + esc(r.unit || '') + '</span>'; }
function gfRooms(){ return FS.envRooms.filter(function(r){ return /^GF-/.test(r); }); }
function undoToast(msg, fn){
  var c = document.querySelector('.toast-container');
  if (!c){ c = document.createElement('div'); c.className = 'toast-container';
    c.style.cssText = 'position:fixed;top:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;'; document.body.appendChild(c); }
  var t = document.createElement('div'); t.className = 'jg-toast success';
  t.innerHTML = '<span class="jg-toast-icon">✓</span><span class="jg-toast-message">' + esc(msg) + '</span>';
  var b = document.createElement('button'); b.textContent = '撤销';
  b.style.cssText = 'margin-left:10px;padding:2px 10px;border:1px solid currentColor;border-radius:6px;background:none;color:inherit;cursor:pointer;font-size:12px;flex-shrink:0;';
  b.onclick = function(){ fn(); t.remove(); DeviceUI.toast('已撤销', 'info'); };
  t.appendChild(b); c.appendChild(t);
  setTimeout(function(){ if (t.parentNode){ t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(function(){ t.remove(); }, 300); } }, 6000);
}
function openDrawer(title, html){
  document.getElementById('drawerTitle').textContent = title;
  document.getElementById('drawerBody').innerHTML = html;
  document.getElementById('drawer').classList.add('show');
  document.getElementById('drawerMask').classList.add('show');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('drawerMask').classList.remove('show');
}

/* ---------- 越限预览引擎 ---------- */
function cmp(op, v, t){
  if (op === '>') return v > t;
  if (op === '≥') return v >= t;
  if (op === '<') return v < t;
  if (op === '≤') return v <= t;
  return false;
}
function scopeRooms(scope){
  if (scope === '全部出菇房') return gfRooms();
  if (scope === '层架菇房') return ['GF-05'];
  if (scope === '分品种配方') return gfRooms();
  if (FS.envRooms.indexOf(scope) >= 0) return [scope];
  return FS.envRooms;
}
function previewRule(r){
  var out = [];
  var th = parseFloat(String(r.threshold).replace('±',''));
  if (r.metric === 'CO₂ 浓度'){
    scopeRooms(r.scope).forEach(function(room){
      var v = FS.envCurrent(room).co2;
      out.push({ zone: room, value: v + ' ppm', hit: cmp(r.op, v, th), note: '实时 CO₂ 浓度' });
    });
  } else if (r.metric === '相对湿度'){
    scopeRooms(r.scope).forEach(function(room){
      var v = FS.envCurrent(room).hum;
      out.push({ zone: room, value: v + ' %', hit: cmp(r.op, v, th), note: '实时相对湿度' });
    });
  } else if (r.metric === '温度区间'){
    var tol = isNaN(th) ? 2 : th;
    gfRooms().forEach(function(room){
      var range = TEMP_RANGE[room] || [15,20];
      var v = FS.envCurrent(room).temp;
      var hit = v < range[0] - tol || v > range[1] + tol;
      out.push({ zone: room, value: v + ' °C', hit: hit, note: '配方 ' + range[0] + '–' + range[1] + '°C · 容差 ±' + tol + '°C' });
    });
  } else if (r.metric === '预冷区温度'){
    var room = r.scope === 'YL-01' ? 'YL-01' : 'YL-01';
    var v = FS.envCurrent(room).temp;
    out.push({ zone: room, value: v + ' °C', hit: cmp(r.op, v, th), note: '预冷区实时温度' });
  } else if (r.metric === '污染率'){
    var p = FS.stats().pollutionGF04;
    out.push({ zone: 'PY-01 培养车间', value: p + ' %', hit: cmp(r.op, p, th), note: 'GF-04 批次污染率（stats 推导）' });
  } else if (r.metric === '设备离线时长'){
    var offline = FS.list('devices').filter(function(d){ return d.status === '离线'; });
    if (!offline.length){
      out.push({ zone: '全部设备', value: '0 台离线', hit: false, note: '当前无离线设备' });
    } else {
      offline.forEach(function(d){
        var alert = FAD.list().filter(function(a){ return a.source === 'device' && a.title.indexOf(d.name.replace(/^\d+号/, '')) >= 0 || (a.source === 'device' && a.title.indexOf('加湿器离线') >= 0 && d.type === '加湿器'); })[0];
        var mins = null;
        if (alert){
          var t = new Date(String(alert.time).replace(' ', 'T') + ':00');
          if (!isNaN(t)) mins = Math.round((Date.now() - t.getTime()) / 60000);
        }
        var hit = mins != null ? cmp(r.op, mins, th) : true;
        out.push({ zone: d.id + ' ' + d.name, value: mins != null ? mins + ' min' : '≥' + th + ' min（估）', hit: hit,
          note: mins != null ? '离线时长自预警 ' + alert.id + ' 触发时间推导' : '无对应预警时间，按超阈值估算' });
      });
    }
  } else if (r.metric === '层间温差'){
    var a = FAD.get('FA-261116-05');
    var diff = 0.9;
    if (a && a.desc){ var m = /温差\s*([\d.]+)/.exec(a.desc); if (m) diff = parseFloat(m[1]); }
    out.push({ zone: 'GF-05 层架菇房', value: diff + ' °C', hit: cmp(r.op, diff, th), note: '层间温差自预警 FA-261116-05 描述推导（store 无层间传感数据）' });
  } else if (r.metric === '光照强度'){
    scopeRooms(r.scope).forEach(function(room){
      var v = FS.envCurrent(room).light;
      out.push({ zone: room, value: v + ' lx', hit: cmp(r.op, v, th), note: '实时光照强度' });
    });
  } else {
    out.push({ zone: r.scope, value: '—', hit: false, note: '该指标暂无实时数据源，无法预览' });
  }
  return out;
}

/* ---------- 统计卡 ---------- */
function renderStats(){
  var rules = FS.list('rules');
  var enabled = rules.filter(function(r){ return r.enabled; });
  var hits = 0;
  enabled.forEach(function(r){ previewRule(r).forEach(function(p){ if (p.hit) hits++; }); });
  document.getElementById('statCards').innerHTML =
    '<div class="stat-card"><div class="stat-label">规则总数</div><div class="stat-value">' + rules.length + '<span class="unit">条</span></div>' +
    '<div class="stat-sub">环境 / 设备 / 污染全覆盖</div></div>' +
    '<div class="stat-card"><div class="stat-label">已启用</div><div class="stat-value" style="color:#52c41a;">' + enabled.length + '<span class="unit">条</span></div>' +
    '<div class="stat-sub">实时监测生效中</div></div>' +
    '<div class="stat-card"><div class="stat-label">今日触发估算</div><div class="stat-value" style="color:' + (hits ? '#fa8c16' : 'inherit') + ';">' + hits + '<span class="unit">区次</span></div>' +
    '<div class="stat-sub warn">按当前实时值对启用规则逐区计算</div></div>' +
    '<div class="stat-card"><div class="stat-label">已停用</div><div class="stat-value" style="color:' + (rules.length - enabled.length ? '#8c8c8c' : 'inherit') + ';">' + (rules.length - enabled.length) + '<span class="unit">条</span></div>' +
    '<div class="stat-sub">停用规则不参与触发</div></div>';
}

/* ---------- 筛选 / 排序 ---------- */
function ruleFiltered(){
  var level = document.getElementById('levelSelect').value;
  var en = document.getElementById('enabledSelect').value;
  var kw = document.getElementById('searchInput').value.trim().toLowerCase();
  var list = FS.list('rules').filter(function(r){
    if (level && r.level !== level) return false;
    if (en === 'on' && !r.enabled) return false;
    if (en === 'off' && r.enabled) return false;
    if (kw){
      var hay = [r.id, ruleName(r), r.metric, r.scope, r.channel].join(' ').toLowerCase();
      if (hay.indexOf(kw) < 0) return false;
    }
    return true;
  });
  list.sort(function(a,b){
    if (sortKey === 'level') return ((LEVEL_ORDER[a.level] != null ? LEVEL_ORDER[a.level] : 9) - (LEVEL_ORDER[b.level] != null ? LEVEL_ORDER[b.level] : 9)) * sortDir;
    return String(a[sortKey] || '').localeCompare(String(b[sortKey] || ''), 'zh-CN') * sortDir;
  });
  return list;
}
function setSort(key){
  if (sortKey === key) sortDir = -sortDir; else { sortKey = key; sortDir = 1; }
  renderRules();
}
function resetFilter(){
  document.getElementById('levelSelect').value = '';
  document.getElementById('enabledSelect').value = '';
  document.getElementById('searchInput').value = '';
  renderRules();
  DeviceUI.toast('已重置筛选条件', 'info');
}

/* ---------- 规则表 ---------- */
function renderRules(){
  var list = ruleFiltered();
  var body = document.getElementById('ruleBody');
  if (!list.length){
    body.innerHTML = '<tr class="empty-row"><td colspan="10">暂无符合条件的预警规则</td></tr>';
  } else {
    body.innerHTML = list.map(function(r){
      return '<tr class="clickable' + (r.enabled ? '' : ' rule-disabled') + '" onclick="openRuleDrawer(\'' + esc(r.id) + '\')">' +
        '<td style="text-align:center;" onclick="event.stopPropagation();"><input type="checkbox" ' + (selected[r.id] ? 'checked' : '') + ' onclick="toggleOne(\'' + esc(r.id) + '\',this)"></td>' +
        '<td><strong>' + esc(r.id) + '</strong></td>' +
        '<td>' + esc(ruleName(r)) + '</td>' +
        '<td>' + esc(r.metric) + '</td>' +
        '<td>' + condText(r) + '</td>' +
        '<td>' + levelTag(r.level) + '</td>' +
        '<td>' + esc(r.scope) + '</td>' +
        '<td>' + esc(r.channel || '站内') + '</td>' +
        '<td onclick="event.stopPropagation();"><label class="switch"><input type="checkbox" ' + (r.enabled ? 'checked' : '') + ' onchange="toggleEnabled(\'' + esc(r.id) + '\',this.checked)"><span class="slider"></span></label></td>' +
        '<td onclick="event.stopPropagation();"><div class="action-btns">' +
          '<button class="action-btn detail" onclick="openRuleDrawer(\'' + esc(r.id) + '\')">预览</button>' +
          '<button class="action-btn edit" onclick="openRuleModal(\'' + esc(r.id) + '\')">编辑</button>' +
          '<button class="action-btn del" onclick="deleteRule(\'' + esc(r.id) + '\')">删除</button>' +
        '</div></td></tr>';
    }).join('');
  }
  ['id','level'].forEach(function(k){
    document.getElementById('ar-' + k).textContent = sortKey === k ? (sortDir > 0 ? '▲' : '▼') : '';
  });
  var all = document.getElementById('checkAll');
  all.checked = list.length > 0 && list.every(function(x){ return selected[x.id]; });
  renderSelected();
}
function toggleOne(id, box){ if (box.checked) selected[id] = true; else delete selected[id]; renderSelected(); }
function toggleAll(box){
  ruleFiltered().forEach(function(x){ if (box.checked) selected[x.id] = true; else delete selected[x.id]; });
  renderRules();
}
function renderSelected(){
  var ids = Object.keys(selected);
  var btn = document.getElementById('bulkDelBtn');
  btn.disabled = !ids.length;
  btn.textContent = ids.length ? '批量删除（' + ids.length + '）' : '批量删除';
  document.getElementById('selectedInfo').innerHTML = ids.length ? '已选 <strong>' + ids.length + '</strong> 条规则' : '';
}
function toggleEnabled(id, on){
  FS.update('rules', id, { enabled: on });
  DeviceUI.toast('规则 ' + id + (on ? ' 已启用' : ' 已停用'), on ? 'success' : 'info');
  refreshAll();
}

/* ---------- CRUD ---------- */
function nextRuleId(){
  var max = 0;
  FS.list('rules').forEach(function(x){ var m = /^AR-(\d+)$/.exec(x.id); if (m) max = Math.max(max, +m[1]); });
  return 'AR-' + pad2(max + 1);
}
function openRuleModal(id){
  editingId = id || '';
  var r = id ? FS.get('rules', id) : null;
  document.getElementById('ruleTitle').textContent = r ? '编辑规则 · ' + r.id : '新增规则';
  document.getElementById('rId').value = r ? r.id : '';
  document.getElementById('rId').disabled = !!r;
  document.getElementById('rName').value = r ? ruleName(r) : '';
  document.getElementById('rMetric').value = r ? r.metric : 'CO₂ 浓度';
  document.getElementById('rScope').value = r ? r.scope : '全部出菇房';
  document.getElementById('rOp').value = r ? r.op : '>';
  document.getElementById('rThreshold').value = r ? r.threshold : '';
  document.getElementById('rUnit').value = r ? (r.unit || '') : 'ppm';
  document.getElementById('rLevel').value = r ? r.level : 'important';
  document.getElementById('rChannel').value = r ? (r.channel || '站内') : '站内';
  document.getElementById('rEnabled').checked = r ? !!r.enabled : true;
  document.getElementById('ruleOverlay').classList.add('show');
  document.getElementById('ruleModal').classList.add('show');
}
function closeRuleModal(){
  document.getElementById('ruleOverlay').classList.remove('show');
  document.getElementById('ruleModal').classList.remove('show');
  editingId = '';
}
function saveRule(){
  var name = document.getElementById('rName').value.trim();
  var threshold = document.getElementById('rThreshold').value.trim();
  if (!name){ DeviceUI.toast('请填写规则名称', 'error'); return; }
  if (!threshold){ DeviceUI.toast('请填写阈值', 'error'); return; }
  var op = document.getElementById('rOp').value;
  if (op !== '超出' && isNaN(parseFloat(threshold))){ DeviceUI.toast('数值条件的阈值必须为数字', 'error'); return; }
  var id = editingId || document.getElementById('rId').value.trim() || nextRuleId();
  if (!editingId && FS.get('rules', id)){ DeviceUI.toast('规则编号 ' + id + ' 已存在', 'error'); return; }
  var thVal = op === '超出' ? threshold : parseFloat(threshold);
  var patch = {
    name: name,
    metric: document.getElementById('rMetric').value,
    scope: document.getElementById('rScope').value,
    op: op, threshold: thVal,
    unit: document.getElementById('rUnit').value.trim(),
    level: document.getElementById('rLevel').value,
    channel: document.getElementById('rChannel').value,
    enabled: document.getElementById('rEnabled').checked
  };
  if (editingId){
    FS.update('rules', editingId, patch);
    DeviceUI.toast('规则已更新', 'success');
  } else {
    patch.id = id;
    FS.add('rules', patch);
    DeviceUI.toast('规则 ' + id + ' 已创建', 'success');
  }
  closeRuleModal(); refreshAll();
}
function deleteRule(id){
  var r = FS.get('rules', id);
  if (!r) return;
  DeviceUI.confirmDelete('确定删除规则「' + ruleName(r) + '（' + id + '）」吗？删除后可在提示中撤销。').then(function(ok){
    if (!ok) return;
    var list = FS.list('rules');
    var idx = list.findIndex(function(x){ return x.id === id; });
    FS.remove('rules', id);
    delete selected[id];
    refreshAll();
    undoToast('规则 ' + id + ' 已删除', function(){ FS.restore('rules', r, idx); refreshAll(); });
  });
}
function bulkDelete(){
  var ids = Object.keys(selected);
  if (!ids.length) return;
  DeviceUI.confirmDelete('确定删除选中的 ' + ids.length + ' 条规则吗？删除后可在提示中撤销。').then(function(ok){
    if (!ok) return;
    var list = FS.list('rules');
    var items = ids.map(function(id){
      return { obj: list.filter(function(x){ return x.id === id; })[0], idx: list.findIndex(function(x){ return x.id === id; }) };
    }).filter(function(x){ return x.obj; }).sort(function(a,b){ return a.idx - b.idx; });
    items.forEach(function(x){ FS.remove('rules', x.obj.id); });
    selected = {};
    refreshAll();
    undoToast('已删除 ' + items.length + ' 条规则', function(){
      items.forEach(function(x){ FS.restore('rules', x.obj, x.idx); });
      refreshAll();
    });
  });
}

/* ---------- 详情抽屉（越限预览） ---------- */
function openRuleDrawer(id){
  var r = FS.get('rules', id);
  if (!r) return;
  var rows = [
    ['规则编号', r.id], ['规则名称', ruleName(r)], ['监测指标', r.metric],
    ['触发条件', condText(r), 'raw'], ['级别', levelTag(r.level), 'raw'],
    ['适用区', r.scope], ['通知渠道', r.channel || '站内'],
    ['启用状态', r.enabled ? '<span class="status-tag online">已启用</span>' : '<span class="status-tag idle">已停用</span>', 'raw']
  ];
  var html = '<div class="drawer-section">规则配置</div><div class="detail-info">' +
    rows.map(function(x){
      return '<div class="detail-row"><span class="detail-label">' + x[0] + '</span><span class="detail-value">' + (x[2] === 'raw' ? x[1] : esc(x[1])) + '</span></div>';
    }).join('') + '</div>';
  var pv = previewRule(r);
  var hits = pv.filter(function(p){ return p.hit; }).length;
  html += '<div class="drawer-section">越限预览（按当前实时值） <span style="font-weight:500;color:' + (hits ? '#cf1322' : '#3a8618') + ';">' +
    (r.enabled ? (hits ? hits + ' 个区触发' : '全部未触发') : '规则已停用，仅供参考') + '</span></div>';
  html += pv.map(function(p){
    return '<div class="pv-item' + (p.hit && r.enabled ? ' hit' : '') + '">' +
      (p.hit && r.enabled ? '<span class="status-tag offline">触发</span>' : '<span class="status-tag online">正常</span>') +
      '<div class="pv-main"><div class="pv-zone">' + esc(p.zone) + ' · ' + esc(p.value) + '</div>' +
      '<div class="pv-sub">' + esc(p.note) + '</div></div></div>';
  }).join('');
  openDrawer('规则详情 · ' + ruleName(r), html);
}

/* ---------- 导出 ---------- */
function exportRules(){
  var headers = ['规则编号','规则名称','监测指标','条件','阈值','单位','级别','适用区','通知渠道','启用状态'];
  var rows = ruleFiltered().map(function(r){
    return [r.id, ruleName(r), r.metric, r.op, r.threshold, r.unit || '', LEVEL_TEXT[r.level] || r.level, r.scope, r.channel || '站内', r.enabled ? '启用' : '停用'];
  });
  DeviceUI.exportCsv('预警规则', headers, rows);
}

/* ---------- 刷新 / 初始化 ---------- */
function refreshAll(){ renderStats(); renderRules(); }
document.addEventListener('DOMContentLoaded', function(){
  var scopes = ['全部出菇房','分品种配方','培养车间','全部设备','层架菇房'].concat(FS.envRooms);
  DeviceUI.fillSelect('rScope', scopes, null);
  refreshAll();
  document.getElementById('searchInput').addEventListener('input', renderRules);
  ['levelSelect','enabledSelect'].forEach(function(id){
    document.getElementById(id).addEventListener('change', renderRules);
  });
});
</script>
