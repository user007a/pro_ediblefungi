<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工厂化农业数据管理系统 - 用户设置</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%2352c41a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .modal-overlay { position:fixed; inset:0; background:rgba(0,21,41,0.5); display:flex; align-items:center; justify-content:center; z-index:1200; opacity:0; visibility:hidden; transition:all .25s ease; }
  .modal-overlay.active { opacity:1; visibility:visible; }
  .modal { background:var(--bg-card); border-radius:16px; width:520px; max-width:92vw; max-height:90vh; overflow:hidden; transform:scale(.92); transition:all .25s ease; display:flex; flex-direction:column; }
  .modal-overlay.active .modal { transform:scale(1); }
  .modal-header { padding:18px 24px; border-bottom:1px solid var(--border-default); display:flex; align-items:center; justify-content:space-between; background:linear-gradient(135deg,#1890ff 0%,#52c41a 100%); color:#fff; flex-shrink:0; }
  .modal-header h3 { font-size:17px; font-weight:600; margin:0; color:#fff; }
  .modal-close { width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.2); border:none; color:#fff; cursor:pointer; font-size:16px; line-height:1; }
  .modal-close:hover { background:rgba(255,255,255,.32); }
  .modal-body { padding:22px 24px; overflow-y:auto; }
  .modal-footer { padding:14px 24px; border-top:1px solid var(--border-default); display:flex; justify-content:flex-end; gap:12px; flex-shrink:0; }
  .form-group { display:flex; flex-direction:column; gap:7px; margin-bottom:14px; }
  .form-group label { font-size:13px; font-weight:600; color:var(--text-primary); }
  .form-group input, .form-group select { padding:9px 12px; border:1px solid var(--border-default); border-radius:8px; font-size:14px; transition:all .2s; background:#fff; color:var(--text-primary); }
  .form-group input:focus, .form-group select:focus { outline:none; border-color:#1890ff; box-shadow:0 0 0 3px rgba(24,144,255,.12); }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-hint { font-size:12px; color:var(--text-tertiary); }
  .req { color:#ff4d4f; }
  .detail-grid { display:grid; grid-template-columns:96px 1fr; gap:10px; padding:9px 0; border-bottom:1px dashed var(--border-light); font-size:13px; }
  .detail-grid:last-child { border-bottom:none; }
  .detail-label { color:var(--text-tertiary); }
  .detail-value { color:var(--text-primary); font-weight:500; word-break:break-all; }
  .drawer-overlay { position:fixed; inset:0; background:rgba(0,21,41,.45); z-index:1100; opacity:0; visibility:hidden; transition:all .25s; }
  .drawer-overlay.active { opacity:1; visibility:visible; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:440px; max-width:94vw; background:var(--bg-card); z-index:1101; transform:translateX(102%); transition:transform .3s ease; display:flex; flex-direction:column; box-shadow:-10px 0 34px rgba(0,21,41,.16); }
  .drawer.active { transform:none; }
  .drawer-header { padding:18px 22px; background:linear-gradient(135deg,#1890ff 0%,#13c2c2 100%); color:#fff; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .drawer-header h3 { margin:0; font-size:16px; color:#fff; }
  .drawer-body { flex:1; overflow-y:auto; padding:18px 22px; }
  .drawer-footer { padding:12px 22px; border-top:1px solid var(--border-default); display:flex; gap:10px; justify-content:flex-end; flex-shrink:0; }
  .drawer-body::-webkit-scrollbar, .modal-body::-webkit-scrollbar { width:6px; }
  .drawer-body::-webkit-scrollbar-track, .modal-body::-webkit-scrollbar-track { background:#e6f4ff; }
  .drawer-body::-webkit-scrollbar-thumb, .modal-body::-webkit-scrollbar-thumb { background:#91caff; border-radius:3px; }
  .drawer-body::-webkit-scrollbar-thumb:hover, .modal-body::-webkit-scrollbar-thumb:hover { background:#1890ff; }
  .toast { position:fixed; top:20px; right:20px; padding:13px 18px; background:var(--bg-card); border-radius:10px; box-shadow:0 6px 24px rgba(0,21,41,.18); display:flex; align-items:center; gap:10px; z-index:2000; transform:translateX(120%); transition:all .3s ease; border-left:4px solid #52c41a; max-width:min(480px,90vw); font-size:13px; }
  .toast.show { transform:translateX(0); }
  .toast.error { border-left-color:#ff4d4f; }
  .toast.warning { border-left-color:#fa8c16; }
  .toast.info { border-left-color:#1890ff; }
  .toast-undo { border:1px solid #1890ff; color:#1890ff; background:#e6f4ff; border-radius:6px; padding:3px 12px; font-size:12px; cursor:pointer; flex-shrink:0; }
  .toast-undo:hover { background:#1890ff; color:#fff; }
  .stats-section { margin-bottom:16px; }
  .stats-section .stat-card { height:100%; }
  .stats-section .stat-card + .stat-card { margin-top:0; }
  .data-section { overflow-x:auto; }
  .data-section::-webkit-scrollbar { height:8px; }
  .data-section::-webkit-scrollbar-track { background:#f6ffed; }
  .data-section::-webkit-scrollbar-thumb { background:#b7eb8f; border-radius:4px; }
  .data-section::-webkit-scrollbar-thumb:hover { background:#52c41a; }
  @media (max-width:1100px){ .stats-section { grid-template-columns:repeat(2,1fr); } }
  .bulk-bar { display:none; align-items:center; gap:12px; padding:8px 14px; margin-bottom:10px; background:#e6f4ff; border:1px solid #91caff; border-radius:8px; font-size:13px; color:#0958d9; }
  .bulk-bar.show { display:flex; }
  .empty-row td { text-align:center; color:var(--text-tertiary); padding:36px 0 !important; font-size:13px; }
  .mono { font-family:Consolas,Menlo,monospace; font-size:12.5px; }
  .avatar { width:32px; height:32px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:600; flex-shrink:0; }
  .role-dist { display:flex; gap:8px; flex-wrap:wrap; margin-top:2px; }
  .role-dist span { font-size:11px; padding:2px 9px; border-radius:999px; border:1px solid; }
</style>
<style id="standalone-fix">/* 独立打开时内容撑满（导航统一由 index.html 承担） */
  .main-wrapper{margin-left:0!important;width:100%!important;}
</style>
<link rel="stylesheet" href="css/unified-theme.css">
<link rel="stylesheet" href="css/typography.css">
<link rel="stylesheet" href="css/system-page.css">
</head>
<body data-active-menu="system" data-active-submenu="user-settings">

<div class="app-layout">
  <div class="main-wrapper">
    <div class="tab-bar">
      <div class="tab-bar-actions">
        <button class="tab-close-all" title="关闭全部标签">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3L11 11M11 3L3 11"/></svg>
        </button>
      </div>
    </div>

    <main class="main-content">
      <div class="content-wrapper">

        <div class="stats-section metrics-row">
          <div class="stat-card blue">
            <div class="stat-header"><span class="stat-label">用户总数</span><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span></div>
            <div class="stat-value" id="stTotal">—</div>
            <div class="stat-footer"><span style="font-size:12px;color:var(--text-tertiary);" id="stBuiltin">内置 — · 自定义 —</span></div>
          </div>
          <div class="stat-card green">
            <div class="stat-header"><span class="stat-label">启用账号</span><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span></div>
            <div class="stat-value" id="stEnabled">—</div>
            <div class="stat-footer"><span style="font-size:12px;color:var(--text-tertiary);">可正常登录后台</span></div>
          </div>
          <div class="stat-card red">
            <div class="stat-header"><span class="stat-label">禁用账号</span><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg></span></div>
            <div class="stat-value" id="stDisabled">—</div>
            <div class="stat-footer"><span style="font-size:12px;color:var(--text-tertiary);">登录将被拒绝</span></div>
          </div>
          <div class="stat-card purple">
            <div class="stat-header"><span class="stat-label">角色分布</span><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg></span></div>
            <div class="stat-value" id="stRoles">—</div>
            <div class="stat-footer"><div class="role-dist" id="roleDist"></div></div>
          </div>
        </div>

        <div class="search-section">
          <div class="search-bar">
            <select class="search-select" id="roleSelect" style="width:170px;">
              <option value="">全部角色</option>
              <option>超级管理员</option><option>生产主管</option><option>接种操作工</option><option>设备运维工程师</option><option>质检员</option><option>演示账号</option>
            </select>
            <select class="search-select" id="statusSelect" style="width:130px;">
              <option value="">全部状态</option><option value="enabled">启用</option><option value="disabled">禁用</option>
            </select>
            <input type="text" class="search-input" placeholder="账号 / 姓名 / 手机搜索…" id="kwInput" style="width:220px;">
            <div class="search-actions">
              <button class="jg-btn jg-btn-primary" onclick="applyFilter(true)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;margin-right:6px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>搜索</button>
              <button class="jg-btn" onclick="resetSearch()">重置</button>
            </div>
          </div>
        </div>

        <div class="action-bar">
          <div class="action-left">
            <button class="jg-btn jg-btn-primary" onclick="openUserModal()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>新增用户
            </button>
            <button class="jg-btn" onclick="exportCSV()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导出 CSV
            </button>
          </div>
          <div class="action-right"><span style="font-size:13px;color:var(--text-tertiary);" id="filterInfo"></span></div>
        </div>

        <div class="bulk-bar" id="bulkBar">
          <span>已勾选 <strong id="bulkCount">0</strong> 个账号（内置账号仅停用、不删除）</span>
          <button class="jg-btn" style="border-color:#ff4d4f;color:#ff4d4f;" onclick="bulkDelete()">批量删除自定义账号</button>
          <button class="jg-btn" onclick="clearSelection()">取消勾选</button>
        </div>

        <div class="data-section">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width:44px;"><input type="checkbox" id="checkAll" onchange="toggleAll(this.checked)" aria-label="全选"></th>
                <th style="width:56px;">序号</th>
                <th>账号</th>
                <th>姓名</th>
                <th>角色</th>
                <th>手机号</th>
                <th>来源</th>
                <th>状态</th>
                <th>创建时间</th>
                <th style="width:250px;">操作</th>
              </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
          </table>
          <div id="pagination-container"></div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- 用户详情抽屉 -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="userDrawer" role="dialog" aria-label="用户详情">
  <div class="drawer-header">
    <h3 id="drawerTitle">用户详情</h3>
    <button class="modal-close" onclick="closeDrawer()" aria-label="关闭">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-footer" id="drawerFooter"></div>
</div>

<!-- 新增/编辑用户弹窗 -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <div class="modal-header"><h3 id="userModalTitle">新增用户</h3><button class="modal-close" onclick="closeModal('userModal')">×</button></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label>登录账号 <span class="req">*</span></label><input type="text" id="uUsername" maxlength="20" placeholder="字母开头，4-20 位字母数字下划线"><span class="form-hint" id="uUsernameHint">创建后可直接用于登录页登录</span></div>
        <div class="form-group"><label>姓名 <span class="req">*</span></label><input type="text" id="uRealName" maxlength="20" placeholder="真实姓名"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>角色 <span class="req">*</span></label><select id="uRole">
          <option value="">请选择</option><option>超级管理员</option><option>生产主管</option><option>接种操作工</option><option>设备运维工程师</option><option>质检员</option><option>演示账号</option>
        </select></div>
        <div class="form-group" id="uPwdGroup"><label>初始密码 <span class="req">*</span></label><input type="text" id="uPassword" maxlength="30" placeholder="至少 6 位"><span class="form-hint">与登录页校验规则一致（≥6 位）</span></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>手机号</label><input type="text" id="uPhone" maxlength="11" placeholder="选填，11 位手机号"></div>
        <div class="form-group"><label>邮箱</label><input type="text" id="uEmail" maxlength="40" placeholder="选填"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('userModal')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="confirmUser()">保存</button>
    </div>
  </div>
</div>

<!-- 重置密码弹窗 -->
<div class="modal-overlay" id="pwdModal">
  <div class="modal" style="width:420px;">
    <div class="modal-header" style="background:linear-gradient(135deg,#722ed1 0%,#1890ff 100%);"><h3 id="pwdTitle">重置密码</h3><button class="modal-close" onclick="closeModal('pwdModal')">×</button></div>
    <div class="modal-body">
      <div class="form-group"><label>新密码 <span class="req">*</span></label><input type="text" id="pwdNew" maxlength="30" placeholder="至少 6 位"></div>
      <div class="form-group"><label>确认新密码 <span class="req">*</span></label><input type="text" id="pwdConfirm" maxlength="30" placeholder="再次输入新密码"></div>
      <span class="form-hint">重置后旧密码立即失效，新密码可直接登录。</span>
    </div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('pwdModal')">取消</button>
      <button class="jg-btn jg-btn-primary" onclick="confirmPwd()">确认重置</button>
    </div>
  </div>
</div>

<!-- 通用确认弹窗 -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal" style="width:420px;">
    <div class="modal-header" style="background:linear-gradient(135deg,#fa8c16 0%,#ff4d4f 100%);"><h3 id="confirmTitle">确认操作</h3><button class="modal-close" onclick="closeModal('confirmModal')">×</button></div>
    <div class="modal-body"><div id="confirmText" style="font-size:14px;color:var(--text-secondary);line-height:1.7;"></div></div>
    <div class="modal-footer">
      <button class="jg-btn" onclick="closeModal('confirmModal')">取消</button>
      <button class="jg-btn jg-btn-primary" id="confirmOk" style="background:#ff4d4f;border-color:#ff4d4f;">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <span id="toastMessage">操作成功</span>
  <button class="toast-undo" id="toastUndo" style="display:none;">撤销</button>
</div>

<script src="js/shared/fungi-store.js"></script>
<script>
/* ============================================================
 * 用户设置 —— 内置账号库（与 login.html USERS 逐字一致）
 * + localStorage snzg_user_accounts 覆盖表合并
 * 新增/编辑/禁用/重置密码均写覆盖表，登录页即时生效
 * admin 不可删除 / 禁用；内置账号不可删除（仅可停用）
 * ============================================================ */
'use strict';
var FS = window.FungiStore;
var ACC_KEY='snzg_user_accounts';
var BUILTIN=[
  { username:'admin',      password:'admin123',      role:'超级管理员',     realName:'系统管理员' },
  { username:'supervisor', password:'supervisor123', role:'生产主管',       realName:'惠加宁' },
  { username:'operator',   password:'operator123',   role:'接种操作工',     realName:'黄忠坚' },
  { username:'maintainer', password:'maintainer123', role:'设备运维工程师', realName:'张才孙' },
  { username:'inspector',  password:'inspector123',  role:'质检员',         realName:'周明轩' },
  { username:'demo',       password:'demo123',       role:'演示账号',       realName:'演示用户', disabled:true }
];
var BUILTIN_MAP={}; BUILTIN.forEach(function(u){ BUILTIN_MAP[u.username]=u; });
var ROLE_COLORS={ '超级管理员':'#722ed1','生产主管':'#1890ff','接种操作工':'#52c41a','设备运维工程师':'#fa8c16','质检员':'#13c2c2','演示账号':'#8c8c8c' };
var AVATAR_COLORS=['#1890ff','#52c41a','#fa8c16','#722ed1','#13c2c2','#ff4d4f'];

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ n=String(n); while(n.length<2) n='0'+n; return n; }
function nowHM(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function nowStr(){ return FS.at(0, nowHM()); }
function currentUser(){ try{ return JSON.parse(sessionStorage.getItem('snzg_user')||'{}'); }catch(e){ return {}; } }
function opLog(action, object){
  try{
    var u=currentUser();
    var arr=JSON.parse(localStorage.getItem('mushroom_op_log')||'[]');
    arr.unshift({ time:nowStr(), account:u.username||'admin', action:action, object:object||'—' });
    if(arr.length>200) arr.length=200;
    localStorage.setItem('mushroom_op_log', JSON.stringify(arr));
  }catch(e){}
}
var toastTimer=null, undoFn=null;
function showToast(msg,type,undo){
  var t=document.getElementById('toast');
  document.getElementById('toastMessage').textContent=msg;
  var ub=document.getElementById('toastUndo');
  undoFn=undo||null; ub.style.display=undo?'':'none';
  t.className='toast '+(type||'success')+' show';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove('show'); undoFn=null; }, undo?6000:3400);
}
document.getElementById('toastUndo').addEventListener('click',function(){
  if(undoFn){ var f=undoFn; undoFn=null; f(); }
  document.getElementById('toast').classList.remove('show');
});
function openModal(id){ document.getElementById(id).classList.add('active'); }
function closeModal(id){ document.getElementById(id).classList.remove('active'); }
function askConfirm(title,html,onOk){
  document.getElementById('confirmTitle').textContent=title;
  document.getElementById('confirmText').innerHTML=html;
  var btn=document.getElementById('confirmOk');
  var nb=btn.cloneNode(true); btn.parentNode.replaceChild(nb,btn);
  nb.addEventListener('click',function(){ closeModal('confirmModal'); onOk(); });
  openModal('confirmModal');
}
function openDrawer(){ document.getElementById('drawerOverlay').classList.add('active'); document.getElementById('userDrawer').classList.add('active'); }
function closeDrawer(){ document.getElementById('drawerOverlay').classList.remove('active'); document.getElementById('userDrawer').classList.remove('active'); }
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ document.querySelectorAll('.modal-overlay.active').forEach(function(o){ closeModal(o.id); }); closeDrawer(); }
});
document.querySelectorAll('.modal-overlay').forEach(function(o){
  o.addEventListener('click',function(e){ if(e.target===o) closeModal(o.id); });
});

/* ---------- 账号合并（与 login.getAccountMap 同构） ---------- */
function loadOverrides(){ try{ var o=JSON.parse(localStorage.getItem(ACC_KEY)||'null'); return (o&&typeof o==='object')?o:{}; }catch(e){ return {}; } }
function saveOverrides(o){
  if(Object.keys(o).length) localStorage.setItem(ACC_KEY,JSON.stringify(o));
  else localStorage.removeItem(ACC_KEY);
}
function allUsers(){
  var ov=loadOverrides();
  var map={};
  BUILTIN.forEach(function(u){
    map[u.username]={ username:u.username, password:u.password, realName:u.realName, role:u.role, phone:u.phone||'', disabled:!!u.disabled, builtin:true, email:'', createdAt:'内置账号' };
  });
  Object.keys(ov).forEach(function(k){
    var o=ov[k]||{};
    var base=map[k]||{ username:k, password:'', realName:k, role:'接种操作工', phone:'', disabled:false, builtin:false, email:'', createdAt:'' };
    map[k]={
      username:k,
      password:o.password!==undefined?o.password:base.password,
      realName:o.realName!==undefined?o.realName:base.realName,
      role:o.role!==undefined?o.role:base.role,
      phone:o.phone!==undefined?o.phone:base.phone,
      disabled:o.disabled!==undefined?!!o.disabled:base.disabled,
      builtin:!!BUILTIN_MAP[k],
      email:o.email||'',
      createdAt:o.createdAt||base.createdAt||(BUILTIN_MAP[k]?'内置账号':'—')
    };
  });
  return Object.keys(map).map(function(k){ return map[k]; });
}
function getUser(username){ return allUsers().filter(function(u){ return u.username===username; })[0]||null; }

/* ---------- 统计 ---------- */
function renderStats(){
  var users=allUsers();
  var enabled=users.filter(function(u){ return !u.disabled; }).length;
  var builtin=users.filter(function(u){ return u.builtin; }).length;
  document.getElementById('stTotal').textContent=users.length;
  document.getElementById('stBuiltin').textContent='内置 '+builtin+' · 自定义 '+(users.length-builtin);
  document.getElementById('stEnabled').textContent=enabled;
  document.getElementById('stDisabled').textContent=users.length-enabled;
  var dist={};
  users.forEach(function(u){ dist[u.role]=(dist[u.role]||0)+1; });
  var roles=Object.keys(dist);
  document.getElementById('stRoles').textContent=roles.length;
  document.getElementById('roleDist').innerHTML=roles.map(function(r){
    var c=ROLE_COLORS[r]||'#8c8c8c';
    return '<span style="color:'+c+';border-color:'+c+'66;background:'+c+'14;">'+esc(r)+' '+dist[r]+'</span>';
  }).join('');
}

/* ---------- 列表 ---------- */
var selected={};
var Pagination={
  currentPage:1,pageSize:10,filteredData:[],
  updateData:function(data){ this.filteredData=data; this.currentPage=1; this.render(); },
  goToPage:function(p){ var tp=Math.max(1,Math.ceil(this.filteredData.length/this.pageSize)); if(p<1||p>tp) return; this.currentPage=p; this.render(); },
  render:function(){
    var total=this.filteredData.length, tp=Math.max(1,Math.ceil(total/this.pageSize));
    if(this.currentPage>tp) this.currentPage=tp;
    var start=(this.currentPage-1)*this.pageSize;
    var rows=this.filteredData.slice(start,start+this.pageSize);
    document.getElementById('dataTableBody').innerHTML=rows.length?rows.map(function(u,i){ return renderRow(u,start+i+1); }).join('')
      :'<tr class="empty-row"><td colspan="10">暂无符合条件的用户，点击「新增用户」创建</td></tr>';
    var html='<div class="pagination">';
    html+='<button class="page-btn '+(this.currentPage<=1?'disabled':'')+'" onclick="Pagination.goToPage('+(this.currentPage-1)+')">‹</button>';
    for(var i=1;i<=tp;i++){
      if(i===1||i===tp||Math.abs(i-this.currentPage)<=1) html+='<button class="page-btn '+(i===this.currentPage?'active':'')+'" onclick="Pagination.goToPage('+i+')">'+i+'</button>';
      else if(Math.abs(i-this.currentPage)===2) html+='<span style="padding:0 6px;color:#9aa5b1;">…</span>';
    }
    html+='<button class="page-btn '+(this.currentPage>=tp?'disabled':'')+'" onclick="Pagination.goToPage('+(this.currentPage+1)+')">›</button>';
    html+='<span style="margin-left:14px;font-size:13px;color:#6b7b6b;">第 '+this.currentPage+' / '+tp+' 页 · 共 '+total+' 条</span></div>';
    document.getElementById('pagination-container').innerHTML=html;
    syncCheckAll();
  }
};
function currentFiltered(){
  var role=document.getElementById('roleSelect').value;
  var st=document.getElementById('statusSelect').value;
  var kw=document.getElementById('kwInput').value.trim().toLowerCase();
  return allUsers().filter(function(u){
    if(role && u.role!==role) return false;
    if(st==='enabled' && u.disabled) return false;
    if(st==='disabled' && !u.disabled) return false;
    if(kw && u.username.toLowerCase().indexOf(kw)<0 && String(u.realName).toLowerCase().indexOf(kw)<0 && String(u.phone).indexOf(kw)<0) return false;
    return true;
  });
}
function applyFilter(notify){
  var rows=currentFiltered();
  Pagination.updateData(rows);
  document.getElementById('filterInfo').textContent='筛选结果 '+rows.length+' 个账号';
  if(notify) showToast('找到 '+rows.length+' 个账号','info');
}
function resetSearch(){
  ['roleSelect','statusSelect'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('kwInput').value='';
  applyFilter(false); showToast('已重置筛选条件','info');
}
function rolePill(role){
  var c=ROLE_COLORS[role]||'#8c8c8c';
  return '<span style="display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;color:'+c+';background:'+c+'14;border:1px solid '+c+'66;">'+esc(role)+'</span>';
}
function statusPill(u){
  return u.disabled
    ? '<span style="display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:#fff1f0;color:#ff4d4f;border:1px solid #ffa39e;">禁用</span>'
    : '<span style="display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f;">启用</span>';
}
function avatarOf(u){
  var idx=0; for(var i=0;i<u.username.length;i++) idx+=u.username.charCodeAt(i);
  var c=AVATAR_COLORS[idx%AVATAR_COLORS.length];
  return '<span class="avatar" style="background:'+c+';">'+esc(String(u.realName||u.username).slice(0,1))+'</span>';
}
function renderRow(u,seq){
  var isAdmin=u.username==='admin';
  var acts='<button class="action-btn detail" onclick="viewDetail(\''+esc(u.username)+'\')">详情</button>'+
    '<button class="action-btn" onclick="openUserModal(\''+esc(u.username)+'\')">编辑</button>'+
    '<button class="action-btn" style="color:#722ed1;" onclick="openPwdModal(\''+esc(u.username)+'\')">重置密码</button>';
  if(!isAdmin) acts+='<button class="action-btn" style="color:'+(u.disabled?'#52c41a':'#fa8c16')+';" onclick="toggleDisable(\''+esc(u.username)+'\')">'+(u.disabled?'启用':'禁用')+'</button>';
  if(!u.builtin) acts+='<button class="action-btn" style="color:#ff4d4f;" onclick="deleteOne(\''+esc(u.username)+'\')">删除</button>';
  return '<tr>'+
    '<td><input type="checkbox" '+(selected[u.username]?'checked':'')+' onchange="toggleRow(\''+esc(u.username)+'\',this.checked)" aria-label="勾选"></td>'+
    '<td>'+seq+'</td>'+
    '<td><div style="display:flex;align-items:center;gap:10px;">'+avatarOf(u)+'<strong class="mono">'+esc(u.username)+'</strong>'+(isAdmin?'<span style="font-size:11px;padding:1px 8px;border-radius:999px;background:#fff7e6;color:#fa8c16;border:1px solid #ffd591;">受保护</span>':'')+'</div></td>'+
    '<td>'+esc(u.realName)+'</td>'+
    '<td>'+rolePill(u.role)+'</td>'+
    '<td class="mono">'+esc(u.phone||'—')+'</td>'+
    '<td>'+(u.builtin?'<span style="font-size:12px;color:var(--text-tertiary);">内置</span>':'<span style="font-size:12px;color:#1890ff;">自定义</span>')+'</td>'+
    '<td>'+statusPill(u)+'</td>'+
    '<td style="font-size:12px;">'+esc(u.createdAt||'—')+'</td>'+
    '<td><div class="action-btns">'+acts+'</div></td></tr>';
}
function toggleRow(id,on){ if(on) selected[id]=true; else delete selected[id]; syncBulk(); }
function toggleAll(on){
  Pagination.filteredData.slice((Pagination.currentPage-1)*Pagination.pageSize,Pagination.currentPage*Pagination.pageSize).forEach(function(u){
    if(on) selected[u.username]=true; else delete selected[u.username];
  });
  Pagination.render(); syncBulk();
}
function syncCheckAll(){
  var rows=Pagination.filteredData.slice((Pagination.currentPage-1)*Pagination.pageSize,Pagination.currentPage*Pagination.pageSize);
  document.getElementById('checkAll').checked=rows.length>0 && rows.every(function(u){ return selected[u.username]; });
}
function syncBulk(){
  var n=Object.keys(selected).length;
  document.getElementById('bulkCount').textContent=n;
  document.getElementById('bulkBar').classList.toggle('show',n>0);
}
function clearSelection(){ selected={}; Pagination.render(); syncBulk(); }

/* ---------- 新增 / 编辑 ---------- */
var editingUser=null;
function openUserModal(username){
  editingUser=username||null;
  document.getElementById('userModalTitle').textContent=username?'编辑用户 · '+username:'新增用户';
  var uName=document.getElementById('uUsername');
  var pwdGroup=document.getElementById('uPwdGroup');
  if(username){
    var u=getUser(username);
    uName.value=u.username; uName.disabled=true;
    document.getElementById('uUsernameHint').textContent='账号创建后不可修改';
    document.getElementById('uRealName').value=u.realName;
    document.getElementById('uRole').value=u.role;
    document.getElementById('uPhone').value=u.phone||'';
    document.getElementById('uEmail').value=u.email||'';
    pwdGroup.style.display='none';
  }else{
    uName.value=''; uName.disabled=false;
    document.getElementById('uUsernameHint').textContent='创建后可直接用于登录页登录';
    ['uRealName','uPhone','uEmail','uPassword'].forEach(function(id){ document.getElementById(id).value=''; });
    document.getElementById('uRole').value='';
    pwdGroup.style.display='';
  }
  openModal('userModal');
}
function confirmUser(){
  var username=document.getElementById('uUsername').value.trim();
  var realName=document.getElementById('uRealName').value.trim();
  var role=document.getElementById('uRole').value;
  var phone=document.getElementById('uPhone').value.trim();
  var email=document.getElementById('uEmail').value.trim();
  if(!/^[A-Za-z][A-Za-z0-9_]{3,19}$/.test(username)){ showToast('账号需字母开头，4-20 位字母/数字/下划线','error'); return; }
  if(!realName){ showToast('请填写姓名','error'); return; }
  if(!role){ showToast('请选择角色','error'); return; }
  if(phone && !/^1\d{10}$/.test(phone)){ showToast('手机号应为 11 位且以 1 开头','error'); return; }
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showToast('邮箱格式不正确','error'); return; }
  var ov=loadOverrides();
  if(!editingUser){
    if(BUILTIN_MAP[username] || ov[username]){ showToast('账号 '+username+' 已存在','error'); return; }
    var pwd=document.getElementById('uPassword').value;
    if(!pwd || pwd.length<6){ showToast('初始密码至少 6 位','error'); return; }
    ov[username]={ password:pwd, realName:realName, role:role, phone:phone, disabled:false, email:email, createdAt:nowStr() };
    saveOverrides(ov);
    opLog('新增用户',username+' · '+role);
    showToast('用户 '+username+' 已创建，可直接登录','success');
  }else{
    var base=ov[editingUser]||{};
    ov[editingUser]=Object.assign({},base,{ realName:realName, role:role, phone:phone, email:email });
    saveOverrides(ov);
    opLog('编辑用户',editingUser+' · '+role);
    showToast('用户 '+editingUser+' 已更新','success');
  }
  closeModal('userModal');
  refresh();
}

/* ---------- 禁用 / 启用 ---------- */
function toggleDisable(username){
  if(username==='admin'){ showToast('admin 为受保护账号，不可禁用','error'); return; }
  var u=getUser(username); if(!u) return;
  var to=!u.disabled;
  askConfirm(to?'禁用账号':'启用账号',
    to?('确定禁用账号 <strong class="mono">'+esc(username)+'</strong>（'+esc(u.realName)+'）吗？禁用后该账号将无法登录。')
      :('确定启用账号 <strong class="mono">'+esc(username)+'</strong>（'+esc(u.realName)+'）吗？'),
    function(){
      var ov=loadOverrides();
      ov[username]=Object.assign({},ov[username]||{},{ disabled:to });
      saveOverrides(ov);
      opLog(to?'禁用账号':'启用账号',username);
      refresh();
      showToast(username+(to?' 已禁用':' 已启用'),to?'warning':'success');
    });
}

/* ---------- 重置密码 ---------- */
var pwdUser=null;
function openPwdModal(username){
  pwdUser=username;
  document.getElementById('pwdTitle').textContent='重置密码 · '+username;
  document.getElementById('pwdNew').value='';
  document.getElementById('pwdConfirm').value='';
  openModal('pwdModal');
}
function confirmPwd(){
  var p1=document.getElementById('pwdNew').value;
  var p2=document.getElementById('pwdConfirm').value;
  if(!p1||p1.length<6){ showToast('新密码至少 6 位','error'); return; }
  if(p1!==p2){ showToast('两次输入的密码不一致','error'); return; }
  var ov=loadOverrides();
  ov[pwdUser]=Object.assign({},ov[pwdUser]||{},{ password:p1 });
  saveOverrides(ov);
  opLog('重置密码',pwdUser);
  closeModal('pwdModal');
  showToast(pwdUser+' 密码已重置，新密码可直接登录','success');
}

/* ---------- 删除（仅自定义） ---------- */
function deleteOne(username){
  if(BUILTIN_MAP[username]){ showToast('内置账号不可删除，可使用「禁用」停用','error'); return; }
  var u=getUser(username); if(!u) return;
  askConfirm('删除用户','确定删除自定义账号 <strong class="mono">'+esc(username)+'</strong>（'+esc(u.realName)+'）吗？删除后可撤销。',function(){
    var ov=loadOverrides();
    var backup=ov[username];
    delete ov[username]; saveOverrides(ov);
    delete selected[username];
    opLog('删除用户',username);
    refresh();
    showToast('已删除用户 '+username,'warning',function(){
      var o=loadOverrides(); o[username]=backup; saveOverrides(o);
      refresh(); showToast('已恢复用户 '+username,'success');
    });
  });
}
function bulkDelete(){
  var ids=Object.keys(selected);
  var custom=ids.filter(function(id){ return !BUILTIN_MAP[id]; });
  var skipped=ids.length-custom.length;
  if(!custom.length){ showToast('勾选的均为内置账号，不可删除（可禁用）','warning'); return; }
  askConfirm('批量删除自定义账号',
    '将删除 <strong>'+custom.length+'</strong> 个自定义账号'+(skipped?'，另有 '+skipped+' 个内置账号将跳过（不可删除）':'')+'。删除后可撤销，是否继续？',
    function(){
      var ov=loadOverrides();
      var backups={};
      custom.forEach(function(id){ backups[id]=ov[id]; delete ov[id]; delete selected[id]; });
      saveOverrides(ov);
      opLog('批量删除用户',custom.join('、'));
      refresh();
      showToast('已删除 '+custom.length+' 个自定义账号'+(skipped?'（跳过内置 '+skipped+' 个）':''),'warning',function(){
        var o=loadOverrides();
        Object.keys(backups).forEach(function(id){ o[id]=backups[id]; });
        saveOverrides(o);
        refresh(); showToast('已恢复 '+custom.length+' 个账号','success');
      });
    });
}

/* ---------- 详情抽屉 ---------- */
function viewDetail(username){
  var u=getUser(username); if(!u) return;
  document.getElementById('drawerTitle').textContent='用户详情 · '+u.realName;
  document.getElementById('drawerBody').innerHTML=
    '<div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">'+avatarOf(u)+
    '<div><div style="font-size:16px;font-weight:600;color:var(--text-primary);">'+esc(u.realName)+'</div><div class="mono" style="font-size:12px;color:var(--text-tertiary);">'+esc(u.username)+'</div></div>'+
    '<div style="margin-left:auto;">'+statusPill(u)+'</div></div>'+
    '<div class="detail-grid"><span class="detail-label">角色</span><span class="detail-value">'+rolePill(u.role)+'</span></div>'+
    '<div class="detail-grid"><span class="detail-label">手机号</span><span class="detail-value mono">'+esc(u.phone||'—')+'</span></div>'+
    '<div class="detail-grid"><span class="detail-label">邮箱</span><span class="detail-value">'+esc(u.email||'—')+'</span></div>'+
    '<div class="detail-grid"><span class="detail-label">账号来源</span><span class="detail-value">'+(u.builtin?'内置账号库（login.html USERS）':'自定义（snzg_user_accounts）')+'</span></div>'+
    '<div class="detail-grid"><span class="detail-label">创建时间</span><span class="detail-value">'+esc(u.createdAt||'—')+'</span></div>'+
    '<div class="detail-grid"><span class="detail-label">密码</span><span class="detail-value mono">••••••••（已加密，不可查看）</span></div>'+
    (u.username==='admin'?'<div style="margin-top:12px;font-size:12px;color:#fa8c16;line-height:1.7;">admin 为系统受保护账号：不可删除、不可禁用，可编辑资料与重置密码。</div>':'')+
    '<div style="margin-top:12px;font-size:12px;color:var(--text-tertiary);line-height:1.7;">该账号的菜单可见范围由「菜单设置」按角色（'+esc(u.role)+'）配置，重新登录后生效。</div>';
  var f='<button class="jg-btn" onclick="closeDrawer();openPwdModal(\''+esc(u.username)+'\')">重置密码</button>'+
    '<button class="jg-btn jg-btn-primary" onclick="closeDrawer();openUserModal(\''+esc(u.username)+'\')">编辑资料</button>';
  document.getElementById('drawerFooter').innerHTML=f;
  openDrawer();
}

/* ---------- 导出 ---------- */
function exportCSV(){
  var rows=Pagination.filteredData;
  if(!rows.length){ showToast('当前没有可导出的数据','warning'); return; }
  var head=['账号','姓名','角色','手机号','邮箱','来源','状态','创建时间'];
  var lines=[head.join(',')].concat(rows.map(function(u){
    return [u.username,u.realName,u.role,u.phone||'',u.email||'',u.builtin?'内置':'自定义',u.disabled?'禁用':'启用',u.createdAt||''].map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(',');
  }));
  var blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='用户列表_'+FS.dayKey(0)+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1500);
  opLog('导出用户CSV',rows.length+' 个账号');
  showToast('已导出 '+rows.length+' 个账号（不含密码）','success');
}

function refresh(){ renderStats(); applyFilter(false); }
document.addEventListener('DOMContentLoaded',function(){
  ['roleSelect','statusSelect'].forEach(function(id){ document.getElementById(id).addEventListener('change',function(){ applyFilter(false); }); });
  document.getElementById('kwInput').addEventListener('input',function(){ applyFilter(false); });
  refresh();
});
