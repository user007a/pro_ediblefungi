<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%2352c41a'/%3E%3C/svg%3E">
<title>工厂化农业数据管理系统 - 备品备件</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .search-input { flex:1; min-width:220px; }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:999; backdrop-filter:blur(4px); }
  .modal-overlay.show { display:block; }
  .modal-box { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:var(--bg-card); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.15);
    width:600px; max-width:94vw; max-height:88vh; overflow-y:auto; z-index:1000; animation:modalSlideIn .25s ease-out; padding:20px 24px; }
  .modal-box.show { display:block; }
  @keyframes modalSlideIn { from{opacity:0;transform:translate(-50%,-50%) scale(.95)} to{opacity:1;transform:translate(-50%,-50%) scale(1)} }
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;
    padding-bottom:16px; border-bottom:1px solid var(--border-light); }
  .modal-header h3 { font-size:16px; font-weight:600; color:var(--text-primary); margin:0; }
  .modal-close { width:28px; height:28px; border:none; background:var(--gray-100); border-radius:6px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .modal-close:hover { background:var(--error-bg); color:var(--error); }
  .modal-body { padding:0 4px; }
  .modal-footer { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; padding:16px 0 0;
    border-top:1px solid var(--border-light); }
  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-size:13px; font-weight:500; color:var(--text-secondary); margin-bottom:8px; }
  .form-group label.required::after { content:' *'; color:var(--error); }
  .form-group input, .form-group select { width:100%; padding:10px;
    border:1px solid var(--border-default); border-radius:8px; font-size:13px; box-sizing:border-box; }
  .form-group input:focus, .form-group select:focus { outline:none; border-color:var(--primary-400); box-shadow:0 0 0 3px rgba(24,144,255,.1); }
  .form-row { display:flex; gap:16px; }
  .form-row > .form-group { flex:1; }
  .form-hint { font-size:11.5px; color:var(--text-tertiary); margin-top:6px; }

  .drawer-mask { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:998; opacity:0; visibility:hidden; transition:all .25s; }
  .drawer-mask.show { opacity:1; visibility:visible; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:520px; max-width:94vw; background:var(--bg-card); z-index:999;
    transform:translateX(102%); transition:transform .25s ease; box-shadow:-8px 0 30px rgba(0,0,0,.12); display:flex; flex-direction:column; }
  .drawer.show { transform:none; }
  .drawer-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border-light); }
  .drawer-header h3 { margin:0; font-size:15px; font-weight:600; color:var(--text-primary); }
  .drawer-body { flex:1; overflow-y:auto; padding:16px 20px; }
  .drawer-section { font-weight:600; font-size:13px; color:var(--text-primary); margin:18px 0 8px; }
  .drawer-section:first-child { margin-top:0; }
  .detail-info { padding:12px; background:linear-gradient(135deg,var(--gray-50),var(--gray-100));
    border-radius:12px; margin-bottom:12px; border:1px solid var(--border-default); }
  .detail-row { display:flex; padding:9px 0; border-bottom:1px dashed var(--border-default); font-size:13px; }
  .detail-row:last-child { border-bottom:none; }
  .detail-label { width:104px; color:var(--text-tertiary); flex-shrink:0; }
  .detail-value { flex:1; color:var(--text-primary); word-break:break-all; }

  .status-tag { display:inline-flex; align-items:center; padding:3px 10px; font-size:11.5px;
    font-weight:500; border-radius:20px; white-space:nowrap; }
  .status-tag.online { background:#d9f7be; color:#3a8618; border:1px solid #b7eb8f; }
  .status-tag.offline { background:var(--error-bg); color:#cf1322; border:1px solid #ffccc7; }
  .status-tag.processing { background:var(--info-bg); color:var(--primary-500); border:1px solid var(--info-border); }
  .status-tag.warning { background:var(--warning-bg); color:#ad8b00; border:1px solid var(--warning-border); }
  .type-badge { display:inline-block; padding:2px 8px; border-radius:var(--radius-sm); font-size:11.5px; font-weight:500; }
  .type-badge.in { background:#f6ffed; color:#389e0d; border:1px solid #b7eb8f; }
  .type-badge.out { background:var(--warning-bg); color:#ad6800; border:1px solid var(--warning-border); }

  .action-btns { display:flex; gap:6px; flex-wrap:nowrap; }
  .action-btn { padding:4px 10px; font-size:11.5px; font-weight:500; border:1px solid transparent;
    border-radius:6px; cursor:pointer; white-space:nowrap; background:none; }
  .action-btn.detail { color:#2b6cb0; background:#f5f8fc; border-color:#c5d9f0; }
  .action-btn.edit { color:var(--primary-600); background:var(--gray-50); border-color:var(--border-default); }
  .action-btn.del { color:#cf1322; background:var(--error-bg); border-color:#ffccc7; }
  .action-btn.move { color:#ad6800; background:var(--warning-bg); border-color:var(--warning-border); }

  .stat-card-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:16px; }
  .stat-card-row .stat-card { margin-top:0 !important; cursor:default; }
  .stat-card-row .stat-card:hover { transform:none; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .stat-label { font-size:12px; color:var(--text-tertiary); margin-bottom:6px; }
  .stat-value { font-size:26px; font-weight:700; color:var(--text-primary); font-variant-numeric:tabular-nums; }
  .stat-value .unit { font-size:13px; font-weight:500; color:var(--text-tertiary); margin-left:4px; }
  .stat-sub { margin-top:6px; font-size:12px; color:var(--text-tertiary); }
  .stat-sub.warn { color:var(--warning); }
  .stat-sub.err { color:var(--error); }

  .section-title { font-size:14px; font-weight:600; color:var(--text-primary); margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .section-title .count { font-size:12px; font-weight:500; color:var(--text-tertiary); }
  .data-table { min-width:1020px; }
  .data-table th { white-space:nowrap; }
  .data-table th.sortable { cursor:pointer; user-select:none; }
  .data-table th.sortable:hover { color:var(--primary-500); }
  .data-table th .arrow { font-size:10px; margin-left:3px; color:var(--primary-500); }
  .data-table tbody tr.clickable { cursor:pointer; }
  .data-table tbody tr.clickable:hover { background:#f7fbff; }
  .empty-row td { text-align:center; color:var(--text-tertiary); padding:32px 0; }
  .num-cell { font-variant-numeric:tabular-nums; }
  .num-cell.low { color:#cf1322; font-weight:700; }
  #movePagination { padding:12px 16px; }
  .selected-info { font-size:12.5px; color:var(--text-tertiary); margin-left:auto; }
  .selected-info strong { color:var(--primary-600); }
  .mini-item { display:flex; gap:8px; align-items:flex-start; padding:8px 10px; border:1px solid var(--border-light);
    border-radius:8px; margin-bottom:6px; background:var(--gray-50); font-size:12.5px; }
  .mini-item .mi-main { flex:1; min-width:0; }
  .mini-item .mi-sub { color:var(--text-tertiary); font-size:11.5px; margin-top:2px; }
</style>

<script>
/* ============================================================
 * 备品备件（库存台账 + 出入库流水）
 * 数据源：FungiStore.spares / spareMoves
 * store 无单价字段：单价按页内估价表 PRICE_MAP 推导（新增备件默认 50 元），
 * 库存总值 = Σ stock × 单价。低库存判定：stock < safety。
 * 出库校验 qty ≤ stock；登记后即时更新库存并写 spareMoves。
 * ============================================================ */
var FS = window.FungiStore;
var esc = DeviceUI.esc;
var PRICE_MAP = { 'SP-01': 320, 'SP-02': 45, 'SP-03': 86, 'SP-04': 260, 'SP-05': 38 };
var editingId = '';
var sortKey = 'id', sortDir = 1;
var movePage = 1, MOVE_PAGE_SIZE = 8;
var selected = {};

function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function nowStr(){ var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function priceOf(s){ return PRICE_MAP[s.id] != null ? PRICE_MAP[s.id] : 50; }
function isLow(s){ return s.stock < s.safety; }
function spareLabel(id){ var s = FS.get('spares', id); return s ? id + ' ' + s.name : id; }
function undoToast(msg, fn){
  var c = document.querySelector('.toast-container');
  if (!c){ c = document.createElement('div'); c.className = 'toast-container';
    c.style.cssText = 'position:fixed;top:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;'; document.body.appendChild(c); }
  var t = document.createElement('div'); t.className = 'jg-toast success';
  t.innerHTML = '<span class="jg-toast-icon">✓</span><span class="jg-toast-message">' + esc(msg) + '</span>';
  var b = document.createElement('button'); b.textContent = '撤销';
  b.style.cssText = 'margin-left:10px;padding:2px 10px;border:1px solid currentColor;border-radius:6px;background:none;color:inherit;cursor:pointer;font-size:12px;flex-shrink:0;';
  b.onclick = function(){ fn(); t.remove(); DeviceUI.toast('已撤销', 'info'); };
  t.appendChild(b); c.appendChild(t);
  setTimeout(function(){ if (t.parentNode){ t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(function(){ t.remove(); }, 300); } }, 6000);
}
function openDrawer(title, html){
  document.getElementById('drawerTitle').textContent = title;
  document.getElementById('drawerBody').innerHTML = html;
  document.getElementById('drawer').classList.add('show');
  document.getElementById('drawerMask').classList.add('show');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('drawerMask').classList.remove('show');
}

/* ---------- 统计卡 ---------- */
function renderStats(){
  var spares = FS.list('spares');
  var low = spares.filter(isLow);
  var value = spares.reduce(function(s,x){ return s + x.stock * priceOf(x); }, 0);
  var today = FS.dayKey(0);
  var todayMoves = FS.list('spareMoves').filter(function(m){ return String(m.time).slice(0,10) === today; });
  var inQty = todayMoves.filter(function(m){ return m.type === '入库'; }).reduce(function(s,m){ return s + m.qty; }, 0);
  var outQty = todayMoves.filter(function(m){ return m.type === '出库'; }).reduce(function(s,m){ return s + m.qty; }, 0);
  document.getElementById('statCards').innerHTML =
    '<div class="stat-card"><div class="stat-label">备件种类</div><div class="stat-value">' + spares.length + '<span class="unit">种</span></div>' +
    '<div class="stat-sub">设备维修 / 保养常用件</div></div>' +
    '<div class="stat-card"><div class="stat-label">低库存项</div><div class="stat-value" style="color:' + (low.length ? '#ff4d4f' : '#52c41a') + ';">' + low.length + '<span class="unit">项</span></div>' +
    '<div class="stat-sub ' + (low.length ? 'err' : '') + '">' + (low.length ? esc(low.map(function(x){ return x.id; }).join('、')) + ' 低于安全库存' : '全部高于安全库存') + '</div></div>' +
    '<div class="stat-card"><div class="stat-label">库存总值</div><div class="stat-value">¥' + value.toLocaleString('zh-CN') + '</div>' +
    '<div class="stat-sub">按页内估价单价计算</div></div>' +
    '<div class="stat-card"><div class="stat-label">今日出入库</div><div class="stat-value">' + todayMoves.length + '<span class="unit">笔</span></div>' +
    '<div class="stat-sub">入库 ' + inQty + ' 件 · 出库 ' + outQty + ' 件</div></div>';
}

/* ---------- 台账筛选 / 排序 ---------- */
function spareFiltered(){
  var stock = document.getElementById('stockSelect').value;
  var kw = document.getElementById('searchInput').value.trim().toLowerCase();
  var list = FS.list('spares').filter(function(x){
    if (stock === 'low' && !isLow(x)) return false;
    if (stock === 'ok' && isLow(x)) return false;
    if (kw){
      var hay = [x.id, x.name, x.spec, x.location, x.unit].join(' ').toLowerCase();
      if (hay.indexOf(kw) < 0) return false;
    }
    return true;
  });
  list.sort(function(a,b){
    var va = a[sortKey], vb = b[sortKey];
    if (sortKey === 'stock') return (va - vb) * sortDir;
    return String(va || '').localeCompare(String(vb || ''), 'zh-CN') * sortDir;
  });
  return list;
}
function setSort(key){
  if (sortKey === key) sortDir = -sortDir; else { sortKey = key; sortDir = 1; }
  renderSpares();
}
function resetFilter(){
  document.getElementById('stockSelect').value = '';
  document.getElementById('searchInput').value = '';
  renderSpares();
  DeviceUI.toast('已重置筛选条件', 'info');
}

/* ---------- 台账表 ---------- */
function renderSpares(){
  var list = spareFiltered();
  document.getElementById('spareCount').textContent = '共 ' + list.length + ' 种 · 低于安全库存标记红色';
  var body = document.getElementById('spareBody');
  if (!list.length){
    body.innerHTML = '<tr class="empty-row"><td colspan="10">暂无符合条件的备件</td></tr>';
  } else {
    body.innerHTML = list.map(function(s){
      var low = isLow(s);
      return '<tr class="clickable" onclick="openSpareDrawer(\'' + esc(s.id) + '\')">' +
        '<td style="text-align:center;" onclick="event.stopPropagation();"><input type="checkbox" ' + (selected[s.id] ? 'checked' : '') + ' onclick="toggleOne(\'' + esc(s.id) + '\',this)"></td>' +
        '<td><strong>' + esc(s.id) + '</strong></td>' +
        '<td>' + esc(s.name) + '</td>' +
        '<td>' + esc(s.spec || '—') + '</td>' +
        '<td class="num-cell' + (low ? ' low' : '') + '">' + s.stock + ' ' + esc(s.unit || '件') + '</td>' +
        '<td class="num-cell">' + s.safety + '</td>' +
        '<td>' + esc(s.location || '—') + '</td>' +
        '<td class="num-cell">' + priceOf(s).toFixed(2) + '</td>' +
        '<td>' + (low ? '<span class="status-tag offline">低库存</span>' : '<span class="status-tag online">充足</span>') + '</td>' +
        '<td onclick="event.stopPropagation();"><div class="action-btns">' +
          '<button class="action-btn move" onclick="openMoveModal(\'' + esc(s.id) + '\')">出入库</button>' +
          '<button class="action-btn edit" onclick="openSpareModal(\'' + esc(s.id) + '\')">编辑</button>' +
          '<button class="action-btn del" onclick="deleteSpare(\'' + esc(s.id) + '\')">删除</button>' +
        '</div></td></tr>';
    }).join('');
  }
  ['id','name','stock'].forEach(function(k){
    document.getElementById('ar-' + k).textContent = sortKey === k ? (sortDir > 0 ? '▲' : '▼') : '';
  });
  var all = document.getElementById('checkAll');
  all.checked = list.length > 0 && list.every(function(x){ return selected[x.id]; });
  renderSelected();
}
function toggleOne(id, box){ if (box.checked) selected[id] = true; else delete selected[id]; renderSelected(); }
function toggleAll(box){
  spareFiltered().forEach(function(x){ if (box.checked) selected[x.id] = true; else delete selected[x.id]; });
  renderSpares();
}
function renderSelected(){
  var ids = Object.keys(selected);
  var btn = document.getElementById('bulkDelBtn');
  btn.disabled = !ids.length;
  btn.textContent = ids.length ? '批量删除（' + ids.length + '）' : '批量删除';
  document.getElementById('selectedInfo').innerHTML = ids.length ? '已选 <strong>' + ids.length + '</strong> 种备件' : '';
}

/* ---------- 台账 CRUD ---------- */
function nextSpareId(){
  var max = 0;
  FS.list('spares').forEach(function(x){ var m = /^SP-(\d+)$/.exec(x.id); if (m) max = Math.max(max, +m[1]); });
  return 'SP-' + pad2(max + 1);
}
function openSpareModal(id){
  editingId = id || '';
  var s = id ? FS.get('spares', id) : null;
  document.getElementById('spareTitle').textContent = s ? '编辑备件 · ' + s.name : '新增备件';
  document.getElementById('sId').value = s ? s.id : '';
  document.getElementById('sId').disabled = !!s;
  document.getElementById('sName').value = s ? s.name : '';
  document.getElementById('sSpec').value = s ? (s.spec || '') : '';
  document.getElementById('sUnit').value = s ? (s.unit || '') : '件';
  document.getElementById('sStock').value = s ? s.stock : '';
  document.getElementById('sSafety').value = s ? s.safety : '';
  document.getElementById('sLocation').value = s ? (s.location || '') : '';
  document.getElementById('spareOverlay').classList.add('show');
  document.getElementById('spareModal').classList.add('show');
}
function closeSpareModal(){
  document.getElementById('spareOverlay').classList.remove('show');
  document.getElementById('spareModal').classList.remove('show');
  editingId = '';
}
function saveSpare(){
  var name = document.getElementById('sName').value.trim();
  if (!name){ DeviceUI.toast('请填写备件名称', 'error'); return; }
  var stock = Number(document.getElementById('sStock').value);
  var safety = Number(document.getElementById('sSafety').value);
  if (document.getElementById('sStock').value === '' || isNaN(stock) || stock < 0){ DeviceUI.toast('请填写有效当前库存（≥0）', 'error'); return; }
  if (document.getElementById('sSafety').value === '' || isNaN(safety) || safety < 0){ DeviceUI.toast('请填写有效安全库存（≥0）', 'error'); return; }
  var id = editingId || document.getElementById('sId').value.trim() || nextSpareId();
  if (!editingId && FS.get('spares', id)){ DeviceUI.toast('备件编号 ' + id + ' 已存在', 'error'); return; }
  var patch = { name: name, spec: document.getElementById('sSpec').value.trim(),
    unit: document.getElementById('sUnit').value.trim() || '件',
    stock: stock, safety: safety, location: document.getElementById('sLocation').value.trim() };
  if (editingId){
    FS.update('spares', editingId, patch);
    DeviceUI.toast('备件信息已更新', 'success');
  } else {
    patch.id = id;
    FS.add('spares', patch);
    DeviceUI.toast('备件已创建', 'success');
  }
  closeSpareModal(); refreshAll();
}
function deleteSpare(id){
  var s = FS.get('spares', id);
  if (!s) return;
  DeviceUI.confirmDelete('确定删除备件「' + s.name + '（' + id + '）」吗？删除后可在提示中撤销。').then(function(ok){
    if (!ok) return;
    var list = FS.list('spares');
    var idx = list.findIndex(function(x){ return x.id === id; });
    FS.remove('spares', id);
    delete selected[id];
    refreshAll();
    undoToast('备件 ' + id + ' 已删除', function(){ FS.restore('spares', s, idx); refreshAll(); });
  });
}
function bulkDelete(){
  var ids = Object.keys(selected);
  if (!ids.length) return;
  DeviceUI.confirmDelete('确定删除选中的 ' + ids.length + ' 种备件吗？删除后可在提示中撤销。').then(function(ok){
    if (!ok) return;
    var list = FS.list('spares');
    var items = ids.map(function(id){
      return { obj: list.filter(function(x){ return x.id === id; })[0], idx: list.findIndex(function(x){ return x.id === id; }) };
    }).filter(function(x){ return x.obj; }).sort(function(a,b){ return a.idx - b.idx; });
    items.forEach(function(x){ FS.remove('spares', x.obj.id); });
    selected = {};
    refreshAll();
    undoToast('已删除 ' + items.length + ' 种备件', function(){
      items.forEach(function(x){ FS.restore('spares', x.obj, x.idx); });
      refreshAll();
    });
  });
}

/* ---------- 出入库 ---------- */
function openMoveModal(spareId){
  var sel = document.getElementById('mSpare');
  sel.innerHTML = FS.list('spares').map(function(s){
    return '<option value="' + esc(s.id) + '">' + esc(s.id + ' · ' + s.name + '（库存 ' + s.stock + '）') + '</option>';
  }).join('');
  if (spareId) sel.value = spareId;
  document.getElementById('mType').value = '入库';
  document.getElementById('mQty').value = '';
  document.getElementById('mRef').value = '';
  document.getElementById('mOperator').value = '张才孙';
  updateMoveHint();
  document.getElementById('moveOverlay').classList.add('show');
  document.getElementById('moveModal').classList.add('show');
}
function closeMoveModal(){
  document.getElementById('moveOverlay').classList.remove('show');
  document.getElementById('moveModal').classList.remove('show');
}
function updateMoveHint(){
  var s = FS.get('spares', document.getElementById('mSpare').value);
  var type = document.getElementById('mType').value;
  var hint = document.getElementById('mStockHint');
  if (!s){ hint.textContent = ''; return; }
  hint.textContent = type === '出库'
    ? '当前库存 ' + s.stock + ' ' + (s.unit || '件') + '，出库数量不得超过当前库存'
    : '当前库存 ' + s.stock + ' ' + (s.unit || '件') + '，入库后即时累加';
}
function saveMove(){
  var s = FS.get('spares', document.getElementById('mSpare').value);
  if (!s){ DeviceUI.toast('请选择备件', 'error'); return; }
  var type = document.getElementById('mType').value;
  var qty = Number(document.getElementById('mQty').value);
  if (!qty || isNaN(qty) || qty < 1 || Math.floor(qty) !== qty){ DeviceUI.toast('请填写有效数量（正整数）', 'error'); return; }
  if (type === '出库' && qty > s.stock){
    DeviceUI.toast('出库数量 ' + qty + ' 超过当前库存 ' + s.stock + '，无法出库', 'error');
    return;
  }
  var newStock = type === '入库' ? s.stock + qty : s.stock - qty;
  FS.update('spares', s.id, { stock: newStock });
  var move = FS.add('spareMoves', { type: type, spare: s.id, qty: qty,
    ref: document.getElementById('mRef').value.trim() || '—',
    operator: document.getElementById('mOperator').value, time: nowStr() });
  DeviceUI.toast(type + '登记成功：' + s.name + ' ×' + qty + '，库存 ' + s.stock + ' → ' + newStock, 'success');
  if (isLow(FS.get('spares', s.id))){
    DeviceUI.toast('注意：' + s.name + ' 已低于安全库存 ' + s.safety + '，请及时补货', 'warning');
  }
  closeMoveModal(); refreshAll();
}

/* ---------- 流水表 ---------- */
function moveFiltered(){
  var type = document.getElementById('moveTypeSelect').value;
  var spare = document.getElementById('moveSpareSelect').value;
  var kw = document.getElementById('moveSearch').value.trim().toLowerCase();
  return FS.list('spareMoves').filter(function(m){
    if (type && m.type !== type) return false;
    if (spare && m.spare !== spare) return false;
    if (kw){
      var hay = [m.id, m.spare, spareLabel(m.spare), m.ref, m.operator, m.type].join(' ').toLowerCase();
      if (hay.indexOf(kw) < 0) return false;
    }
    return true;
  });
}
function renderMoves(){
  var list = moveFiltered();
  var totalPages = Math.max(1, Math.ceil(list.length / MOVE_PAGE_SIZE));
  if (movePage > totalPages) movePage = totalPages;
  var pageData = list.slice((movePage-1)*MOVE_PAGE_SIZE, movePage*MOVE_PAGE_SIZE);
  document.getElementById('moveCount').textContent = '共 ' + list.length + ' 笔';
  var body = document.getElementById('moveBody');
  if (!pageData.length){
    body.innerHTML = '<tr class="empty-row"><td colspan="7">暂无符合条件的流水记录</td></tr>';
  } else {
    body.innerHTML = pageData.map(function(m){
      return '<tr>' +
        '<td><strong>' + esc(m.id) + '</strong></td>' +
        '<td><span class="type-badge ' + (m.type === '入库' ? 'in' : 'out') + '">' + esc(m.type) + '</span></td>' +
        '<td>' + esc(spareLabel(m.spare)) + '</td>' +
        '<td class="num-cell">' + (m.type === '入库' ? '+' : '−') + m.qty + '</td>' +
        '<td>' + esc(m.ref || '—') + '</td>' +
        '<td>' + esc(m.operator) + '</td>' +
        '<td>' + esc(m.time) + '</td></tr>';
    }).join('');
  }
  var pg = '<div class="pagination">';
  pg += '<button class="page-btn ' + (movePage <= 1 ? 'disabled' : '') + '" onclick="gotoMovePage(' + (movePage-1) + ')">‹</button>';
  for (var i = 1; i <= totalPages; i++){
    pg += '<button class="page-btn ' + (i === movePage ? 'active' : '') + '" onclick="gotoMovePage(' + i + ')">' + i + '</button>';
  }
  pg += '<button class="page-btn ' + (movePage >= totalPages ? 'disabled' : '') + '" onclick="gotoMovePage(' + (movePage+1) + ')">›</button>';
  pg += '<span style="margin-left:16px;font-size:13px;color:#6b7b6b;">第 ' + movePage + ' 页/共 ' + totalPages + ' 页，共 ' + list.length + ' 条记录</span></div>';
  document.getElementById('movePagination').innerHTML = pg;
}
function gotoMovePage(n){
  var totalPages = Math.max(1, Math.ceil(moveFiltered().length / MOVE_PAGE_SIZE));
  if (n < 1 || n > totalPages) return;
  movePage = n; renderMoves();
}
function resetMoveFilter(){
  document.getElementById('moveTypeSelect').value = '';
  document.getElementById('moveSpareSelect').value = '';
  document.getElementById('moveSearch').value = '';
  movePage = 1; renderMoves();
  DeviceUI.toast('已重置筛选条件', 'info');
}

/* ---------- 详情抽屉 ---------- */
function openSpareDrawer(id){
  var s = FS.get('spares', id);
  if (!s) return;
  var moves = FS.list('spareMoves').filter(function(m){ return m.spare === id; });
  var rows = [
    ['备件编号', s.id], ['备件名称', s.name], ['规格型号', s.spec || '—'],
    ['当前库存', s.stock + ' ' + (s.unit || '件')], ['安全库存', s.safety + ' ' + (s.unit || '件')],
    ['库位', s.location || '—'], ['单价（估）', '¥' + priceOf(s).toFixed(2)],
    ['库存金额', '¥' + (s.stock * priceOf(s)).toLocaleString('zh-CN')],
    ['库存状态', isLow(s) ? '<span class="status-tag offline">低库存</span>' : '<span class="status-tag online">充足</span>', 'raw']
  ];
  var html = '<div class="drawer-section">台账信息</div><div class="detail-info">' +
    rows.map(function(r){
      return '<div class="detail-row"><span class="detail-label">' + r[0] + '</span><span class="detail-value">' + (r[2] === 'raw' ? r[1] : esc(r[1])) + '</span></div>';
    }).join('') + '</div>';
  html += '<div class="drawer-section">出入库流水（' + moves.length + '）</div>';
  html += moves.length ? moves.map(function(m){
    return '<div class="mini-item"><span class="type-badge ' + (m.type === '入库' ? 'in' : 'out') + '">' + esc(m.type) + '</span>' +
      '<div class="mi-main"><strong>' + (m.type === '入库' ? '+' : '−') + m.qty + '</strong> · ' + esc(m.id) +
      '<div class="mi-sub">' + esc(m.time) + ' · ' + esc(m.operator) + (m.ref && m.ref !== '—' ? ' · 关联 ' + esc(m.ref) : '') + '</div></div></div>';
  }).join('') : '<div style="font-size:12.5px;color:var(--text-tertiary);">暂无流水记录</div>';
  html += '<div style="margin-top:16px;display:flex;gap:8px;">' +
    '<button class="jg-btn jg-btn-primary" onclick="closeDrawer();openMoveModal(\'' + esc(s.id) + '\')">出入库登记</button></div>';
  openDrawer('备件详情 · ' + s.name, html);
}

/* ---------- 导出 ---------- */
function exportSpares(){
  var headers = ['备件编号','备件名称','规格型号','单位','当前库存','安全库存','库位','单价(元)','库存状态'];
  var rows = spareFiltered().map(function(s){
    return [s.id, s.name, s.spec || '', s.unit || '件', s.stock, s.safety, s.location || '', priceOf(s).toFixed(2), isLow(s) ? '低库存' : '充足'];
  });
  DeviceUI.exportCsv('备件台账', headers, rows);
}
function exportMoves(){
  var headers = ['流水单号','类型','备件','数量','关联单据','操作人','时间'];
  var rows = moveFiltered().map(function(m){ return [m.id, m.type, spareLabel(m.spare), m.qty, m.ref || '—', m.operator, m.time]; });
  DeviceUI.exportCsv('出入库流水', headers, rows);
}

/* ---------- 刷新 / 初始化 ---------- */
function refreshAll(){
  renderStats(); renderSpares(); renderMoves();
  DeviceUI.fillSelect('moveSpareSelect', FS.list('spares').map(function(s){ return { value: s.id, label: s.id + ' · ' + s.name }; }), '全部备件');
}
document.addEventListener('DOMContentLoaded', function(){
  DeviceUI.fillSelect('mOperator', DeviceUI.operators(), null);
  refreshAll();
  document.getElementById('searchInput').addEventListener('input', renderSpares);
  document.getElementById('stockSelect').addEventListener('change', renderSpares);
  document.getElementById('moveSearch').addEventListener('input', function(){ movePage = 1; renderMoves(); });
  ['moveTypeSelect','moveSpareSelect'].forEach(function(id){
    document.getElementById(id).addEventListener('change', function(){ movePage = 1; renderMoves(); });
  });
});
</script>
