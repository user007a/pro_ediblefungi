<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%2352c41a'/%3E%3C/svg%3E">
<title>工厂化农业数据管理系统 - 设备运行监控</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/sidebar-layout.css">
<link rel="stylesheet" href="css/page-content.css">
<style>
  .search-input { flex:1; min-width:220px; }
  .modal-close { width:28px; height:28px; border:none; background:var(--gray-100); border-radius:6px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .modal-close:hover { background:var(--error-bg); color:var(--error); }

  .drawer-mask { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:998; opacity:0; visibility:hidden; transition:all .25s; }
  .drawer-mask.show { opacity:1; visibility:visible; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:500px; max-width:94vw; background:var(--bg-card); z-index:999;
    transform:translateX(102%); transition:transform .25s ease; box-shadow:-8px 0 30px rgba(0,0,0,.12); display:flex; flex-direction:column; }
  .drawer.show { transform:none; }
  .drawer-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border-light); }
  .drawer-header h3 { margin:0; font-size:15px; font-weight:600; color:var(--text-primary); }
  .drawer-body { flex:1; overflow-y:auto; padding:16px 20px; }
  .drawer-section { font-weight:600; font-size:13px; color:var(--text-primary); margin:18px 0 8px; }
  .drawer-section:first-child { margin-top:0; }
  .detail-info { padding:12px; background:linear-gradient(135deg,var(--gray-50),var(--gray-100));
    border-radius:12px; margin-bottom:12px; border:1px solid var(--border-default); }
  .detail-row { display:flex; padding:9px 0; border-bottom:1px dashed var(--border-default); font-size:13px; }
  .detail-row:last-child { border-bottom:none; }
  .detail-label { width:104px; color:var(--text-tertiary); flex-shrink:0; }
  .detail-value { flex:1; color:var(--text-primary); word-break:break-all; }

  .status-tag { display:inline-flex; align-items:center; padding:3px 10px; font-size:11.5px;
    font-weight:500; border-radius:20px; white-space:nowrap; }
  .status-tag.online { background:#d9f7be; color:#3a8618; border:1px solid #b7eb8f; }
  .status-tag.offline { background:var(--error-bg); color:#cf1322; border:1px solid #ffccc7; }
  .status-tag.processing { background:var(--info-bg); color:var(--primary-500); border:1px solid var(--info-border); }
  .status-tag.warning { background:var(--warning-bg); color:#ad8b00; border:1px solid var(--warning-border); }
  .status-tag.idle { background:var(--gray-100); color:var(--text-secondary); border:1px solid var(--border-default); }

  .link-banner { display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:12px; margin-bottom:16px;
    background:linear-gradient(90deg,#fff7e6,#fffbe6); border:1px solid #ffe58f; font-size:13px; color:#874d00; }
  .link-banner .lb-icon { width:34px; height:34px; border-radius:10px; background:#fa8c16; color:#fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; }
  .link-banner .lb-main { flex:1; min-width:0; }
  .link-banner .lb-title { font-weight:600; font-size:13.5px; }
  .link-banner .lb-sub { font-size:12px; color:#ad6800; margin-top:2px; }
  .link-banner.closed { background:#f6ffed; border-color:#b7eb8f; color:#3a8618; }
  .link-banner.closed .lb-icon { background:#52c41a; }
  .link-banner.closed .lb-sub { color:#52952c; }

  .stat-card-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:16px; }
  .stat-card-row .stat-card { margin-top:0 !important; cursor:default; }
  .stat-card-row .stat-card:hover { transform:none; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .stat-label { font-size:12px; color:var(--text-tertiary); margin-bottom:6px; }
  .stat-value { font-size:26px; font-weight:700; color:var(--text-primary); font-variant-numeric:tabular-nums; }
  .stat-value .unit { font-size:13px; font-weight:500; color:var(--text-tertiary); margin-left:4px; }
  .stat-sub { margin-top:6px; font-size:12px; color:var(--text-tertiary); }

  .section-title { font-size:14px; font-weight:600; color:var(--text-primary); margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .section-title .count { font-size:12px; font-weight:500; color:var(--text-tertiary); }

  .data-table { min-width:980px; }
  .data-table th { white-space:nowrap; }
  .data-table tbody tr.clickable { cursor:pointer; }
  .data-table tbody tr.clickable:hover { background:#f7fbff; }
  .empty-row td { text-align:center; color:var(--text-tertiary); padding:32px 0; }

  .stepper { display:inline-flex; align-items:center; gap:0; border:1px solid var(--border-default); border-radius:8px; overflow:hidden; background:#fff; }
  .stepper button { width:28px; height:30px; border:none; background:var(--gray-50); cursor:pointer; font-size:15px;
    color:var(--text-secondary); line-height:1; }
  .stepper button:hover { background:var(--primary-50); color:var(--primary-600); }
  .stepper button:disabled { opacity:.4; cursor:not-allowed; }
  .stepper input { width:64px; height:30px; border:none; border-left:1px solid var(--border-light); border-right:1px solid var(--border-light);
    text-align:center; font-size:13px; font-variant-numeric:tabular-nums; color:var(--text-primary); }
  .stepper input:focus { outline:none; background:#f0f8ff; }
  .stepper .sp-unit { padding:0 8px; font-size:11px; color:var(--text-tertiary); background:var(--gray-50); height:30px; display:flex; align-items:center; }
  .sp-range { font-size:11px; color:var(--text-tertiary); margin-top:4px; }

  .action-btns { display:flex; gap:6px; flex-wrap:nowrap; }
  .action-btn { padding:4px 10px; font-size:11.5px; font-weight:500; border:1px solid transparent;
    border-radius:6px; cursor:pointer; white-space:nowrap; background:none; }
  .action-btn.start { color:#3a8618; background:#f6ffed; border-color:#b7eb8f; }
  .action-btn.stop { color:#cf1322; background:var(--error-bg); border-color:#ffccc7; }
  .action-btn.detail { color:#2b6cb0; background:#f5f8fc; border-color:#c5d9f0; }
  .action-btn:disabled { opacity:.45; cursor:not-allowed; }
  .result-ok { color:#3a8618; font-weight:500; }
  .result-fail { color:#cf1322; font-weight:500; }
  #cmdPagination { padding:12px 16px; }
</style>

<script src="js/components/modal.js"></script>

<script src="js/shared/fungi-alert-data.js"></script>
<script src="js/shared/device-ui.js"></script>
<script>
/* ============================================================
 * 设备运行监控（可控设备设定值 / 启停 + 指令流水）
 * 数据源：FungiStore.devices(control:true) / commands；
 * 联动横幅读取 FungiAlertData.get('FA-261116-01')，未闭环即提示。
 * 设定值步进即时 FS.update；启停经确认弹窗后写入 commands 并更新状态。
 * ============================================================ */
var FS = window.FungiStore;
var FAD = window.FungiAlertData;
var esc = DeviceUI.esc;
var STATUS_CLS = { '运行':'online', '待机':'idle', '离线':'offline', '故障':'offline', '联动':'processing', '定时':'warning' };
var SP_META = {
  '加湿器':   { unit:'%RH', step:1,   min:60,  max:99 },
  '新风风机': { unit:'ppm', step:50,  min:400, max:1500 },
  '冷水机组': { unit:'°C',  step:0.5, min:0,   max:10 },
  '循环风机': { unit:'min', step:1,   min:5,   max:60 },
  '照明灯组': { unit:'lx',  step:10,  min:0,   max:500 }
};
var OPERATOR = '张才孙';
var cmdPage = 1, CMD_PAGE_SIZE = 8;

function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function nowStr(){ var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function openPage(url, title){ if (window.parent && window.parent !== window && window.parent.openPage) window.parent.openPage(url, title); else location.href = url; }
function statusTag(s){ return '<span class="status-tag ' + (STATUS_CLS[s] || 'idle') + '">' + esc(s) + '</span>'; }
function zoneName(id){ var z = FS.list('zones').filter(function(x){ return x.id === id; })[0]; return z ? z.name : id; }
function spMeta(d){ return SP_META[d.type] || { unit:'', step:1, min:0, max:9999 }; }
function isRunning(s){ return s === '运行' || s === '联动' || s === '定时'; }
function openDrawer(title, html){
  document.getElementById('drawerTitle').textContent = title;
  document.getElementById('drawerBody').innerHTML = html;
  document.getElementById('drawer').classList.add('show');
  document.getElementById('drawerMask').classList.add('show');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('drawerMask').classList.remove('show');
}

/* ---------- 联动横幅 ---------- */
function renderBanner(){
  var a = FAD.get('FA-261116-01');
  var el = document.getElementById('linkBanner');
  if (!a){ el.innerHTML = ''; return; }
  if (a.status !== 'closed'){
    el.innerHTML = '<div class="link-banner">' +
      '<div class="lb-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg></div>' +
      '<div class="lb-main"><div class="lb-title">GF-02 CO₂ 超标 · 新风 XF-02 联动已启动</div>' +
      '<div class="lb-sub">' + esc(a.id) + ' · ' + esc(a.statusText) + ' · ' + esc(a.time) + ' · 当前 CO₂ 986ppm &gt; 上限 800ppm，XF-02 按联动策略持续换气</div></div>' +
      '<button class="jg-btn jg-btn-primary" onclick="openPage(\'alert_overview.html\',\'预警管理\')">查看预警</button></div>';
  } else {
    el.innerHTML = '<div class="link-banner closed">' +
      '<div class="lb-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg></div>' +
      '<div class="lb-main"><div class="lb-title">GF-02 CO₂ 预警已闭环 · XF-02 联动解除</div>' +
      '<div class="lb-sub">' + esc(a.id) + ' · 已闭环，新风风机恢复常规运行策略</div></div>' +
      '<button class="jg-btn" onclick="openPage(\'alert_overview.html\',\'预警管理\')">查看预警</button></div>';
  }
}

/* ---------- 统计卡 ---------- */
function renderStats(){
  var ctrl = FS.list('devices').filter(function(x){ return x.control; });
  var running = ctrl.filter(function(x){ return isRunning(x.status); }).length;
  var today = FS.dayKey(0);
  var todayCmds = FS.list('commands').filter(function(x){ return String(x.time).slice(0,10) === today; }).length;
  var linked = ctrl.filter(function(x){ return x.status === '联动'; }).length;
  document.getElementById('statCards').innerHTML =
    '<div class="stat-card"><div class="stat-label">可控设备</div><div class="stat-value">' + ctrl.length + '<span class="unit">台</span></div>' +
    '<div class="stat-sub">支持远程设定 / 启停</div></div>' +
    '<div class="stat-card"><div class="stat-label">运行中</div><div class="stat-value" style="color:#52c41a;">' + running + '<span class="unit">台</span></div>' +
    '<div class="stat-sub">含联动 / 定时运行</div></div>' +
    '<div class="stat-card"><div class="stat-label">今日指令</div><div class="stat-value">' + todayCmds + '<span class="unit">条</span></div>' +
    '<div class="stat-sub">含系统联动自动下发</div></div>' +
    '<div class="stat-card"><div class="stat-label">联动生效</div><div class="stat-value" style="color:' + (linked ? '#fa8c16' : 'inherit') + ';">' + linked + '<span class="unit">项</span></div>' +
    '<div class="stat-sub">' + (linked ? 'XF-02 新风联动运行中' : '当前无联动策略生效') + '</div></div>';
}

/* ---------- 可控设备表 ---------- */
function renderCtrl(){
  var ctrl = FS.list('devices').filter(function(x){ return x.control; });
  document.getElementById('ctrlCount').textContent = '共 ' + ctrl.length + ' 台 · 设定值修改即时保存';
  var body = document.getElementById('ctrlBody');
  if (!ctrl.length){
    body.innerHTML = '<tr class="empty-row"><td colspan="6">暂无可控设备</td></tr>';
    return;
  }
  body.innerHTML = ctrl.map(function(d){
    var m = spMeta(d);
    var disabled = d.status === '离线' || d.status === '故障';
    var run = isRunning(d.status);
    var startStop = disabled
      ? '<button class="action-btn stop" disabled title="设备' + esc(d.status) + '，无法下发指令">不可用</button>'
      : (run
        ? '<button class="action-btn stop" onclick="event.stopPropagation();toggleRun(\'' + esc(d.id) + '\',false)">停止</button>'
        : '<button class="action-btn start" onclick="event.stopPropagation();toggleRun(\'' + esc(d.id) + '\',true)">启动</button>');
    return '<tr class="clickable" onclick="openDeviceDrawer(\'' + esc(d.id) + '\')">' +
      '<td><strong>' + esc(d.id) + '</strong></td>' +
      '<td>' + esc(d.name) + '</td>' +
      '<td>' + esc(d.location) + '</td>' +
      '<td>' + statusTag(d.status) + '</td>' +
      '<td onclick="event.stopPropagation();">' +
        '<div class="stepper">' +
          '<button onclick="stepSetpoint(\'' + esc(d.id) + '\',-1)" ' + (disabled ? 'disabled' : '') + '>−</button>' +
          '<input type="number" id="sp-' + esc(d.id) + '" value="' + (d.setpoint != null ? d.setpoint : '') + '" step="' + m.step + '" min="' + m.min + '" max="' + m.max + '" ' + (disabled ? 'disabled' : '') + ' onchange="commitSetpoint(\'' + esc(d.id) + '\',this.value)">' +
          '<button onclick="stepSetpoint(\'' + esc(d.id) + '\',1)" ' + (disabled ? 'disabled' : '') + '>+</button>' +
          '<span class="sp-unit">' + m.unit + '</span>' +
        '</div>' +
        '<div class="sp-range">范围 ' + m.min + '–' + m.max + m.unit + ' · 步进 ' + m.step + '</div>' +
      '</td>' +
      '<td onclick="event.stopPropagation();"><div class="action-btns">' + startStop +
        '<button class="action-btn detail" onclick="openDeviceDrawer(\'' + esc(d.id) + '\')">详情</button>' +
      '</div></td></tr>';
  }).join('');
}
function stepSetpoint(id, dir){
  var d = FS.get('devices', id);
  if (!d) return;
  var m = spMeta(d);
  var v = (d.setpoint != null ? d.setpoint : m.min) + dir * m.step;
  v = Math.max(m.min, Math.min(m.max, +v.toFixed(2)));
  FS.update('devices', id, { setpoint: v });
  FS.add('commands', { device: id, action: '设定' + (d.type === '加湿器' ? '湿度' : d.type === '冷水机组' ? '温度' : '参数'), value: v + m.unit, result: '成功', operator: OPERATOR, time: nowStr() });
  DeviceUI.toast(d.name + ' 设定值已下发：' + v + m.unit, 'success');
  refreshAll();
}
function commitSetpoint(id, raw){
  var d = FS.get('devices', id);
  if (!d) return;
  var m = spMeta(d);
  var v = Number(raw);
  if (raw === '' || isNaN(v)){ DeviceUI.toast('请输入有效数值', 'error'); renderCtrl(); return; }
  if (v < m.min || v > m.max){ DeviceUI.toast('设定值需在 ' + m.min + '–' + m.max + m.unit + ' 范围内', 'error'); renderCtrl(); return; }
  if (v === d.setpoint) return;
  FS.update('devices', id, { setpoint: v });
  FS.add('commands', { device: id, action: '设定' + (d.type === '加湿器' ? '湿度' : d.type === '冷水机组' ? '温度' : '参数'), value: v + m.unit, result: '成功', operator: OPERATOR, time: nowStr() });
  DeviceUI.toast(d.name + ' 设定值已下发：' + v + m.unit, 'success');
  refreshAll();
}
function toggleRun(id, start){
  var d = FS.get('devices', id);
  if (!d) return;
  var verb = start ? '启动' : '停止';
  Modal.confirm('确定' + verb + '设备「' + d.name + '（' + id + '）」吗？指令将立即下发并记录。', {
    title: verb + '确认',
    confirmText: verb,
    danger: !start
  }).then(function(ok){
    if (!ok) return;
    FS.add('commands', { device: id, action: verb, value: '—', result: '成功', operator: OPERATOR, time: nowStr() });
    FS.update('devices', id, { status: start ? '运行' : '待机' });
    DeviceUI.toast(d.name + ' 已' + verb, 'success');
    refreshAll();
  });
}
function openDeviceDrawer(id){
  var d = FS.get('devices', id);
  if (!d) return;
  var m = spMeta(d);
  var cmds = FS.list('commands').filter(function(x){ return x.device === id; });
  var rows = [
    ['设备编号', d.id], ['设备名称', d.name], ['设备类型', d.type],
    ['安装位置', d.location + ' · ' + zoneName(d.location)],
    ['运行状态', statusTag(d.status), 'raw'],
    ['当前设定值', (d.setpoint != null ? d.setpoint : '—') + ' ' + m.unit],
    ['设定范围', m.min + '–' + m.max + m.unit + '（步进 ' + m.step + '）'],
    ['设备型号', d.model || '—'], ['生产厂家', d.maker || '—']
  ];
  var html = '<div class="drawer-section">运行参数</div><div class="detail-info">' +
    rows.map(function(r){
      return '<div class="detail-row"><span class="detail-label">' + r[0] + '</span><span class="detail-value">' + (r[2] === 'raw' ? r[1] : esc(r[1])) + '</span></div>';
    }).join('') + '</div>';
  html += '<div class="drawer-section">指令历史（' + cmds.length + '）</div>';
  html += cmds.length ? cmds.map(function(c){
    return '<div class="detail-row" style="border-bottom:1px dashed var(--border-default);"><span class="detail-label">' + esc(c.time) + '</span>' +
      '<span class="detail-value">' + esc(c.action) + ' · ' + esc(c.value) + ' · <span class="' + (c.result === '成功' ? 'result-ok' : 'result-fail') + '">' + esc(c.result) + '</span> · ' + esc(c.operator) + '</span></div>';
  }).join('') : '<div style="font-size:12.5px;color:var(--text-tertiary);">暂无指令记录</div>';
  openDrawer('运行监控 · ' + d.name, html);
}

/* ---------- 指令记录 ---------- */
function cmdFiltered(){
  var dev = document.getElementById('cmdDeviceSelect').value;
  var res = document.getElementById('cmdResultSelect').value;
  var kw = document.getElementById('cmdSearch').value.trim().toLowerCase();
  return FS.list('commands').filter(function(x){
    if (dev && x.device !== dev) return false;
    if (res && x.result !== res) return false;
    if (kw){
      var hay = [x.id, x.device, x.action, x.value, x.operator, x.result].join(' ').toLowerCase();
      if (hay.indexOf(kw) < 0) return false;
    }
    return true;
  });
}
function renderCmds(){
  var list = cmdFiltered();
  var totalPages = Math.max(1, Math.ceil(list.length / CMD_PAGE_SIZE));
  if (cmdPage > totalPages) cmdPage = totalPages;
  var pageData = list.slice((cmdPage-1)*CMD_PAGE_SIZE, cmdPage*CMD_PAGE_SIZE);
  document.getElementById('cmdCount').textContent = '共 ' + list.length + ' 条';
  var body = document.getElementById('cmdBody');
  if (!pageData.length){
    body.innerHTML = '<tr class="empty-row"><td colspan="7">暂无符合条件的指令记录</td></tr>';
  } else {
    body.innerHTML = pageData.map(function(c){
      return '<tr>' +
        '<td><strong>' + esc(c.id) + '</strong></td>' +
        '<td>' + esc(c.time) + '</td>' +
        '<td>' + esc(c.device) + '</td>' +
        '<td>' + esc(c.action) + '</td>' +
        '<td>' + esc(c.value) + '</td>' +
        '<td><span class="' + (c.result === '成功' ? 'result-ok' : 'result-fail') + '">' + esc(c.result) + '</span></td>' +
        '<td>' + esc(c.operator) + '</td></tr>';
    }).join('');
  }
  var pg = '<div class="pagination">';
  pg += '<button class="page-btn ' + (cmdPage <= 1 ? 'disabled' : '') + '" onclick="gotoCmdPage(' + (cmdPage-1) + ')">‹</button>';
  for (var i = 1; i <= totalPages; i++){
    pg += '<button class="page-btn ' + (i === cmdPage ? 'active' : '') + '" onclick="gotoCmdPage(' + i + ')">' + i + '</button>';
  }
  pg += '<button class="page-btn ' + (cmdPage >= totalPages ? 'disabled' : '') + '" onclick="gotoCmdPage(' + (cmdPage+1) + ')">›</button>';
  pg += '<span style="margin-left:16px;font-size:13px;color:#6b7b6b;">第 ' + cmdPage + ' 页/共 ' + totalPages + ' 页，共 ' + list.length + ' 条记录</span></div>';
  document.getElementById('cmdPagination').innerHTML = pg;
}
function gotoCmdPage(n){
  var totalPages = Math.max(1, Math.ceil(cmdFiltered().length / CMD_PAGE_SIZE));
  if (n < 1 || n > totalPages) return;
  cmdPage = n; renderCmds();
}
function resetCmdFilter(){
  document.getElementById('cmdDeviceSelect').value = '';
  document.getElementById('cmdResultSelect').value = '';
  document.getElementById('cmdSearch').value = '';
  cmdPage = 1; renderCmds();
  DeviceUI.toast('已重置筛选条件', 'info');
}
function exportCommands(){
  var headers = ['指令编号','时间','设备','指令','参数','结果','操作人'];
  var rows = cmdFiltered().map(function(c){ return [c.id, c.time, c.device, c.action, c.value, c.result, c.operator]; });
  DeviceUI.exportCsv('控制指令记录', headers, rows);
}

/* ---------- 刷新 / 初始化 ---------- */
function refreshAll(){ renderBanner(); renderStats(); renderCtrl(); renderCmds(); }
document.addEventListener('DOMContentLoaded', function(){
  var devs = {};
  FS.list('commands').forEach(function(c){ devs[c.device] = true; });
  FS.list('devices').filter(function(d){ return d.control; }).forEach(function(d){ devs[d.id] = true; });
  DeviceUI.fillSelect('cmdDeviceSelect', Object.keys(devs).sort(), '全部设备');
  refreshAll();
  document.getElementById('cmdDeviceSelect').addEventListener('change', function(){ cmdPage = 1; renderCmds(); });
  document.getElementById('cmdResultSelect').addEventListener('change', function(){ cmdPage = 1; renderCmds(); });
  document.getElementById('cmdSearch').addEventListener('input', function(){ cmdPage = 1; renderCmds(); });
  window.addEventListener('fungiAlertChange', renderBanner);
});
